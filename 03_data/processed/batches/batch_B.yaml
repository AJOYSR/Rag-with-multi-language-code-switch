    টগরবনি সেবা হাসপাতালের পক্ষ থেকে এলাকাবাসীকে জানানো যাচ্ছে যে, আগামী ১৫ জানুয়ারি ২০২৭ থেকে হাসপাতালের নিজস্ব অ্যাম্বুলেন্স সেবা দিনরাত ২৪ ঘণ্টা চালু থাকবে। জরুরি রোগী পরিবহনের জন্য হাসপাতালের বহরে বর্তমানে ৪টি অ্যাম্বুলেন্স রয়েছে, যার একটিতে অক্সিজেন ও প্রাথমিক জীবনরক্ষাকারী সরঞ্জাম আছে।

    পৌর এলাকার ভেতরে অ্যাম্বুলেন্স ভাড়া ৮৫০ টাকা। জেলা সদর হাসপাতালে রোগী নিয়ে যাওয়ার ভাড়া ৩,০০০ টাকা। অক্সিজেন সুবিধাসহ অ্যাম্বুলেন্সের ক্ষেত্রে অক্সিজেনের খরচ আলাদাভাবে যোগ হবে। রাতের বেলায় ভাড়ার কোনো পরিবর্তন হবে না।

    অ্যাম্বুলেন্স প্রয়োজন হলে হাসপাতালের জরুরি বিভাগে ফোন করে রোগীর ঠিকানা ও অবস্থা জানাতে হবে। ফোন পাওয়ার পর যত দ্রুত সম্ভব অ্যাম্বুলেন্স পাঠানো হবে। প্রতিটি অ্যাম্বুলেন্সে একজন প্রশিক্ষিত সহকারী থাকবেন, যিনি পথে রোগীর প্রাথমিক যত্ন নেবেন। ভাড়া অ্যাম্বুলেন্স চালকের কাছে নয়, হাসপাতালের কাউন্টারে পরিশোধ করে রসিদ সংগ্রহ করতে হবে।

    সড়ক দুর্ঘটনায় আহত ব্যক্তিকে হাসপাতালে আনার ক্ষেত্রে প্রথমে চিকিৎসা শুরু করা হবে, কাগজপত্রের আনুষ্ঠানিকতা পরে সম্পন্ন করা হবে। অ্যাম্বুলেন্সকে রাস্তা ছেড়ে দিন, একটি জীবন বাঁচাতে সহায়তা করুন।

