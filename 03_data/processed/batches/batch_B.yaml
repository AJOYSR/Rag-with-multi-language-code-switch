    পাটশোলা বিদ্যুৎ বিভাগের আওতাধীন প্রিপেইড মিটার ব্যবহারকারী গ্রাহকদের জানানো যাচ্ছে যে, আগামী ১ মার্চ ২০২৭ থেকে প্রিপেইড মিটার সংক্রান্ত বিভিন্ন সেবার নতুন ফি কার্যকর হবে। গ্রাহকসেবা সহজ করতে বিভাগের অফিসে একটি আলাদা প্রিপেইড সেবা ডেস্ক চালু করা হয়েছে।

    হারানো বা নষ্ট প্রিপেইড কার্ড প্রতিস্থাপনের ফি ৩৭০ টাকা। মিটার এক স্থান থেকে অন্য স্থানে স্থানান্তরের ফি ১,১০০ টাকা। মিটারের মালিকানা পরিবর্তনের জন্য প্রয়োজনীয় কাগজপত্রসহ আবেদন করতে হবে। মিটারে কারিগরি ত্রুটি দেখা দিলে তা বিনামূল্যে পরীক্ষা করে দেওয়া হবে, তবে গ্রাহকের অবহেলায় মিটার নষ্ট হলে মেরামতের খরচ গ্রাহককে বহন করতে হবে।

    প্রিপেইড কার্ড নির্ধারিত ভেন্ডিং স্টেশন, মোবাইল ব্যাংকিং অথবা বিভাগের অ্যাপের মাধ্যমে রিচার্জ করা যাবে। রিচার্জের পর টোকেন নম্বর মিটারে সঠিকভাবে প্রবেশ করাতে হবে। মিটারে ব্যালান্স কম থাকলে সতর্কসংকেত বাজবে, তাই সময়মতো রিচার্জ করার অনুরোধ করা হলো। ছুটির দিনে বা রাতে ব্যালান্স শেষ হলে জরুরি ব্যালান্স ব্যবহারের সুবিধা থাকবে।

    মিটারের সিল ভাঙা বা মিটারে অবৈধ হস্তক্ষেপ দণ্ডনীয় অপরাধ। প্রিপেইড সেবা ডেস্ক কর্মদিবসে সকাল ৯টা থেকে বিকেল ৪টা পর্যন্ত খোলা থাকবে।

