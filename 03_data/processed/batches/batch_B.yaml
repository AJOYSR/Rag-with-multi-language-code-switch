    এ কর্মসূচিতে উপজেলার ৪৩টি বিদ্যালয়ের ছাত্রীদের টিকা দেওয়া হবে। পঞ্চম থেকে নবম শ্রেণির ছাত্রীরা বিদ্যালয়েই টিকা নিতে পারবে। বিদ্যালয়ের বাইরে থাকা দশ থেকে চৌদ্দ বছর বয়সী কিশোরীরা নিকটস্থ কমিউনিটি ক্লিনিক বা স্থায়ী টিকাদান কেন্দ্রে টিকা নিতে পারবে।

    টিকা সম্পূর্ণ বিনামূল্যে এবং এক ডোজই যথেষ্ট। টিকা নেওয়ার আগে অনলাইনে নিবন্ধন করতে হবে; নিবন্ধনের জন্য কিশোরীর জন্ম নিবন্ধন নম্বর প্রয়োজন হবে। যাদের অনলাইন নিবন্ধনে সমস্যা হবে, তাদের বিদ্যালয়ের শ্রেণিশিক্ষক বা স্বাস্থ্যকর্মী নিবন্ধনে সহায়তা করবেন।

    টিকাটি নিরাপদ এবং বিভিন্ন দেশে দীর্ঘদিন ধরে ব্যবহৃত হচ্ছে। টিকা নেওয়ার পর ইনজেকশনের স্থানে সামান্য ব্যথা বা হালকা জ্বর হতে পারে, যা সাধারণত নিজে থেকেই সেরে যায়। অভিভাবকদের প্রতি অনুরোধ, গুজবে কান না দিয়ে আপনার মেয়েকে টিকা দিন। প্রতিটি টিকাদান কেন্দ্রে প্রশিক্ষিত স্বাস্থ্যকর্মী উপস্থিত থাকবেন।

