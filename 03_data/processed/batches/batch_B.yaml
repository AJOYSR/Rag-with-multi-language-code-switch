    ক্যাম্পে মেডিসিন, শিশু, স্ত্রীরোগ, চর্ম, নাক-কান-গলা, চক্ষু ও অর্থোপেডিক বিভাগের রোগী দেখা হবে। ক্যাম্পে বিভিন্ন বিভাগের মোট ১৮ জন বিশেষজ্ঞ চিকিৎসক রোগী দেখবেন। রোগীদের বিনামূল্যে রক্তচাপ, রক্তের শর্করা ও ওজন পরিমাপ করা হবে এবং প্রয়োজনীয় কিছু ওষুধ বিনামূল্যে দেওয়া হবে।

    ক্যাম্পের দিন চিকিৎসকের পরামর্শে করা যেকোনো প্যাথলজি পরীক্ষায় ৪০ শতাংশ ছাড় দেওয়া হবে। জটিল রোগীদের পরবর্তী চিকিৎসার জন্য হাসপাতালের বহির্বিভাগে কম খরচে ফলো-আপের ব্যবস্থা করা হবে।

    রোগীদের সকাল ৮টা থেকে হাসপাতালের প্রধান ফটকের পাশে নিবন্ধন বুথে নাম নিবন্ধন করতে হবে। আগে এলে আগে সেবা পাবেন ভিত্তিতে রোগী দেখা হবে। আগের প্রেসক্রিপশন ও পরীক্ষার রিপোর্ট থাকলে সঙ্গে আনার অনুরোধ করা হলো। প্রবীণ, প্রতিবন্ধী ও গর্ভবতী নারীদের জন্য আলাদা লাইনের ব্যবস্থা থাকবে। ক্যাম্প সফল করতে স্থানীয় স্বেচ্ছাসেবী সংগঠনগুলো সহযোগিতা করবে।

