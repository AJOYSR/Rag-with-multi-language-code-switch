    প্রতিটি খাদ্য প্রতিষ্ঠানকে পৌরসভা থেকে স্বাস্থ্য সনদ নিতে হবে। স্বাস্থ্য সনদের বার্ষিক ফি ৬০০ টাকা। রান্নাঘর পরিষ্কার-পরিচ্ছন্ন রাখতে হবে, খাবার ঢেকে রাখতে হবে এবং কর্মীদের মাথায় টুপি ও হাতে গ্লাভস ব্যবহার করতে হবে। পচা বা বাসি খাবার বিক্রি এবং খাবারে ক্ষতিকর রং মেশানো সম্পূর্ণ নিষিদ্ধ।

    খাদ্য নিরাপত্তা সংক্রান্ত অভিযোগ গ্রহণের দায়িত্বে থাকবেন স্যানিটারি ইন্সপেক্টর মনিরুজ্জামান পাটোয়ারী। নিয়মিত পরিদর্শন কার্যক্রমের তত্ত্বাবধান করবেন পৌর স্বাস্থ্য কর্মকর্তা ডা. ইশরাত জাহান কেয়া। ভোক্তারা ভেজাল বা অস্বাস্থ্যকর খাবারের বিষয়ে প্রমাণসহ অভিযোগ জানাতে পারবেন এবং অভিযোগকারীর পরিচয় গোপন রাখা হবে।

    নির্দেশনা অমান্যকারী প্রতিষ্ঠানকে প্রথমবার সতর্ক করা হবে এবং পুনরাবৃত্তি হলে জরিমানা করা হবে ও প্রয়োজনে প্রতিষ্ঠান সাময়িকভাবে বন্ধ করে দেওয়া হবে। নিরাপদ খাদ্য সবার অধিকার; সুস্থ জাতি গঠনে সকলের সহযোগিতা কামনা করা হচ্ছে।

