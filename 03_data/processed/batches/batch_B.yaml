    গর্ভবতী মায়েদের আগের সব প্রেসক্রিপশন ও পরীক্ষার রিপোর্ট সঙ্গে আনতে অনুরোধ করা হলো। চেম্বারে আসার সময় রোগীর সঙ্গে সর্বোচ্চ একজন সহযোগী আসতে পারবেন। জরুরি প্রসূতি রোগীদের জন্য ক্লিনিকের জরুরি বিভাগ আগের মতোই সার্বক্ষণিক খোলা থাকবে। ক্লিনিকের নিচতলার ফার্মেসি ও প্যাথলজি সেবা বৈকালিক চেম্বার চলাকালীন খোলা থাকবে। চেম্বারে আসার আগে সিরিয়াল নম্বর নিশ্চিত করে নেওয়ার অনুরোধ রইল, যাতে অপেক্ষার সময় কম হয়।

