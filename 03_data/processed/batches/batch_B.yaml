    আবাসিক নতুন সংযোগের জন্য এককালীন সংযোগ ফি ৩,৮০০ টাকা। বাণিজ্যিক প্রতিষ্ঠানের ক্ষেত্রে সংযোগ ফি ৯,৫০০ টাকা। সংযোগ ফি পৌরসভার নির্ধারিত ব্যাংক হিসাবে জমা দিয়ে রসিদের কপি আবেদনের সঙ্গে দিতে হবে। আবেদন যাচাইয়ের পর পরিদর্শকের প্রতিবেদন সাপেক্ষে সংযোগ দেওয়া হবে। সংযোগের সময় গ্রাহককে নিজ খরচে অনুমোদিত মানের পাইপ ও মিটার কিনতে হবে।

    অবৈধ সংযোগ চিহ্নিত হলে তা বিচ্ছিন্ন করে জরিমানা আদায় করা হবে। পানির অপচয় রোধে সকলের সহযোগিতা কামনা করা হচ্ছে। বিস্তারিত জানতে কর্মদিবসে সকাল ৯টা থেকে বিকেল ৪টা পর্যন্ত গ্রাহকসেবা কেন্দ্রে যোগাযোগ করুন।

