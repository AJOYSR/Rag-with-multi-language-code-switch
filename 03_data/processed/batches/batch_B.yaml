    পচনশীল বর্জ্যের মধ্যে রয়েছে রান্নাঘরের উচ্ছিষ্ট, সবজির খোসা ও পচা ফলমূল। অপচনশীল বর্জ্যের মধ্যে রয়েছে প্লাস্টিক, কাগজ, কাচ ও ধাতব সামগ্রী। কর্মসূচির শুরুতে প্রতিটি বাসায় পৌরসভার পক্ষ থেকে বিনামূল্যে দুটি ডাস্টবিন দেওয়া হবে। সবুজ রঙের পাত্রে পচনশীল এবং নীল রঙের পাত্রে অপচনশীল বর্জ্য রাখতে হবে।

    পচনশীল বর্জ্য প্রতিদিন সকালে এবং অপচনশীল বর্জ্য সপ্তাহে দুই দিন সংগ্রহ করা হবে। সংগৃহীত পচনশীল বর্জ্য থেকে পৌরসভার কম্পোস্ট প্ল্যান্টে জৈব সার তৈরি করা হবে। ওষুধের খালি বোতল, ব্যাটারি ও ইলেকট্রনিক বর্জ্য আলাদা ব্যাগে রেখে পরিচ্ছন্নতাকর্মীদের হাতে দিতে হবে।

    কর্মসূচি সম্পর্কে সচেতনতা বাড়াতে প্রতিটি ওয়ার্ডে উঠান বৈঠক করা হবে। বর্জ্য আলাদা না করে ফেললে প্রথমবার সতর্ক করা হবে এবং পুনরাবৃত্তি হলে জরিমানা করা হতে পারে। পরিচ্ছন্ন শহর গড়তে সকলের আন্তরিক সহযোগিতা কামনা করা হচ্ছে।

