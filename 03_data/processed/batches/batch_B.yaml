    সম্মানিত রোগী ও তাঁদের স্বজনদের জানানো যাচ্ছে যে, শিরীষতলি জেনারেল হাসপাতালের নবনির্মিত পাঁচতলা ভবনে আগামী ১ মার্চ ২০২৭ থেকে অন্তর্বিভাগের কার্যক্রম শুরু হবে। নতুন ভবনে মোট ৬০টি শয্যা যুক্ত হচ্ছে, যার মধ্যে সাধারণ ওয়ার্ড, কেবিন এবং আলাদা শিশু ওয়ার্ড রয়েছে।

    সাধারণ ওয়ার্ডের প্রতিটি শয্যার দৈনিক ভাড়া ৪৫০ টাকা। সাধারণ কেবিনের দৈনিক ভাড়া ১,৮০০ টাকা। শীতাতপনিয়ন্ত্রিত কেবিনের দৈনিক ভাড়া ৩,২০০ টাকা, যেখানে রোগীর একজন সহযোগীর থাকার ব্যবস্থা রয়েছে। শয্যা ভাড়ার মধ্যে চিকিৎসকের রাউন্ড, নার্সিং সেবা ও তিন বেলার খাবার অন্তর্ভুক্ত থাকবে, তবে ওষুধ ও পরীক্ষার খরচ আলাদাভাবে পরিশোধ করতে হবে।

    ভর্তির সময় অগ্রিম হিসেবে তিন দিনের শয্যা ভাড়া জমা দিতে হবে। ছাড়পত্র নেওয়ার সময় চূড়ান্ত বিল পরিশোধ করতে হবে। দরিদ্র রোগীদের জন্য হাসপাতালের সমাজসেবা কার্যালয়ের সুপারিশ সাপেক্ষে শয্যা ভাড়ায় ছাড়ের ব্যবস্থা রয়েছে।

    রোগীর সঙ্গে দর্শনার্থীরা প্রতিদিন বিকেল ৪টা থেকে সন্ধ্যা ৬টা পর্যন্ত দেখা করতে পারবেন। হাসপাতাল প্রাঙ্গণে ধূমপান সম্পূর্ণ নিষিদ্ধ। কেবিন বরাদ্দ সাপেক্ষে দেওয়া হবে, তাই আগে থেকে অভ্যর্থনা কক্ষে যোগাযোগ করার অনুরোধ করা হলো।

