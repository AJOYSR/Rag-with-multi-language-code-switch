    ছোট দোকানের নতুন ট্রেড লাইসেন্স ফি ১,২০০ টাকা। পুরোনো লাইসেন্স নবায়নের ফি ৭০০ টাকা। দোকানের সাইনবোর্ডের জন্য বার্ষিক ৩০০ টাকা কর দিতে হবে। নতুন লাইসেন্সের আবেদনের সঙ্গে দোকানের ভাড়ার চুক্তিপত্র বা মালিকানার কাগজ, জাতীয় পরিচয়পত্রের ফটোকপি এবং দুই কপি ছবি জমা দিতে হবে।

    চলতি অর্থবছরের ট্রেড লাইসেন্স নবায়নের শেষ তারিখ ৩০ সেপ্টেম্বর ২০২৭। নির্ধারিত সময়ের মধ্যে নবায়ন না করলে বিধি অনুযায়ী জরিমানা আদায় করা হবে। খাদ্যপণ্য ও ওষুধ বিক্রির দোকানের ক্ষেত্রে সংশ্লিষ্ট দপ্তরের অনুমতিপত্রও জমা দিতে হবে।

    শিগগিরই পৌরসভার ভ্রাম্যমাণ দল দোকানে দোকানে গিয়ে ট্রেড লাইসেন্স যাচাই করবে। লাইসেন্স দোকানের দৃশ্যমান স্থানে টাঙিয়ে রাখতে হবে। আবেদন ও ফি জমার সময় অবশ্যই পৌরসভার রসিদ সংগ্রহ করুন।

