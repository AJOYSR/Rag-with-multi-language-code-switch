    ক্যাম্পেইন উপলক্ষে ইউনিয়নজুড়ে মোট ২৭টি অস্থায়ী টিকাদান কেন্দ্র স্থাপন করা হবে। প্রথম তিন দিন টিকা দেওয়া হবে এলাকার প্রাথমিক বিদ্যালয় ও মাদ্রাসায়, এরপর অস্থায়ী কেন্দ্রগুলোতে। প্রতিটি কেন্দ্রে প্রশিক্ষিত স্বাস্থ্যকর্মী ও স্বেচ্ছাসেবক দায়িত্ব পালন করবেন। টিকাদান কেন্দ্র সকাল ৮টা থেকে বিকেল ৩টা পর্যন্ত খোলা থাকবে।

    টিকা সম্পূর্ণ বিনামূল্যে দেওয়া হবে। শিশুর টিকা কার্ড বা জন্ম নিবন্ধন সনদ সঙ্গে আনতে হবে; না থাকলে কেন্দ্রেই নতুন টিকা কার্ড দেওয়া হবে। জ্বর বা গুরুতর অসুস্থ শিশুকে সুস্থ হওয়ার পর টিকা দেওয়া হবে। টিকা নেওয়ার পর শিশুকে আধা ঘণ্টা কেন্দ্রে অপেক্ষা করাতে হবে।

    টিকা নেওয়ার পর হালকা জ্বর বা ব্যথা হলে আতঙ্কিত হওয়ার কিছু নেই। কোনো সমস্যা দেখা দিলে নিকটস্থ স্বাস্থ্যকর্মীর সঙ্গে যোগাযোগ করুন। আপনার শিশুকে টিকা দিয়ে রোগমুক্ত ভবিষ্যৎ নিশ্চিত করুন।

