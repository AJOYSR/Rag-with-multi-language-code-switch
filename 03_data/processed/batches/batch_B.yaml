    বর্ষা মৌসুমে ডেঙ্গুর প্রকোপ বৃদ্ধির আশঙ্কায় চন্দনঝুরি ওয়ার্ড কার্যালয়ের উদ্যোগে ওয়ার্ডের সকল মহল্লায় বিশেষ পরিচ্ছন্নতা ও মশক নিধন অভিযান পরিচালনার সিদ্ধান্ত নেওয়া হয়েছে। এডিস মশার প্রজননস্থল ধ্বংস করাই এই অভিযানের প্রধান লক্ষ্য।

    বিশেষ পরিচ্ছন্নতা অভিযান আগামী ১৯ জুন ২০২৭ তারিখে সকাল ৮টা থেকে শুরু হবে। অভিযানে পরিচ্ছন্নতাকর্মীদের পাশাপাশি স্থানীয় স্কুল-কলেজের শিক্ষার্থী ও স্বেচ্ছাসেবকরা অংশ নেবেন। স্বেচ্ছাসেবক দলের সমন্বয় করবেন মাহফুজা আক্তার রুমকি। আগ্রহী তরুণদের ওয়ার্ড কার্যালয়ে নাম নিবন্ধন করার আহ্বান জানানো হচ্ছে।

    অভিযানের অংশ হিসেবে ড্রেন ও জলাবদ্ধ স্থান পরিষ্কার করা হবে এবং লার্ভা ধ্বংসের ওষুধ ছিটানো হবে। এছাড়া ৩০ জুন ২০২৭ পর্যন্ত প্রতিদিন বিকেলে ফগার মেশিনের মাধ্যমে মশার ওষুধ ছিটানো হবে।

    বাসিন্দাদের প্রতি অনুরোধ, বাড়ির ছাদ, ফুলের টব, পুরোনো টায়ার, ডাবের খোসা ও পরিত্যক্ত পাত্রে যেন তিন দিনের বেশি পানি জমে না থাকে। নির্মাণাধীন ভবনে পানি জমে থাকলে ভবন মালিককে জরিমানা করা হবে। জ্বর হলে দেরি না করে নিকটস্থ স্বাস্থ্যকেন্দ্রে গিয়ে ডেঙ্গু পরীক্ষা করানোর পরামর্শ দেওয়া হচ্ছে। ডেঙ্গুমুক্ত এলাকা গড়তে সকলের সহযোগিতা কামনা করছি।

