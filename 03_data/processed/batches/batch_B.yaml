    কেশরদাম বিশেষায়িত হাসপাতালের সম্মানিত রোগীদের জানানো যাচ্ছে যে, রোগীর ক্রমবর্ধমান চাপ বিবেচনায় আগামী ৭ ফেব্রুয়ারি ২০২৭ থেকে হাসপাতালের বহির্বিভাগে বৈকালিক শিফট চালু করা হচ্ছে। এখন থেকে বহির্বিভাগ সকাল ৮টা থেকে দুপুর ২টা এবং বিকেল ৪টা থেকে রাত ৮টা পর্যন্ত খোলা থাকবে।

    বহির্বিভাগে হৃদরোগ, কিডনি, স্নায়ুরোগ, ডায়াবেটিস ও হরমোন এবং বাতব্যথা বিভাগের বিশেষজ্ঞ চিকিৎসকরা রোগী দেখবেন। বিশেষজ্ঞ চিকিৎসকের পরামর্শ ফি ৭০০ টাকা। হাসপাতালের বিশেষজ্ঞ চিকিৎসকদের সঙ্গে ভিডিও কলের মাধ্যমে টেলিমেডিসিন পরামর্শও নেওয়া যাবে। পরামর্শের পর প্রেসক্রিপশনের কপি রোগীর মোবাইলে পাঠানো হবে।

    সিরিয়াল নেওয়ার জন্য হাসপাতালের তথ্যকেন্দ্রে ফোন করতে হবে অথবা সরাসরি টিকিট কাউন্টারে আসতে হবে। প্রবীণ, প্রতিবন্ধী ও গর্ভবতী রোগীদের জন্য আলাদা কাউন্টার থাকবে। ফলো-আপ রোগীদের আগের প্রেসক্রিপশন ও পরীক্ষার রিপোর্ট সঙ্গে আনতে হবে।

    হাসপাতালের ফার্মেসি ও ডায়াগনস্টিক বিভাগ বৈকালিক শিফট চলাকালীনও খোলা থাকবে। হাসপাতাল প্রাঙ্গণে পার্কিংয়ের জায়গা সীমিত, তাই সম্ভব হলে গণপরিবহন ব্যবহার করার অনুরোধ করা হলো। আমাদের লক্ষ্য মানসম্মত বিশেষায়িত চিকিৎসা সবার কাছে পৌঁছে দেওয়া।

