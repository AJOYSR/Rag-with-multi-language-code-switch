    ক্লিনিক পরিচালনায় স্থানীয় কমিউনিটি গ্রুপ সহযোগিতা করবে। ক্লিনিকের সেবার মান নিয়ে কোনো অভিযোগ বা পরামর্শ থাকলে ক্লিনিকে রাখা অভিযোগ বাক্সে লিখিতভাবে জানানো যাবে। মা ও শিশুর স্বাস্থ্য সুরক্ষায় নিকটস্থ কমিউনিটি ক্লিনিকের সেবা নিন।

