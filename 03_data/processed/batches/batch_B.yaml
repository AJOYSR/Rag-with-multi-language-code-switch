    কলাবতী চক্ষু হাসপাতালের উদ্যোগে দরিদ্র ও প্রবীণ রোগীদের জন্য আগামী ৬ ফেব্রুয়ারি ২০২৭ থেকে তিন দিনব্যাপী বিনামূল্যে ছানি অপারেশন ক্যাম্পের আয়োজন করা হয়েছে। ক্যাম্পে প্রথমে চোখ পরীক্ষা করে অপারেশনের উপযুক্ত রোগী বাছাই করা হবে। ক্যাম্পে সর্বোচ্চ ১২০ জন রোগীর বিনামূল্যে ছানি অপারেশন করা হবে।

    ক্যাম্পের ছানি অপারেশন করবেন হাসপাতালের জ্যেষ্ঠ চক্ষু সার্জন ডা. আরিফুজ্জামান মৃধা। অপারেশনের পর রোগীদের বিনামূল্যে লেন্স, চোখের ড্রপ ও কালো চশমা দেওয়া হবে। অপারেশনের পরদিন রোগীদের চোখ পরীক্ষা করে ছাড়পত্র দেওয়া হবে।

    রোগী বাছাই ও নিবন্ধনের সার্বিক দায়িত্বে থাকবেন ক্যাম্প সমন্বয়ক নুসরাত জাহান লিপি। নিবন্ধনের জন্য রোগীকে জাতীয় পরিচয়পত্রের ফটোকপি এবং একজন সহযোগী সঙ্গে নিয়ে আসতে হবে। ডায়াবেটিস বা উচ্চ রক্তচাপ থাকলে নিয়মিত ওষুধ ও আগের প্রেসক্রিপশন সঙ্গে আনতে হবে, কারণ রক্তে শর্করা নিয়ন্ত্রণে না থাকলে অপারেশন করা যাবে না।

    দূরের রোগীদের জন্য হাসপাতালে রাতে থাকার সীমিত ব্যবস্থা রয়েছে। ক্যাম্প চলাকালীন হাসপাতালের নিয়মিত বহির্বিভাগ সেবা স্বাভাবিক থাকবে। এই মহৎ উদ্যোগে এলাকার জনপ্রতিনিধি ও সমাজকর্মীদের সহযোগিতা কামনা করা হচ্ছে।

