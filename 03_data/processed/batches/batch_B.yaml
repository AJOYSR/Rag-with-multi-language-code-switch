    এবারের কর্মসূচিতে ২২০ ব্যাগ রক্ত সংগ্রহের লক্ষ্য নির্ধারণ করা হয়েছে। সংগৃহীত রক্ত প্রয়োজনীয় স্ক্রিনিং শেষে ব্লাড ব্যাংকে সংরক্ষণ করা হবে এবং দরিদ্র রোগীদের বিনামূল্যে সরবরাহ করা হবে।

    আঠারো থেকে ষাট বছর বয়সী সুস্থ নারী-পুরুষ রক্ত দিতে পারবেন। রক্তদাতার ওজন অন্তত ৫০ কেজি হতে হবে। শেষবার রক্তদানের পর অন্তত চার মাস পার না হলে আবার রক্ত দেওয়া যাবে না। রক্ত দেওয়ার আগে প্রত্যেক দাতার রক্তচাপ ও হিমোগ্লোবিন পরীক্ষা করা হবে। রক্তদানের দিন সকালে ভালোভাবে খাবার খেয়ে আসার এবং পর্যাপ্ত পানি পান করার অনুরোধ করা হলো।

    প্রত্যেক রক্তদাতাকে একটি রক্তদাতা কার্ড, সনদপত্র এবং হালকা নাশতা দেওয়া হবে। রক্তদাতা কার্ড দেখিয়ে পরবর্তী এক বছর দাতা নিজে বা তাঁর পরিবারের সদস্য প্রয়োজনে অগ্রাধিকার ভিত্তিতে রক্ত পাবেন। আগ্রহীদের ব্লাড ব্যাংকের কাউন্টারে আগে থেকে নাম নিবন্ধন করার অনুরোধ করা হচ্ছে।

