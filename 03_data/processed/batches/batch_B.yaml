    মুক্তাঝুরি ডেন্টাল কেয়ারের সম্মানিত রোগীদের জানানো যাচ্ছে যে, আধুনিক যন্ত্রপাতি সংযোজনের পর আগামী ১ ফেব্রুয়ারি ২০২৭ থেকে চেম্বারে দাঁতের বিভিন্ন চিকিৎসার নতুন সেবামূল্য কার্যকর হবে। চেম্বারে এখন ডিজিটাল এক্স-রে এবং জীবাণুমুক্তকরণের উন্নত ব্যবস্থা রয়েছে।

    দন্ত চিকিৎসকের সাধারণ পরামর্শ ফি ৫০০ টাকা। দাঁত পরিষ্কার বা স্কেলিংয়ের খরচ ১,৫০০ টাকা। সাধারণ দাঁত তোলার খরচ ৮০০ টাকা। প্রতিটি দাঁতের রুট ক্যানেল চিকিৎসার খরচ ৪,৮০০ টাকা, যার মধ্যে প্রয়োজনীয় এক্স-রে অন্তর্ভুক্ত। দাঁতে ক্যাপ বা ক্রাউন লাগানোর খরচ উপকরণের ধরন অনুযায়ী আলাদা হবে।

    শিশুদের দাঁতের যত্ন বিষয়ে সচেতনতা বাড়াতে আগামী ২৭ ফেব্রুয়ারি ২০২৭ তারিখে বারো বছরের কম বয়সী শিশুদের জন্য বিনামূল্যে দাঁত পরীক্ষার ক্যাম্প অনুষ্ঠিত হবে। ক্যাম্পে শিশুদের সঠিকভাবে দাঁত ব্রাশ করার পদ্ধতি শেখানো হবে এবং বিনামূল্যে টুথব্রাশ দেওয়া হবে।

    চেম্বার শুক্রবার ছাড়া প্রতিদিন বিকেল ৪টা থেকে রাত ৯টা পর্যন্ত খোলা থাকবে। চিকিৎসা নিতে আগে থেকে ফোনে সিরিয়াল নেওয়ার অনুরোধ করা হলো। ডায়াবেটিস, হৃদরোগ বা রক্ত পাতলা করার ওষুধ সেবনকারী রোগীরা চিকিৎসার আগে অবশ্যই চিকিৎসককে জানাবেন।

