    ফার্মেসিতে সার্বক্ষণিক একজন প্রশিক্ষিত ফার্মাসিস্ট দায়িত্ব পালন করবেন। নিবন্ধিত চিকিৎসকের প্রেসক্রিপশন ছাড়া অ্যান্টিবায়োটিক, ঘুমের ওষুধ ও অন্যান্য নিয়ন্ত্রিত ওষুধ বিক্রি করা হবে না। প্রেসক্রিপশনের ছবি আগে পাঠিয়ে রাখলে ওষুধ প্রস্তুত করে রাখা হবে। এলাকার দুই কিলোমিটারের মধ্যে বাসায় ওষুধ পৌঁছে দেওয়ার ব্যবস্থাও থাকবে।

    নিয়মিত গ্রাহকদের জন্য সদস্য কার্ড চালু করা হচ্ছে। সদস্য কার্ডধারীরা সব ধরনের ওষুধ কেনায় ১২ শতাংশ ছাড় পাবেন। সদস্য কার্ড পেতে ফার্মেসির কাউন্টারে নাম, ঠিকানা ও মোবাইল নম্বর দিয়ে নিবন্ধন করতে হবে। মূল্য পরিশোধ নগদ, ডেবিট কার্ড অথবা মোবাইল ব্যাংকিংয়ের মাধ্যমে করা যাবে।

