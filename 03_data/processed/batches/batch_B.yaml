    নীলাম্বরী ভ্যাকসিনেশন সেন্টারের পক্ষ থেকে জানানো যাচ্ছে যে, আগামী ৫ জানুয়ারি ২০২৭ থেকে সেন্টারে শিশু ও প্রাপ্তবয়স্কদের জন্য বিভিন্ন ঐচ্ছিক টিকার নিয়মিত সেবা চালু করা হচ্ছে। সরকারি টিকাদান কর্মসূচির বাইরের টিকাগুলো চিকিৎসকের পরামর্শ অনুযায়ী এখানে দেওয়া হবে।

    টিকার মূল্য নিম্নরূপ নির্ধারণ করা হয়েছে। হেপাটাইটিস বি টিকার প্রতি ডোজের মূল্য ৪৫০ টাকা। টাইফয়েড টিকার প্রতি ডোজের মূল্য ৯২০ টাকা। মৌসুমি ইনফ্লুয়েঞ্জা টিকার মূল্য ১,৩৫০ টাকা, যা বছরে একবার নেওয়ার পরামর্শ দেওয়া হয়। টিকার মূল্যের মধ্যে সিরিঞ্জ ও টিকা কার্ড অন্তর্ভুক্ত।

    টিকা নেওয়ার আগে কর্তব্যরত চিকিৎসক প্রত্যেকের স্বাস্থ্যগত অবস্থা যাচাই করবেন। গর্ভবতী নারী ও দীর্ঘমেয়াদি রোগে আক্রান্ত ব্যক্তিদের চিকিৎসকের লিখিত পরামর্শ সঙ্গে আনতে হবে। টিকা নেওয়ার পর অন্তত ১৫ মিনিট সেন্টারে পর্যবেক্ষণে থাকতে হবে।

    সেন্টার শুক্রবার ছাড়া প্রতিদিন সকাল ৯টা থেকে রাত ৮টা পর্যন্ত খোলা থাকবে। পরবর্তী ডোজের তারিখ মনে করিয়ে দিতে মোবাইলে বার্তা পাঠানো হবে। টিকার সঠিক তাপমাত্রা বজায় রাখতে সেন্টারে আধুনিক কোল্ড চেইন ব্যবস্থা রয়েছে। প্রতিষ্ঠান বা অফিসের কর্মীদের জন্য দলগত টিকাদানের ব্যবস্থাও করা যাবে; এজন্য আগে থেকে যোগাযোগ করতে হবে।

