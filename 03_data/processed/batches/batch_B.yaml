    বাসাবাড়ি থেকে বর্জ্য সংগ্রহের জন্য শাখার ১৩টি ভ্যান প্রতিদিন পৌর এলাকায় কাজ করবে। প্রতিটি ভ্যানের সঙ্গে দুজন পরিচ্ছন্নতাকর্মী থাকবেন এবং তাঁরা বাঁশি বাজিয়ে নিজেদের আগমনের সংকেত দেবেন। সংগৃহীত বর্জ্য পৌরসভার নির্ধারিত ডাম্পিং স্টেশনে নিয়ে যাওয়া হবে।

    বাসিন্দাদের পচনশীল ও অপচনশীল বর্জ্য আলাদা ব্যাগে রাখার অনুরোধ করা হলো। প্লাস্টিক, কাচ ও ধাতব বর্জ্য সপ্তাহে একদিন আলাদাভাবে সংগ্রহ করা হবে। বর্জ্য সংগ্রহ সেবার জন্য প্রতিটি বাসা থেকে মাসিক ৮০ টাকা সেবা চার্জ আদায় করা হবে, যা পৌরসভার রসিদের মাধ্যমে পরিশোধ করতে হবে। রসিদ ছাড়া কাউকে কোনো অর্থ না দেওয়ার জন্য অনুরোধ করা হচ্ছে।

    নির্মাণসামগ্রীর বর্জ্য ও বড় আকারের আসবাবপত্র সরানোর জন্য শাখার অফিসে আলাদাভাবে আবেদন করতে হবে। পরিচ্ছন্ন ও স্বাস্থ্যকর শহর গড়তে সকল নাগরিকের সহযোগিতা কামনা করা হচ্ছে।

