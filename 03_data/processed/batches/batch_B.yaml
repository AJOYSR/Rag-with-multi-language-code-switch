    ভেটুলজুড়ি ইউনিয়ন পরিষদের আওতাধীন সকল নাগরিকের অবগতির জন্য জানানো যাচ্ছে যে, অনলাইন নিবন্ধন সার্ভার হালনাগাদ এবং পুরোনো নিবন্ধন তথ্য নতুন সার্ভারে স্থানান্তরের কারণে আগামী ১০ জানুয়ারি ২০২৭ থেকে পরিষদের ডিজিটাল সেন্টারে জন্ম ও মৃত্যু নিবন্ধন সেবা সাময়িকভাবে বন্ধ থাকবে।

    আগামী ২৬ জানুয়ারি ২০২৭ তারিখ থেকে পুনরায় নিবন্ধন সেবা চালু হবে। সেবা বন্ধ থাকাকালে নতুন আবেদন, সনদ সংশোধন বা সনদের অনুলিপি সরবরাহ করা সম্ভব হবে না। তবে ইতিমধ্যে যেসব আবেদন অনুমোদিত হয়েছে, সেগুলোর সনদ পরিষদের সচিবের কাছ থেকে সংগ্রহ করা যাবে।

    জরুরি প্রয়োজনে, যেমন বিদেশযাত্রা বা চিকিৎসার জন্য সনদ প্রয়োজন হলে, প্রমাণপত্রসহ পরিষদের চেয়ারম্যানের কাছে লিখিত আবেদন করা যাবে। মৃত্যু নিবন্ধনের ক্ষেত্রে মৃত্যুর ৪৫ দিনের মধ্যে আবেদন করলে কোনো ফি লাগে না। মৃত্যু নিবন্ধনের আবেদনের সঙ্গে চিকিৎসক বা ইউপি সদস্যের প্রত্যয়নপত্র এবং মৃত ব্যক্তির জাতীয় পরিচয়পত্রের ফটোকপি জমা দিতে হবে।

    সাময়িক অসুবিধার জন্য পরিষদ আন্তরিকভাবে দুঃখিত। সার্ভার হালনাগাদের পর নিবন্ধন সেবা আগের চেয়ে দ্রুত ও নির্ভুল হবে বলে আশা করা হচ্ছে। বিস্তারিত জানতে পরিষদের তথ্যকেন্দ্রে যোগাযোগ করুন।

