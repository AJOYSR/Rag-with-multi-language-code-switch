    বৈঁচিবন ফিজিওথেরাপি সেন্টারের পক্ষ থেকে জানানো যাচ্ছে যে, আগামী ১০ এপ্রিল ২০২৭ থেকে কলেজ রোডে সেন্টারের নতুন শাখায় সেবা কার্যক্রম শুরু হবে। নতুন শাখায় আধুনিক থেরাপি যন্ত্রপাতি এবং নারী রোগীদের জন্য আলাদা থেরাপি কক্ষ রয়েছে।

    সেন্টারের প্রধান ফিজিওথেরাপিস্ট হিসেবে দায়িত্ব পালন করবেন সৈয়দা নাফিসা কাবির। প্রতি সোমবার ও বুধবার বিকেলে রোগী দেখবেন অর্থোপেডিক পরামর্শক ডা. রাশেদুল করিম। কোমর ব্যথা, ঘাড় ব্যথা, হাঁটুর ব্যথা, স্ট্রোক-পরবর্তী পুনর্বাসন, খেলাধুলাজনিত আঘাত এবং শিশুদের সেরিব্রাল পালসির থেরাপি দেওয়া হবে।

    প্রতি সেশন থেরাপির খরচ ৬০০ টাকা। দশ সেশনের প্যাকেজ নিলে বিশেষ ছাড় পাওয়া যাবে। চলাফেরায় অক্ষম রোগীদের জন্য বাসায় গিয়ে থেরাপি দেওয়ার ব্যবস্থাও রয়েছে, যার জন্য আলাদা যাতায়াত খরচ প্রযোজ্য।

    প্রথমবার আসার সময় রোগীদের আগের প্রেসক্রিপশন, এক্স-রে বা এমআরআই রিপোর্ট সঙ্গে আনতে হবে। থেরাপির সময় ঢিলেঢালা ও আরামদায়ক পোশাক পরে আসার অনুরোধ করা হলো। সেন্টার শুক্রবার ছাড়া প্রতিদিন সকাল ৯টা থেকে রাত ৮টা পর্যন্ত খোলা থাকবে। সিরিয়ালের জন্য সেন্টারের অভ্যর্থনা ডেস্কে যোগাযোগ করুন।

