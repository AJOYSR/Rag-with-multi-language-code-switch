    নাগরিক সনদ ও প্রত্যয়নপত্র প্রদান সংক্রান্ত বিজ্ঞপ্তি

    দাঁড়কাকিয়া ওয়ার্ড কাউন্সিলর কার্যালয় থেকে ওয়ার্ডের বাসিন্দাদের জানানো যাচ্ছে যে, আগামী ২ জানুয়ারি ২০২৭ থেকে নাগরিক সনদ, চারিত্রিক সনদ, ওয়ারিশ সনদ এবং আয়ের প্রত্যয়নপত্র প্রদানের পদ্ধতিতে কিছু পরিবর্তন আনা হয়েছে। সেবাগ্রহীতাদের নিচের নিয়মগুলো মেনে চলার অনুরোধ করা হলো।

    সনদের আবেদন কার্যালয়ের নির্ধারিত ফরমে করতে হবে। আবেদনের সঙ্গে জাতীয় পরিচয়পত্র বা জন্ম নিবন্ধনের ফটোকপি, হালনাগাদ হোল্ডিং ট্যাক্স পরিশোধের রসিদ এবং এক কপি ছবি জমা দিতে হবে। প্রতিটি সনদের জন্য ১৫০ টাকা ফি নির্ধারণ করা হয়েছে, যা কার্যালয়ের রসিদের মাধ্যমে পরিশোধ করতে হবে। ওয়ারিশ সনদের ক্ষেত্রে মৃত ব্যক্তির মৃত্যু সনদ এবং সকল ওয়ারিশের তালিকা দিতে হবে।

    আবেদনের দিনই সনদ সরবরাহ করা হবে না; সনদ পেতে আবেদনের পর তিন কর্মদিবস অপেক্ষা করতে হবে। মিথ্যা তথ্য দিয়ে সনদ নিলে তা বাতিল করে আইনানুগ ব্যবস্থা নেওয়া হবে।

    কার্যালয় শুক্র ও শনিবার ছাড়া প্রতিদিন সকাল ৯টা থেকে বিকেল ৫টা পর্যন্ত খোলা থাকবে। সনদ সংগ্রহের সময় আবেদনকারীকে নিজে উপস্থিত থাকতে হবে অথবা লিখিত ক্ষমতাপত্রসহ প্রতিনিধি পাঠাতে হবে। কোনো দালালের মাধ্যমে আবেদন না করার জন্য অনুরোধ করা হচ্ছে।

