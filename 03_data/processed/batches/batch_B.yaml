    নুনিয়াগাছা পৌরসভার সকল নাগরিকের অবগতির জন্য জানানো যাচ্ছে যে, রাতের বেলায় চলাচল নিরাপদ করা এবং বিদ্যুৎ সাশ্রয়ের লক্ষ্যে পৌর এলাকার প্রধান সড়ক ও গলিপথে নতুন এলইডি সড়কবাতি স্থাপনের প্রকল্প হাতে নেওয়া হয়েছে। প্রকল্পের কাজ আগামী ৩ জানুয়ারি ২০২৭ থেকে শুরু হবে।

    প্রকল্পের আওতায় পৌর এলাকায় ৪৬০টি এলইডি সড়কবাতি স্থাপন করা হবে। প্রথম পর্যায়ে বাজার এলাকা, বাসস্ট্যান্ড, হাসপাতাল সড়ক এবং বিদ্যালয়ের আশপাশের রাস্তায় বাতি বসানো হবে। দ্বিতীয় পর্যায়ে আবাসিক এলাকার গলিপথগুলো প্রকল্পের আওতায় আসবে। প্রকল্পের কাজ ৩১ মে ২০২৭ তারিখের মধ্যে শেষ করার লক্ষ্য নির্ধারণ করা হয়েছে।

    নতুন বাতিগুলো সন্ধ্যায় স্বয়ংক্রিয়ভাবে জ্বলবে এবং ভোরে নিভে যাবে। পুরোনো সোডিয়াম বাতির তুলনায় এলইডি বাতিতে বিদ্যুৎ খরচ অনেক কম হবে। কাজ চলাকালীন কিছু সড়কে সাময়িকভাবে যান চলাচলে বিঘ্ন ঘটতে পারে, সেজন্য পৌরবাসীর সহযোগিতা কামনা করা হচ্ছে।

    কোনো এলাকায় সড়কবাতি নষ্ট হলে বা জ্বলে না থাকলে পৌরসভার বিদ্যুৎ শাখায় খুঁটির নম্বর উল্লেখ করে অভিযোগ জানানো যাবে। সড়কবাতি বা খুঁটির ক্ষতি করা দণ্ডনীয় অপরাধ। নিরাপদ ও আলোকিত শহর গড়তে সকলের সহযোগিতা কাম্য।

