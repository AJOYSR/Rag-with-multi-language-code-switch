    গর্ভকালীন অন্তত চারবার চেকআপ, প্রসবকালীন সেবা, প্রসব-পরবর্তী মা ও নবজাতকের যত্ন এবং বুকের দুধ খাওয়ানো বিষয়ে পরামর্শ দেওয়া হবে। প্রতি বৃহস্পতিবার বিকেলে গর্ভবতী মায়েদের জন্য স্বাস্থ্য শিক্ষা সেশন অনুষ্ঠিত হবে।

    গর্ভবতী মায়েদের প্রথম চেকআপের সময় মাতৃসদনে নাম নিবন্ধন করতে হবে এবং একটি মা কার্ড দেওয়া হবে। প্রসবের জন্য আসার সময় মা কার্ড, আগের পরীক্ষার রিপোর্ট এবং একজন রক্তদাতার যোগাযোগ নম্বর সঙ্গে রাখতে হবে। প্রসবব্যথা, রক্তক্ষরণ বা খিঁচুনির মতো বিপদচিহ্ন দেখা দিলে দেরি না করে মাতৃসদনে চলে আসুন।

