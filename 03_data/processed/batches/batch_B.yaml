    কাঁকরোলতলী পৌর স্বাস্থ্য বিভাগের পক্ষ থেকে পৌর এলাকার সকল অভিভাবকের অবগতির জন্য জানানো যাচ্ছে যে, শিশুদের রাতকানা রোগ প্রতিরোধ ও রোগপ্রতিরোধ ক্ষমতা বাড়াতে ভিটামিন এ প্লাস ক্যাম্পেইন পরিচালনা করা হবে। ছয় মাস থেকে পাঁচ বছরের কম বয়সী সকল শিশুকে ভিটামিন এ ক্যাপসুল খাওয়ানো হবে।

    ভিটামিন এ প্লাস ক্যাম্পেইন আগামী ১৮ সেপ্টেম্বর ২০২৭ তারিখে সকাল ৮টা থেকে বিকেল ৪টা পর্যন্ত অনুষ্ঠিত হবে। এ উপলক্ষে পৌর এলাকায় মোট ৫৪টি কেন্দ্র খোলা থাকবে। ছয় থেকে এগারো মাস বয়সী শিশুদের নীল রঙের এবং বারো থেকে ঊনষাট মাস বয়সী শিশুদের লাল রঙের ক্যাপসুল খাওয়ানো হবে।

    এছাড়া স্কুলগামী শিশুদের জন্য কৃমিনাশক ট্যাবলেট খাওয়ানো হবে ২৫ সেপ্টেম্বর ২০২৭ তারিখে, সংশ্লিষ্ট বিদ্যালয়ে। ট্যাবলেট ভরা পেটে চিবিয়ে খেতে হবে।

    অসুস্থ শিশুকে ক্যাপসুল খাওয়ানোর আগে কেন্দ্রের স্বাস্থ্যকর্মীকে জানাতে হবে। গত এক মাসের মধ্যে যেসব শিশু ভিটামিন এ ক্যাপসুল খেয়েছে, তাদের আবার খাওয়ানো হবে না। ক্যাপসুল জোর করে খাওয়ানো যাবে না; শিশু কান্নারত অবস্থায় থাকলে শান্ত করার পর খাওয়াতে হবে। প্রতিটি কেন্দ্রে প্রশিক্ষিত স্বাস্থ্যকর্মী ও স্বেচ্ছাসেবক দায়িত্ব পালন করবেন। আপনার শিশুকে নিকটস্থ কেন্দ্রে নিয়ে আসুন।

