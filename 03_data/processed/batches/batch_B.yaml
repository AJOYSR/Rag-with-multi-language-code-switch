    কদলীবন বিদ্যুৎ অফিসের আওতাধীন গ্রাহকদের বিদ্যুৎ বিল, মিটার রিডিং ও নতুন সংযোগ সংক্রান্ত অভিযোগ সরাসরি শোনার জন্য একটি গণশুনানির আয়োজন করা হয়েছে। গণশুনানি আগামী ১৭ মার্চ ২০২৭ তারিখে সকাল ১০টায় অফিস প্রাঙ্গণে অনুষ্ঠিত হবে।

    গণশুনানিতে সভাপতিত্ব করবেন নির্বাহী প্রকৌশলী তানভীর আহসান ভূঁইয়া। শুনানিতে গ্রাহকরা অতিরিক্ত বিল, ভুল মিটার রিডিং, সংযোগ পেতে বিলম্ব এবং লোডশেডিং বিষয়ে সরাসরি অভিযোগ ও পরামর্শ জানাতে পারবেন। প্রতিটি অভিযোগ লিপিবদ্ধ করে নির্দিষ্ট সময়ের মধ্যে সমাধানের ব্যবস্থা নেওয়া হবে।

    যাঁরা লিখিত অভিযোগ জমা দিতে চান, তাঁরা শুনানির আগের দিন পর্যন্ত অফিসের অভিযোগ ডেস্কে জমা দিতে পারবেন। লিখিত অভিযোগ গ্রহণের দায়িত্বে থাকবেন উপসহকারী প্রকৌশলী শামীমা নাসরিন। অভিযোগের সঙ্গে সর্বশেষ বিলের কপি এবং গ্রাহক নম্বর উল্লেখ করতে হবে।

    শুনানিতে অংশ নিতে কোনো নিবন্ধন বা ফি লাগবে না। প্রবীণ ও প্রতিবন্ধী গ্রাহকদের জন্য সামনের সারিতে বসার ব্যবস্থা থাকবে। সেবার মান উন্নয়নে গ্রাহকদের মতামত আমাদের কাছে অত্যন্ত গুরুত্বপূর্ণ। দালালের মাধ্যমে কোনো সংযোগ বা সেবা না নেওয়ার জন্য গ্রাহকদের অনুরোধ করা হচ্ছে।

