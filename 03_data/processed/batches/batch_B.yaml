    কুকুরকে জলাতঙ্ক প্রতিরোধী টিকা দেওয়ার কর্মসূচি আগামী ৬ অক্টোবর ২০২৭ তারিখে শুরু হবে। কর্মসূচিতে পৌর এলাকায় প্রায় ১,২৫০ কুকুরকে টিকা দেওয়ার লক্ষ্য নির্ধারণ করা হয়েছে। প্রশিক্ষিত টিকাদান দল প্রতিটি ওয়ার্ডে গিয়ে কুকুর ধরে নিরাপদে টিকা দেবে এবং টিকা দেওয়া কুকুরের গায়ে রং দিয়ে চিহ্ন দেওয়া হবে।

    পোষা কুকুরের মালিকরা নির্ধারিত দিনে নিজ ওয়ার্ডের টিকাদান কেন্দ্রে কুকুর নিয়ে এসে বিনামূল্যে টিকা দিতে পারবেন। কুকুরকে কোনোভাবেই মারা বা বিষ দেওয়া যাবে না; এটি আইনত দণ্ডনীয়।

    কুকুর বা বিড়াল কামড়ালে বা আঁচড় দিলে সঙ্গে সঙ্গে ক্ষতস্থান সাবান ও প্রবহমান পানি দিয়ে অন্তত পনেরো মিনিট ধুয়ে ফেলতে হবে এবং দ্রুত নিকটস্থ হাসপাতালে গিয়ে টিকা নিতে হবে। ঝাড়ফুঁক বা কবিরাজি চিকিৎসার ওপর নির্ভর করবেন না। টিকাদান দলকে সহযোগিতা করার জন্য সকল নাগরিকের প্রতি অনুরোধ জানানো হচ্ছে।

