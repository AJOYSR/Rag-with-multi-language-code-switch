    শালবনিয়া বিদ্যুৎ বিতরণ কার্যালয়ের আওতাধীন এলাকার সম্মানিত গ্রাহকদের জানানো যাচ্ছে যে, পুরোনো ট্রান্সফরমার পরিবর্তন এবং উপকেন্দ্রের জরুরি রক্ষণাবেক্ষণ কাজের জন্য নির্ধারিত সময়ে বিদ্যুৎ সরবরাহ বন্ধ রাখা হবে। এই কাজের ফলে এলাকায় লো-ভোল্টেজ ও ঘন ঘন বিদ্যুৎ বিভ্রাটের সমস্যা অনেকাংশে কমে আসবে বলে আশা করা হচ্ছে।

    আগামী ৯ মে ২০২৭ তারিখে সকাল ৯টা থেকে বিকেল ৩টা পর্যন্ত উপকেন্দ্রের সংশ্লিষ্ট লাইনে বিদ্যুৎ সরবরাহ বন্ধ থাকবে। রক্ষণাবেক্ষণ কাজের আওতায় মোট ৬টি ফিডারের অধীন এলাকা থাকবে, যার মধ্যে বাজার এলাকা, কলেজ রোড, হাসপাতাল রোড ও নদীর পাড়ের আবাসিক এলাকা উল্লেখযোগ্য। কাজ আগে শেষ হলে নির্ধারিত সময়ের আগেই বিদ্যুৎ সরবরাহ চালু করা হবে।

    হাসপাতাল ও ক্লিনিকগুলোকে বিকল্প বিদ্যুতের ব্যবস্থা রাখার অনুরোধ করা হলো। কাজ চলাকালীন কোনো অবস্থাতেই বৈদ্যুতিক খুঁটি বা তারে হাত দেবেন না। এছাড়া চলতি মাসের বিদ্যুৎ বিল বিলম্ব ফি ছাড়া পরিশোধের শেষ তারিখ ২০ মে ২০২৭। প্রিপেইড মিটারের গ্রাহকদের আগেভাগে প্রয়োজনীয় রিচার্জ করে রাখার পরামর্শ দেওয়া হচ্ছে।

    সাময়িক অসুবিধার জন্য আমরা আন্তরিকভাবে দুঃখিত। জরুরি প্রয়োজনে কার্যালয়ের অভিযোগ কেন্দ্রে যোগাযোগ করুন।

