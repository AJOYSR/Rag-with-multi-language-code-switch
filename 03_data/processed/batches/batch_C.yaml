    চন্দনপিঁড়ি বণিক সমবায় সমিতির সকল শেয়ারহোল্ডার সদস্যের অবগতির জন্য জানানো যাচ্ছে যে, সমিতির ব্যবস্থাপনা কমিটির সভায় বিগত অর্থবছরের নিরীক্ষিত হিসাব অনুমোদন করা হয়েছে। আলোচ্য বছরে সমিতির পাইকারি কাপড় ও মনিহারি পণ্যের ব্যবসা থেকে উল্লেখযোগ্য মুনাফা অর্জিত হয়েছে।

    ব্যবস্থাপনা কমিটি সদস্যদের জন্য শেয়ারপ্রতি ১৪ শতাংশ হারে লভ্যাংশের সুপারিশ করেছে, যা বার্ষিক সাধারণ সভায় চূড়ান্ত অনুমোদনের জন্য উপস্থাপন করা হবে। এ বছর লভ্যাংশ সদস্যদের নগদ অর্থে পরিশোধ করা হবে। লভ্যাংশ বিতরণের সময় সদস্যদের শেয়ার সনদের মূল কপি দেখাতে হবে।

    সমিতির বার্ষিক সাধারণ সভা সমিতির নিজস্ব ভবনের তৃতীয় তলার হলরুমে অনুষ্ঠিত হবে। সভায় নতুন গুদাম নির্মাণ, পুরোনো ঋণ পরিশোধ এবং সদস্যপদ নবায়ন ফি পুনর্নির্ধারণের প্রস্তাব নিয়ে আলোচনা করা হবে। যেসব সদস্যের কাছে সমিতির বকেয়া পাওনা আছে, তাঁদের সভার আগেই বকেয়া পরিশোধের অনুরোধ করা হলো। সদস্যপদ নবায়ন না করা সদস্যরা সভায় ভোট দিতে পারবেন না। মৃত সদস্যের শেয়ার ও লভ্যাংশ সংক্রান্ত বিষয়ে তাঁর মনোনীত উত্তরাধিকারী প্রয়োজনীয় কাগজপত্রসহ সমিতির অফিসে যোগাযোগ করতে পারবেন। সভায় সকল সদস্যের উপস্থিতি একান্তভাবে কাম্য।

