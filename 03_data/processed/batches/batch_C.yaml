    এতদ্বারা সর্বসাধারণের অবগতির জন্য জানানো যাচ্ছে যে, বাংলা ১৪৩৪ সনের জন্য শুঁটকিহাটা সাপ্তাহিক গরুর হাটের ইজারা প্রকাশ্য নিলামের মাধ্যমে প্রদান করা হবে। হাটটি প্রতি মঙ্গলবার ও শনিবার বসে এবং আশপাশের ছয়টি ইউনিয়নের কৃষক ও ব্যাপারীরা এখানে গবাদিপশু কেনাবেচা করেন।

    হাটের ইজারার নিলাম আগামী ২২ ফেব্রুয়ারি ২০২৭ তারিখ বেলা ১১টায় ইউনিয়ন পরিষদের সভাকক্ষে অনুষ্ঠিত হবে। নিলামে অংশ নিতে ইচ্ছুক ব্যক্তিদের সরকারি মূল্যের ২৫ শতাংশ জামানত হিসেবে পে-অর্ডারের মাধ্যমে জমা দিতে হবে। এ বছর হাটের সরকারি মূল্য নির্ধারণ করা হয়েছে ৮,৪০,০০০ টাকা। সর্বোচ্চ দরদাতাকে নিলামের দিনই মোট দরের অর্ধেক পরিশোধ করতে হবে এবং বাকি অর্থ সাত দিনের মধ্যে জমা দিতে হবে।

    ইজারাদার সরকার নির্ধারিত হারের বেশি খাজনা আদায় করতে পারবেন না। প্রতিটি গরু বা মহিষ বিক্রির খাজনার হার হাটের প্রবেশপথে বড় সাইনবোর্ডে টাঙিয়ে রাখতে হবে। হাটে পশুর স্বাস্থ্য পরীক্ষার জন্য প্রাণিসম্পদ বিভাগের একটি মেডিকেল টিম উপস্থিত থাকবে। হাটের পরিচ্ছন্নতা ও পানি নিষ্কাশনের দায়িত্ব ইজারাদারকে বহন করতে হবে। কোনো কারণ দর্শানো ছাড়াই যেকোনো দরপত্র বাতিলের ক্ষমতা কর্তৃপক্ষ সংরক্ষণ করে। নিলাম সংক্রান্ত বিস্তারিত শর্তাবলি ইউনিয়ন পরিষদ কার্যালয়ের নোটিশ বোর্ডে পাওয়া যাবে।

