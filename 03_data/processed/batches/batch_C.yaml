    বাতাবিলেবু নারী উদ্যোক্তা ঋণ তহবিলের পক্ষ থেকে উপজেলার নারী উদ্যোক্তাদের জানানো যাচ্ছে যে, ক্ষুদ্র ও কুটির শিল্পে নিয়োজিত নারীদের ব্যবসা সম্প্রসারণের জন্য ঋণের আবেদন গ্রহণ শুরু হয়েছে। সেলাই, হস্তশিল্প, খাদ্য প্রক্রিয়াজাতকরণ, বিউটি পার্লার ও অনলাইন ব্যবসায় যুক্ত নারীরা আবেদন করতে পারবেন।

    একজন উদ্যোক্তা সর্বোচ্চ ১,৫০,০০০ টাকা পর্যন্ত ঋণ নিতে পারবেন। ঋণের অর্থ ২৪ মাসে সমান মাসিক কিস্তিতে পরিশোধ করতে হবে এবং প্রথম তিন মাস কোনো কিস্তি দিতে হবে না। এই ঋণের জন্য কোনো জামিনদারের প্রয়োজন হবে না।

    আবেদনকারীর ব্যবসা কমপক্ষে এক বছর ধরে চালু থাকতে হবে এবং ব্যবসার আয়-ব্যয়ের একটি সাধারণ হিসাব জমা দিতে হবে। আবেদনের সঙ্গে জাতীয় পরিচয়পত্রের ফটোকপি, দুই কপি ছবি, ট্রেড লাইসেন্স (যদি থাকে) এবং ব্যবসার কয়েকটি ছবি জমা দিতে হবে। তহবিলের মাঠ কর্মকর্তা আবেদনকারীর ব্যবসাস্থল পরিদর্শন করে প্রতিবেদন দেবেন। ঋণ মঞ্জুরির পর উদ্যোক্তাদের তিন দিনের হিসাবরক্ষণ ও বিপণন প্রশিক্ষণে অংশ নিতে হবে। নিয়মিত কিস্তি পরিশোধকারী উদ্যোক্তারা পরবর্তীতে বড় অঙ্কের ঋণের জন্য বিবেচিত হবেন। আবেদন ফরম তহবিলের কার্যালয় থেকে বিনামূল্যে সংগ্রহ করা যাবে।

