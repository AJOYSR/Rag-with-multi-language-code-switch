    কাঁসারিপাড়া তাঁতশিল্পী সমবায় সমিতির পক্ষ থেকে এলাকার তাঁতি ও তাঁতপণ্য ব্যবসায়ীদের জানানো যাচ্ছে যে, সমিতিতে সীমিতসংখ্যক নতুন সদস্য ভর্তি করা হবে। সমিতির সদস্যরা সুতা ও রং পাইকারি দামে কিনতে পারেন এবং সমিতির বিক্রয়কেন্দ্রের মাধ্যমে তাঁদের তৈরি শাড়ি ও গামছা বাজারজাত করতে পারেন।

    সদস্য হতে আগ্রহী ব্যক্তিদের এককালীন ভর্তি ফি ১৫০ টাকা দিতে হবে। এছাড়া প্রত্যেক নতুন সদস্যকে কমপক্ষে পাঁচটি শেয়ার কিনতে হবে। সমিতির প্রতিটি শেয়ারের মূল্য ৪৪০ টাকা। শেয়ারের অর্থ এককালীন অথবা তিনটি মাসিক কিস্তিতে পরিশোধ করা যাবে।

    আবেদনকারীকে অবশ্যই কাঁসারিপাড়া বা পার্শ্ববর্তী গ্রামের স্থায়ী বাসিন্দা হতে হবে এবং নিজের অন্তত একটি তাঁত থাকতে হবে। আবেদনের সঙ্গে জাতীয় পরিচয়পত্রের ফটোকপি, দুই কপি ছবি ও ইউনিয়ন পরিষদের নাগরিকত্ব সনদ জমা দিতে হবে। সমিতির ব্যবস্থাপনা কমিটি আবেদন যাচাই করে সদস্যপদ অনুমোদন করবে। নতুন সদস্যরা ভর্তির এক বছর পর থেকে সমিতির বার্ষিক লভ্যাংশ পাওয়ার যোগ্য হবেন। সমিতির সাপ্তাহিক সভা প্রতি সোমবার বিকেলে সমিতির কার্যালয়ে অনুষ্ঠিত হয়। আবেদন ফরম সমিতির কার্যালয়ে কর্মদিবসে বিকেল ৩টা থেকে সন্ধ্যা ৬টা পর্যন্ত পাওয়া যাবে।

