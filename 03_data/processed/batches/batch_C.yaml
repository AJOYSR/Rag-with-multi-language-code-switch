    পদ্মকুঁড়ি সমবায় ক্রেডিট ইউনিয়নের সম্মানিত সদস্যদের জানানো যাচ্ছে যে, সদস্যদের সঞ্চয়ের অভ্যাস গড়ে তোলা এবং ভবিষ্যতের প্রয়োজনে একটি নিরাপদ তহবিল তৈরির লক্ষ্যে "স্বপ্নপূরণ মাসিক সঞ্চয় স্কিম" চালু করা হয়েছে। ইউনিয়নের যেকোনো নিয়মিত সদস্য এই স্কিমে হিসাব খুলতে পারবেন।

    স্কিমে প্রতি মাসে ১,৫০০ টাকা করে জমা দিতে হবে। স্কিমের মেয়াদ ৪২ মাস। মেয়াদ শেষে সদস্যরা জমাকৃত অর্থের সঙ্গে নির্ধারিত হারে মুনাফা পাবেন। মাসিক কিস্তি প্রতি মাসের ১০ তারিখের মধ্যে ইউনিয়নের কার্যালয়ে বা মোবাইল ব্যাংকিংয়ের মাধ্যমে জমা দিতে হবে।

    নির্ধারিত তারিখের পরে কিস্তি জমা দিলে বিলম্ব ফি প্রযোজ্য হবে। পরপর তিনটি কিস্তি জমা না দিলে হিসাবটি নিষ্ক্রিয় বলে গণ্য হবে। হিসাব খোলার সময় সদস্যকে একজন নমিনির নাম, ছবি ও জাতীয় পরিচয়পত্রের কপি জমা দিতে হবে। একজন সদস্য সর্বোচ্চ দুটি হিসাব খুলতে পারবেন। জরুরি প্রয়োজনে সদস্যরা জমাকৃত অর্থের বিপরীতে ঋণ নিতে পারবেন। ইউনিয়নের সকল হিসাব প্রতি বছর স্বতন্ত্র নিরীক্ষক দ্বারা নিরীক্ষা করা হয়। স্কিম সম্পর্কে বিস্তারিত জানতে ইউনিয়নের কার্যালয়ে কর্মদিবসে সকাল ১০টা থেকে বিকেল ৪টার মধ্যে যোগাযোগ করুন।

