    শুশুকমারী নৌবন্দর ব্যবহারকারী লঞ্চযাত্রীদের জানানো যাচ্ছে যে, বন্দরের নবনির্মিত আধুনিক যাত্রী টার্মিনাল ভবনের নির্মাণকাজ শেষ হয়েছে। টার্মিনাল ভবনটি পুরোনো পন্টুনের উত্তর পাশে নির্মিত হয়েছে এবং এতে যাত্রীদের জন্য বিভিন্ন আধুনিক সুযোগ-সুবিধা রাখা হয়েছে।

    নতুন টার্মিনাল ভবনটি ২১ আগস্ট ২০২৭ তারিখ থেকে যাত্রীদের জন্য খুলে দেওয়া হবে। টার্মিনালের শীতাতপ নিয়ন্ত্রিত প্রতীক্ষালয়ে একসঙ্গে ৬০০ জন যাত্রী বসতে পারবেন। ভবনে নারী ও শিশুদের জন্য আলাদা বিশ্রামকক্ষ, মাতৃদুগ্ধ পান কর্নার, বিশুদ্ধ পানির ব্যবস্থা এবং পরিচ্ছন্ন শৌচাগার রয়েছে।

    টার্মিনাল চালু হওয়ার পর সকল লঞ্চের টিকিট শুধু টার্মিনালের কাউন্টার থেকে বিক্রি করা হবে এবং পন্টুনে টিকিট বিক্রি বন্ধ থাকবে। যাত্রীদের টিকিট দেখিয়ে টার্মিনালের নির্ধারিত গেট দিয়ে পন্টুনে প্রবেশ করতে হবে। দর্শনার্থীদের টার্মিনালে প্রবেশের জন্য প্রবেশ টিকিট সংগ্রহ করতে হবে। টার্মিনালের ভেতরে হকারদের প্রবেশ নিষিদ্ধ থাকবে এবং নির্ধারিত দোকান ছাড়া কোথাও খাবার বিক্রি করা যাবে না। নিরাপত্তার জন্য পুরো ভবনে ক্লোজসার্কিট ক্যামেরা স্থাপন করা হয়েছে। যাত্রীসেবা সংক্রান্ত যেকোনো অভিযোগ টার্মিনালের তথ্যকেন্দ্রে জানানো যাবে।

