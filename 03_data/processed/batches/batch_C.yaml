    বকফুল গবাদিপশু বীমা প্রকল্পের পক্ষ থেকে খামারি ও কৃষকদের জানানো যাচ্ছে যে, রোগ, দুর্ঘটনা বা প্রাকৃতিক দুর্যোগে গবাদিপশুর মৃত্যুজনিত আর্থিক ক্ষতি থেকে সুরক্ষার জন্য গরু ও মহিষের বীমা নিবন্ধন কার্যক্রম চলছে। খামারিদের সুবিধার্থে ইউনিয়ন পর্যায়ে বিশেষ নিবন্ধন ক্যাম্পের আয়োজন করা হয়েছে।

