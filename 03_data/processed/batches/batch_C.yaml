    বেতকাঁটা বাজার ব্যবসায়ী সমিতির সকল সদস্যের অবগতির জন্য জানানো যাচ্ছে যে, গত মাসে অনুষ্ঠিত দ্বিবার্ষিক নির্বাচনের মাধ্যমে সমিতির নতুন কার্যনির্বাহী কমিটি গঠিত হয়েছে। নির্বাচনে মোট ৪১৮ জন সদস্য ভোট প্রদান করেন। নতুন কমিটির মেয়াদ দুই বছর।

    কাপড় ব্যবসায়ী মোজাম্মেল হক তালুকদার বিপুল ভোটে সমিতির সভাপতি নির্বাচিত হয়েছেন। সাধারণ সম্পাদক নির্বাচিত হয়েছেন মুদি দোকানি শাহানা পারভীন রুমকি এবং কোষাধ্যক্ষ পদে নির্বাচিত হয়েছেন হার্ডওয়্যার ব্যবসায়ী নূরুল আবসার। এছাড়া ৯ জন কার্যনির্বাহী সদস্য নির্বাচিত হয়েছেন।

    নতুন কমিটি বাজারের পরিচ্ছন্নতা, রাতের নিরাপত্তা ও পানি নিষ্কাশন ব্যবস্থার উন্নয়নকে অগ্রাধিকার দেবে বলে জানিয়েছে। বাজারের প্রতিটি দোকান থেকে নৈশপ্রহরীর জন্য মাসিক চাঁদা আগের মতোই আদায় করা হবে। বাজারের ভেতরে ফুটপাত দখল করে পণ্য রাখা যাবে না এবং নিয়ম ভঙ্গ করলে সমিতির পক্ষ থেকে ব্যবস্থা নেওয়া হবে। নতুন কমিটির দায়িত্ব গ্রহণ উপলক্ষে আগামী শুক্রবার বাদ জুমা বাজার মসজিদে দোয়া মাহফিলের আয়োজন করা হয়েছে। সকল ব্যবসায়ীকে উপস্থিত থাকার আমন্ত্রণ জানানো হলো।

