    অনলাইন ব্যবসায়ী ও ক্ষুদ্র উদ্যোক্তাদের জানানো যাচ্ছে যে, শিমফুল এক্সপ্রেস পার্সেল সার্ভিস এখন থেকে ক্যাশ অন ডেলিভারি সেবা চালু করেছে। এই সেবার মাধ্যমে প্রাপক পার্সেল হাতে পাওয়ার পর পণ্যের মূল্য পরিশোধ করবেন এবং আমরা সেই অর্থ প্রেরকের কাছে পৌঁছে দেব।

    জেলার ভেতরে পাঠানো পার্সেল সাধারণত পরদিনের মধ্যে প্রাপকের কাছে পৌঁছে যাবে। জেলার বাইরে পাঠানো পার্সেলের ক্ষেত্রে ক্যাশ অন ডেলিভারি সুবিধা প্রযোজ্য হবে না। আদায়কৃত পণ্যমূল্য প্রতি রবিবার ও বুধবার প্রেরকের মোবাইল ব্যাংকিং অ্যাকাউন্টে পাঠানো হবে। প্রতিটি পার্সেলের সর্বোচ্চ ওজন ২৫ কেজি পর্যন্ত গ্রহণ করা হবে।

    পার্সেল বুকিংয়ের সময় প্রাপকের পূর্ণ নাম, ঠিকানা ও সচল মোবাইল নম্বর দিতে হবে। ভুল ঠিকানার কারণে পার্সেল ফেরত এলে ফেরত চার্জ প্রেরককে বহন করতে হবে। প্রাপক পার্সেল গ্রহণে অস্বীকৃতি জানালে পার্সেলটি তিন কার্যদিবসের মধ্যে প্রেরকের নিকটস্থ শাখায় ফেরত পাঠানো হবে। তরল পদার্থ, ওষুধ ও কাঁচা খাদ্যপণ্য বিশেষ মোড়ক ছাড়া গ্রহণ করা হবে না। নিয়মিত ব্যবসায়ী গ্রাহকরা চুক্তির ভিত্তিতে মাসিক বিশেষ মূল্যছাড় পেতে পারেন। বিস্তারিত জানতে নিকটস্থ শাখা অফিসে যোগাযোগ করুন অথবা আমাদের প্রতিনিধির সঙ্গে কথা বলুন।

