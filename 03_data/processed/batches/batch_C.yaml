    নতুন শাখার ব্যবস্থাপক হিসেবে দায়িত্ব পালন করবেন ফারহানা ইয়াসমিন চৌধুরী, যিনি এর আগে প্রতিষ্ঠানের জেলা কার্যালয়ে কর্মরত ছিলেন। শাখায় মোট ৬ জন কর্মকর্তা ও ২৪ জন মাঠকর্মী কাজ করবেন। এই শাখা থেকে নতুন পলিসি খোলা, প্রিমিয়াম জমা, পলিসির মেয়াদপূর্তির দাবি এবং মৃত্যুদাবি নিষ্পত্তি সংক্রান্ত সকল সেবা পাওয়া যাবে।

    প্রিমিয়াম নগদে, ব্যাংক চেকে অথবা মোবাইল ব্যাংকিংয়ের মাধ্যমে জমা দেওয়া যাবে। প্রিমিয়াম জমা দেওয়ার পর অবশ্যই প্রতিষ্ঠানের ছাপানো রশিদ সংগ্রহ করতে হবে; হাতে লেখা রশিদ গ্রহণযোগ্য নয়। কোনো মাঠকর্মী নির্ধারিত প্রিমিয়ামের বেশি অর্থ দাবি করলে সরাসরি শাখা অফিসে অভিযোগ জানানোর অনুরোধ করা হলো। শাখা অফিস শনিবার থেকে বৃহস্পতিবার সকাল ৯টা থেকে বিকেল ৫টা পর্যন্ত খোলা থাকবে। উদ্বোধন উপলক্ষে প্রথম মাসে নতুন পলিসি গ্রহণকারীদের একটি উপহার সামগ্রী দেওয়া হবে।

