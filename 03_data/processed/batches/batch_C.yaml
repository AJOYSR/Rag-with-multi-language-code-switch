    পাখিমারা কৃষক শস্য বীমা প্রকল্পের আওতায় আসন্ন বোরো মৌসুমে ধানচাষিদের জন্য শস্য বীমা নিবন্ধন শুরু হয়েছে। বন্যা, শিলাবৃষ্টি, খরা বা পোকার আক্রমণে ফসলের ক্ষতি হলে নিবন্ধিত কৃষকরা নির্ধারিত হারে ক্ষতিপূরণ পাবেন।

    প্রতি বিঘা জমির জন্য মৌসুমি প্রিমিয়াম ২৭০ টাকা, যার একটি অংশ প্রকল্পের ভর্তুকি তহবিল থেকে বহন করা হবে। একজন কৃষক সর্বোচ্চ ১২ বিঘা জমি বীমার আওতায় আনতে পারবেন। বীমা নিবন্ধনের শেষ তারিখ ১৫ ডিসেম্বর ২০২৭। নিবন্ধনের সময় জমির খতিয়ান বা বর্গাচুক্তির কপি এবং জাতীয় পরিচয়পত্রের ফটোকপি জমা দিতে হবে।

    ফসলের ক্ষতি হলে ক্ষতির সাত দিনের মধ্যে প্রকল্প কার্যালয়ে লিখিতভাবে জানাতে হবে। এরপর প্রকল্পের মাঠ কর্মকর্তা সরেজমিনে জমি পরিদর্শন করে ক্ষতির পরিমাণ নির্ধারণ করবেন। ক্ষতিপূরণের অর্থ কৃষকের মোবাইল ব্যাংকিং অ্যাকাউন্টে সরাসরি পাঠানো হবে। বর্গাচাষিরাও জমির মালিকের সম্মতিপত্র নিয়ে এই বীমার আওতায় আসতে পারবেন। ইচ্ছাকৃত অবহেলা বা ভুল তথ্যের কারণে ক্ষতি হলে ক্ষতিপূরণ দেওয়া হবে না। নিবন্ধন ফরম প্রকল্প কার্যালয় এবং ইউনিয়ন কৃষি তথ্য কেন্দ্রে পাওয়া যাবে।

