    টিয়াঠুঁটি ডিজিটাল সেবা কেন্দ্রের উদ্যোগে স্থানীয় দোকানি ও তরুণ উদ্যোক্তাদের জন্য মোবাইল ব্যাংকিং এজেন্ট হিসেবে কাজ করার ওপর একটি পাঁচ দিনের প্রশিক্ষণ কোর্সের আয়োজন করা হয়েছে। প্রশিক্ষণে গ্রাহকের হিসাব খোলা, ক্যাশ ইন ও ক্যাশ আউট, লেনদেনের হিসাব সংরক্ষণ এবং প্রতারণা প্রতিরোধের কৌশল হাতে-কলমে শেখানো হবে।

    প্রশিক্ষণ পরিচালনা করবেন আর্থিক সাক্ষরতা বিষয়ে দীর্ঘ অভিজ্ঞতাসম্পন্ন প্রশিক্ষক তানভীর আহমেদ সরকার। প্রতিটি ব্যাচে সর্বোচ্চ ৩৫ জন প্রশিক্ষণার্থী অংশ নিতে পারবেন। প্রশিক্ষণ প্রতিদিন সকাল ১০টা থেকে বিকেল ৪টা পর্যন্ত সেবা কেন্দ্রের প্রশিক্ষণ কক্ষে চলবে। দুপুরের খাবার ও প্রশিক্ষণ সামগ্রী কেন্দ্রের পক্ষ থেকে দেওয়া হবে।

    আবেদনকারীর বয়স কমপক্ষে আঠারো বছর হতে হবে এবং ন্যূনতম এসএসসি পাস হতে হবে। নিজস্ব দোকান বা ব্যবসাপ্রতিষ্ঠান আছে এমন আবেদনকারীরা অগ্রাধিকার পাবেন। আবেদনের সঙ্গে জাতীয় পরিচয়পত্রের ফটোকপি, ট্রেড লাইসেন্সের কপি (যদি থাকে) এবং এক কপি ছবি জমা দিতে হবে। প্রশিক্ষণ শেষে সফল প্রশিক্ষণার্থীদের সনদপত্র দেওয়া হবে। প্রশিক্ষণে অংশগ্রহণের জন্য কোনো ফি লাগবে না। আবেদনপত্র কেন্দ্রের অফিস থেকে বিনামূল্যে সংগ্রহ করে পূরণ করে জমা দেওয়া যাবে। আসন সীমিত হওয়ায় আগে আবেদনকারীদের অগ্রাধিকার দেওয়া হবে।

