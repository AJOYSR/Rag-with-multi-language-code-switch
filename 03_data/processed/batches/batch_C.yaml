    সদস্য কার্ড চালু সংক্রান্ত বিজ্ঞপ্তি

    সম্মানিত ক্রেতাদের জানানো যাচ্ছে যে, হলুদবরণ পাইকারি ভাণ্ডার নিয়মিত ক্রেতাদের জন্য একটি বার্ষিক সদস্য কার্ড চালু করেছে। এই কার্ডধারী ক্রেতারা চাল, ডাল, তেল, চিনি ও অন্যান্য নিত্যপ্রয়োজনীয় পণ্য কেনার সময় বিশেষ সুবিধা পাবেন। দোকানের খুচরা ও পাইকারি উভয় বিভাগেই কার্ডটি ব্যবহার করা যাবে।

    বার্ষিক সদস্য কার্ড করতে এককালীন ৩৫০ টাকা জমা দিতে হবে। কার্ডধারী ক্রেতারা প্রতিটি কেনাকাটায় মোট মূল্যের ওপর ৮ শতাংশ ছাড় পাবেন। তবে গুঁড়া দুধ, শিশুখাদ্য ও সিগারেটের ক্ষেত্রে এই ছাড় প্রযোজ্য হবে না। মাসে ১০,০০০ টাকার বেশি কেনাকাটা করলে কার্ডধারীরা বিনা খরচে ঘরে পণ্য পৌঁছানোর সুবিধা পাবেন।

    কার্ড করার জন্য ক্রেতার নাম, মোবাইল নম্বর ও ঠিকানা দিয়ে দোকানের ক্যাশ কাউন্টারে একটি ফরম পূরণ করতে হবে। কার্ড হারিয়ে গেলে নতুন কার্ড নিতে আলাদা চার্জ দিতে হবে। একটি কার্ড শুধু একজন ক্রেতার নামে ইস্যু করা হবে এবং অন্য কেউ তা ব্যবহার করতে পারবেন না। কার্ডের মেয়াদ ইস্যুর তারিখ থেকে এক বছর। দোকান প্রতিদিন সকাল ৮টা থেকে রাত ১০টা পর্যন্ত খোলা থাকে এবং শুক্রবার জুমার নামাজের সময় দুই ঘণ্টা বন্ধ থাকে। পণ্যের মান বা ওজন নিয়ে কোনো অভিযোগ থাকলে সরাসরি দোকানের ব্যবস্থাপককে জানানোর অনুরোধ করা হলো।

