    নতুন সময়সূচি অনুযায়ী বাজারের সকল দোকান সকাল ৯টায় খুলবে এবং রাত ৮টার মধ্যে বন্ধ করতে হবে। তবে ওষুধের দোকান, খাবারের হোটেল ও মুদি দোকান এই সময়সীমার বাইরে থাকবে। প্রতি মঙ্গলবার বাজারে সাপ্তাহিক ছুটি পালন করা হবে এবং সেদিন শুধু জরুরি পণ্যের দোকান খোলা রাখা যাবে।

    নির্ধারিত সময়ের পরে দোকান খোলা রাখলে প্রথমবার সতর্ক করা হবে এবং দ্বিতীয়বার থেকে প্রতিবার ৭০০ টাকা জরিমানা আদায় করা হবে। আদায়কৃত জরিমানার অর্থ বাজারের নৈশপ্রহরীদের কল্যাণ তহবিলে জমা হবে। বাজারের মূল সড়কে দোকানের মালামাল রেখে চলাচলে বাধা সৃষ্টি করা যাবে না। মালবাহী ট্রাক শুধু সকাল ৭টা থেকে ৯টার মধ্যে মালামাল নামাতে পারবে। সমিতির স্বেচ্ছাসেবকরা নিয়মিত বাজার পরিদর্শন করবেন এবং নিয়ম ভঙ্গের ঘটনা কমিটিকে জানাবেন। কোনো ব্যবসায়ীর আপত্তি বা পরামর্শ থাকলে সমিতির কার্যালয়ে লিখিতভাবে জমা দেওয়া যাবে। এই সিদ্ধান্ত বাস্তবায়নে সকল ব্যবসায়ীর আন্তরিক সহযোগিতা কামনা করা হলো।

