    আসন্ন ঈদুল ফিতর উপলক্ষে কামরাঙা বস্ত্রবিতানে শুরু হয়েছে বিশেষ মূল্যছাড় উৎসব। আমাদের দোকানে শাড়ি, থ্রি-পিস, পাঞ্জাবি, শিশুদের পোশাক ও ঘরোয়া কাপড়ের বিশাল সংগ্রহ রয়েছে। দেশীয় তাঁতের শাড়ি ও হাতের কাজের পাঞ্জাবির জন্য আলাদা কর্নার সাজানো হয়েছে।

    উৎসব চলাকালে সকল পোশাকে নির্ধারিত মূল্যের ওপর ১৫ শতাংশ ছাড় দেওয়া হচ্ছে। এক রশিদে ৩,০০০ টাকা বা তার বেশি কেনাকাটা করলে একটি উপহার সামগ্রী দেওয়া হবে। মূল্য পরিশোধ নগদে, কার্ডে বা মোবাইল ব্যাংকিংয়ের মাধ্যমে করা যাবে। কেনার সাত দিনের মধ্যে রশিদসহ অব্যবহৃত পণ্য ফেরত দিয়ে পুরো টাকা ফেরত নেওয়া যাবে।

    ঈদের আগের শেষ দশ দিন দোকান সকাল ৯টা থেকে রাত ১২টা পর্যন্ত খোলা থাকবে। ভিড় এড়াতে সকালের দিকে কেনাকাটা করার অনুরোধ করা হলো। দোকানে মাপ অনুযায়ী পোশাক সেলাই ও অল্টারেশনের ব্যবস্থাও রয়েছে, তবে ঈদের আগের পাঁচ দিন নতুন সেলাইয়ের অর্ডার নেওয়া হবে না। শিশুদের নিয়ে আসা ক্রেতাদের জন্য দোকানের দ্বিতীয় তলায় বসার ব্যবস্থা রাখা হয়েছে। পকেটমার ও প্রতারক চক্র থেকে সাবধান থাকার জন্য ক্রেতাদের অনুরোধ করা হলো।

