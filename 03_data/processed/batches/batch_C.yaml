    নদীতে পানি কমে যাওয়ায় নাব্যতা সংকটের কারণে ভাটিয়ালচর ফেরিঘাট থেকে কালিজিরা ঘাট পর্যন্ত ফেরি চলাচলের সময়সূচিতে পরিবর্তন আনা হয়েছে। চ্যানেলে ড্রেজিংয়ের কাজ চলমান থাকায় রাতের বেলা ফেরি চলাচল সীমিত রাখা হবে।

    বর্তমানে এই রুটে দিনে মোট ১৩টি ফেরি চলাচল করছে। প্রতিটি ফেরি একবারে সর্বোচ্চ ১৮টি ছোট যানবাহন অথবা ৬টি বড় ট্রাক পার করতে পারে। ফেরি পার হতে স্বাভাবিক সময়ে প্রায় ৫০ মিনিট লাগে, তবে বর্তমান পরিস্থিতিতে সময় বেশি লাগতে পারে।

    যানবাহন পারাপারে অ্যাম্বুলেন্স, লাশবাহী গাড়ি ও জরুরি পণ্যবাহী ট্রাক অগ্রাধিকার পাবে। কাঁচামাল ও পচনশীল পণ্যবাহী ট্রাকগুলোকে দিনের প্রথম ফেরিতে পার করার চেষ্টা করা হবে। ঘাট এলাকায় যানজট এড়াতে চালকদের নির্ধারিত সারিতে অপেক্ষা করতে হবে এবং ঘাট কর্তৃপক্ষের নির্দেশনা মেনে চলতে হবে। ফেরিতে ওঠার আগে কাউন্টার থেকে নির্ধারিত টোল পরিশোধ করে রশিদ সংগ্রহ করতে হবে। যাত্রীদের ফেরির রেলিংয়ের কাছে দাঁড়িয়ে না থাকার অনুরোধ করা হলো। ড্রেজিংয়ের কাজ শেষ হলে স্বাভাবিক সময়সূচি পুনরায় চালু করা হবে এবং তা যথাসময়ে জানিয়ে দেওয়া হবে।

