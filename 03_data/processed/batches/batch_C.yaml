    কলাবাগিচা রেলওয়ে স্টেশন ব্যবহারকারী যাত্রীদের জানানো যাচ্ছে যে, যাত্রীসেবার মান উন্নয়নে স্টেশনে কিছু নতুন ব্যবস্থা চালু করা হয়েছে। স্টেশনের প্রশাসনিক দায়িত্বেও পরিবর্তন এসেছে।

    চলতি মাসে স্টেশনের নতুন স্টেশন মাস্টার হিসেবে যোগদান করেছেন জাহিদুল করিম ভূঁইয়া। তিনি স্টেশনের সার্বিক ব্যবস্থাপনা, টিকিট বিক্রি তদারকি এবং যাত্রীদের অভিযোগ নিষ্পত্তির দায়িত্ব পালন করবেন। বর্তমানে এই স্টেশনে প্রতিদিন আন্তঃনগর ও লোকাল মিলিয়ে ২২টি ট্রেন যাত্রাবিরতি করে।

    যাত্রীদের সুবিধার্থে প্ল্যাটফর্মের প্রবেশমুখে একটি তথ্য ও সহায়তা ডেস্ক চালু করা হয়েছে, যেখানে ট্রেনের সময়সূচি ও বিলম্বের তথ্য পাওয়া যাবে। বয়স্ক ও প্রতিবন্ধী যাত্রীদের জন্য হুইলচেয়ারের ব্যবস্থা রাখা হয়েছে। প্ল্যাটফর্মে নতুন বসার বেঞ্চ, বিশুদ্ধ খাবার পানির কল এবং নারী যাত্রীদের জন্য আলাদা বিশ্রামাগার স্থাপন করা হয়েছে। টিকিট কালোবাজারি রোধে কাউন্টারের সামনে ক্লোজসার্কিট ক্যামেরা বসানো হয়েছে। প্ল্যাটফর্মে ভাসমান হকার ও ভিক্ষাবৃত্তি নিষিদ্ধ করা হয়েছে। রেললাইন পারাপারের সময় সতর্ক থাকার এবং চলন্ত ট্রেনে ওঠানামা না করার জন্য যাত্রীদের অনুরোধ করা হলো। যেকোনো অভিযোগ বা পরামর্শ সহায়তা ডেস্কে রাখা অভিযোগ খাতায় লিপিবদ্ধ করা যাবে।

