    শিউলিমাটি ক্ষুদ্রঋণ সমবায় সমিতি ক্ষুদ্র ব্যবসায়ী, হাঁস-মুরগি পালনকারী ও গৃহভিত্তিক উদ্যোক্তাদের জন্য একটি নতুন ঋণ কর্মসূচি চালু করেছে। সমিতির নিয়মিত সদস্য, যাঁদের সদস্যপদ কমপক্ষে ছয় মাস পূর্ণ হয়েছে, তাঁরা এই কর্মসূচিতে আবেদন করতে পারবেন।

    এই কর্মসূচির আওতায় একজন সদস্য সর্বোচ্চ ৬০,০০০ টাকা পর্যন্ত ঋণ নিতে পারবেন। ঋণের অর্থ সাপ্তাহিক কিস্তিতে পরিশোধ করতে হবে এবং মোট ৪৬টি কিস্তিতে পুরো ঋণ শোধ করতে হবে। প্রথম কিস্তি ঋণ বিতরণের দুই সপ্তাহ পর থেকে শুরু হবে। কিস্তি প্রতি বৃহস্পতিবার কেন্দ্র সভায় জমা দিতে হবে।

    আবেদনের সঙ্গে জাতীয় পরিচয়পত্রের ফটোকপি, দুই কপি ছবি এবং একজন জামিনদারের সম্মতিপত্র জমা দিতে হবে। ঋণ মঞ্জুরির আগে সমিতির মাঠকর্মী আবেদনকারীর ব্যবসা সরেজমিনে পরিদর্শন করবেন। নিয়মিত কিস্তি পরিশোধকারী সদস্যরা পরবর্তী ধাপে বড় অঙ্কের ঋণের জন্য বিবেচিত হবেন। ঋণ গ্রহণের সময় সদস্যদের ঋণের ১ শতাংশ হারে ঝুঁকি তহবিলে জমা দিতে হবে। এ বছর কর্মসূচিতে মোট ১৫০ জন সদস্যকে ঋণ দেওয়ার লক্ষ্য নির্ধারণ করা হয়েছে। বিস্তারিত তথ্যের জন্য সমিতির শাখা অফিসে যোগাযোগ করুন।

