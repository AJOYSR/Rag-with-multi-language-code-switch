    বীমার প্রিমিয়াম পশুর বাজারমূল্যের ওপর নির্ধারিত হবে। একটি পশুর জন্য সর্বোচ্চ ৮০,০০০ টাকা পর্যন্ত বীমা করা যাবে। ছয় মাসের কম বয়সী বাছুর এবং দশ বছরের বেশি বয়সী পশু বীমার আওতায় আসবে না। পশুর মৃত্যু হলে চব্বিশ ঘণ্টার মধ্যে প্রকল্প কার্যালয়কে জানাতে হবে এবং কানের ট্যাগসহ মৃত পশুর ছবি জমা দিতে হবে। পশু চিকিৎসকের প্রতিবেদন পাওয়ার পর দাবির অর্থ খামারির মোবাইল ব্যাংকিং অ্যাকাউন্টে পাঠানো হবে। ক্যাম্পে আসার সময় জাতীয় পরিচয়পত্রের ফটোকপি ও পশুর একটি ছবি সঙ্গে আনতে হবে। পশু চুরি বা হারিয়ে যাওয়ার ক্ষেত্রে এই বীমা প্রযোজ্য নয়।

