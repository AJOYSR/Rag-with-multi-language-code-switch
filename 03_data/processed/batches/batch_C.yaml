    জোয়ারভাটা কেবল ও ইন্টারনেট নেটওয়ার্কের সম্মানিত গ্রাহকদের জানানো যাচ্ছে যে, বেশ কিছু গ্রাহকের ডিশ লাইন ও ইন্টারনেট সংযোগের মাসিক বিল দীর্ঘদিন ধরে বকেয়া রয়েছে। এতে নেটওয়ার্কের রক্ষণাবেক্ষণ ও কর্মীদের বেতন পরিশোধে সমস্যা সৃষ্টি হচ্ছে।

    যেসব গ্রাহকের দুই মাস বা তার বেশি সময়ের বিল বকেয়া আছে, তাঁদের আগামী ১৯ জানুয়ারি ২০২৭ তারিখের মধ্যে সম্পূর্ণ বকেয়া পরিশোধ করতে হবে। নির্ধারিত তারিখের মধ্যে বিল পরিশোধ না করলে কোনো পূর্বঘোষণা ছাড়াই সংযোগ বিচ্ছিন্ন করা হবে। বিচ্ছিন্ন সংযোগ পুনরায় চালু করতে বকেয়া বিলের সঙ্গে ৩২০ টাকা পুনঃসংযোগ চার্জ দিতে হবে।

    বিল অফিসে নগদে অথবা মোবাইল ব্যাংকিংয়ের মাধ্যমে পরিশোধ করা যাবে। মোবাইল ব্যাংকিংয়ে বিল পাঠানোর সময় রেফারেন্স হিসেবে অবশ্যই গ্রাহক নম্বর লিখতে হবে। বিল পরিশোধের পর রশিদ সংরক্ষণ করার অনুরোধ করা হলো। আমাদের কোনো প্রতিনিধি বাড়িতে গিয়ে বিল সংগ্রহ করলে তিনি অবশ্যই ছাপানো রশিদ দেবেন। নতুন বছরে গ্রাহকদের জন্য উচ্চগতির নতুন ইন্টারনেট প্যাকেজ চালুর পরিকল্পনা রয়েছে, যা শিগগিরই জানানো হবে। লাইনে কোনো সমস্যা হলে অফিসে অভিযোগ জানালে চব্বিশ ঘণ্টার মধ্যে সমাধানের চেষ্টা করা হবে।

