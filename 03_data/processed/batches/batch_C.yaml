    নগরবাসীর অবগতির জন্য জানানো যাচ্ছে যে, যাত্রীসেবার মান উন্নয়নের লক্ষ্যে ধানশালিক সিটি বাস ডিপোর বহরে নতুন বাস সংযোজন করা হয়েছে। নতুন বাসগুলো নিচু মেঝেবিশিষ্ট, ফলে বয়স্ক ও শারীরিক প্রতিবন্ধী যাত্রীরা সহজে ওঠানামা করতে পারবেন।

    এ মাসে ডিপোর বহরে মোট ২৮টি নতুন বাস যুক্ত হয়েছে। এগুলো ডিপো থেকে রেলস্টেশন, মেডিকেল কলেজ ও নদীবন্দর রুটে চলাচল করবে। প্রতিটি বাসে নারী, শিশু ও প্রতিবন্ধী যাত্রীদের জন্য সংরক্ষিত আসন থাকবে এবং চালকের পাশে জরুরি যোগাযোগের বোতাম থাকবে।

    নিয়মিত যাত্রীদের সুবিধার্থে মাসিক বাস পাস চালু করা হয়েছে। সাধারণ যাত্রীদের মাসিক পাসের মূল্য ১,২০০ টাকা এবং শিক্ষার্থীদের জন্য তা অর্ধেক। মাসিক পাস দিয়ে ডিপোর যেকোনো রুটের বাসে মাসের যেকোনো দিন যতবার খুশি যাতায়াত করা যাবে। পাস করতে এক কপি ছবি ও জাতীয় পরিচয়পত্র অথবা শিক্ষার্থী পরিচয়পত্রের ফটোকপি জমা দিতে হবে। পাস হস্তান্তরযোগ্য নয়; অন্য কেউ পাস ব্যবহার করলে তা বাজেয়াপ্ত করা হবে। বাসে ওঠার সময় লাইন মেনে চলা এবং চলন্ত বাসে না ওঠার জন্য যাত্রীদের অনুরোধ করা হলো। চালক বা কন্ডাক্টরের আচরণ নিয়ে কোনো অভিযোগ থাকলে ডিপো ব্যবস্থাপকের কার্যালয়ে লিখিতভাবে জানানো যাবে।

