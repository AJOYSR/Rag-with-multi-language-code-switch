    নতুন আন্তঃনগর ট্রেন চালু সংক্রান্ত বিজ্ঞপ্তি

    যাত্রীসাধারণের অবগতির জন্য জানানো যাচ্ছে যে, বেলিফুলিয়া রেল জংশন থেকে উপকূলীয় শহর লবণপাড়া পর্যন্ত একটি নতুন আন্তঃনগর ট্রেন চালু হতে যাচ্ছে। ট্রেনটির নাম রাখা হয়েছে "সাগরদোলা এক্সপ্রেস"। আগামী ৩ মার্চ ২০২৭ তারিখে ট্রেনটির উদ্বোধনী যাত্রা অনুষ্ঠিত হবে।

    ট্রেনটিতে শীতাতপ নিয়ন্ত্রিত চেয়ার, শোভন চেয়ার ও স্নিগ্ধা শ্রেণির আসন থাকবে। ট্রেনটিতে মোট ১৪টি যাত্রীবাহী বগি সংযুক্ত করা হয়েছে। নারী যাত্রীদের জন্য আলাদা আসন সংরক্ষিত থাকবে এবং ট্রেনে একটি খাবার গাড়ি থাকবে। ট্রেনটি সাপ্তাহিক ছুটির দিন বুধবার ছাড়া প্রতিদিন চলাচল করবে।

    সাগরদোলা এক্সপ্রেস বেলিফুলিয়া থেকে প্রতিদিন সকাল ৭টা ১৫ মিনিটে ছেড়ে যাবে এবং পথে চারটি স্টেশনে যাত্রাবিরতি করবে। ফিরতি পথে ট্রেনটি লবণপাড়া থেকে বিকেল ৪টায় ছাড়বে। অগ্রিম টিকিট যাত্রার দশ দিন আগে থেকে স্টেশনের কাউন্টার ও অনলাইনে পাওয়া যাবে। ট্রেনে ভ্রমণের সময় যাত্রীদের টিকিটের সঙ্গে জাতীয় পরিচয়পত্র বহন করতে হবে। শিশুদের জন্য নির্ধারিত নিয়মে অর্ধেক ভাড়া প্রযোজ্য হবে। স্টেশনে প্রবেশ ও বহির্গমনের সময় শৃঙ্খলা বজায় রাখার অনুরোধ করা হলো।

