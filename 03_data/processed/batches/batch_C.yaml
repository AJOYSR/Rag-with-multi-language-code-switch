    গত সপ্তাহে গভীর রাতে তেঁতুলঝোরা বাজারের কাপড়পট্টি ও মুদিপট্টিতে আকস্মিক অগ্নিকাণ্ডের ঘটনা ঘটে। স্থানীয় জনগণ ও দমকল কর্মীদের প্রায় তিন ঘণ্টার চেষ্টায় আগুন নিয়ন্ত্রণে আসে। সৌভাগ্যক্রমে কেউ হতাহত হননি, তবে ব্যবসায়ীদের ব্যাপক আর্থিক ক্ষতি হয়েছে।

    সমিতির প্রাথমিক জরিপ অনুযায়ী অগ্নিকাণ্ডে মোট ৫৩টি দোকান সম্পূর্ণ বা আংশিকভাবে ক্ষতিগ্রস্ত হয়েছে। ক্ষতিগ্রস্ত প্রতিটি দোকানের মালিককে সমিতির জরুরি তহবিল থেকে ২৫,০০০ টাকা করে নগদ সহায়তা দেওয়া হবে। সহায়তার অর্থ আগামী শনিবার সমিতির কার্যালয়ে বিতরণ করা হবে।

    সহায়তা গ্রহণের সময় দোকান মালিককে ট্রেড লাইসেন্স ও জাতীয় পরিচয়পত্রের মূল কপি দেখাতে হবে। যেসব দোকান ভাড়া নিয়ে চালানো হতো, সেগুলোর ক্ষেত্রে ভাড়াটিয়া ব্যবসায়ী সহায়তা পাবেন। ক্ষতিগ্রস্ত ব্যবসায়ীদের সহজ শর্তে ঋণ দেওয়ার বিষয়ে স্থানীয় সমবায় ব্যাংকের সঙ্গে আলোচনা চলছে। ভবিষ্যতে এ ধরনের দুর্ঘটনা এড়াতে বাজারের পুরোনো বৈদ্যুতিক তার পরিবর্তন এবং প্রতিটি পট্টিতে অগ্নিনির্বাপণ যন্ত্র স্থাপনের সিদ্ধান্ত নেওয়া হয়েছে। রাতে বাজারে নৈশপ্রহরীর সংখ্যা বাড়ানো হবে। বিত্তবান ব্যক্তিদের ক্ষতিগ্রস্ত ব্যবসায়ীদের পাশে দাঁড়ানোর আহ্বান জানানো হলো।

