    প্রকল্পে অংশ নিতে ইচ্ছুক সদস্যদের প্রতি মাসে ন্যূনতম ৫০০ টাকা করে জমা দিতে হবে। মাসিক কিস্তি প্রতি মাসের প্রথম সপ্তাহে সমিতির মাসিক সভায় জমা নেওয়া হবে। মেয়াদ শেষে জমাকৃত অর্থের সঙ্গে সমিতির বার্ষিক লভ্যাংশ যোগ করে সদস্যদের অর্থ বুঝিয়ে দেওয়া হবে। মেয়াদ পূর্ণ হওয়ার আগে কোনো সদস্য প্রকল্পের জমাকৃত অর্থ উত্তোলন করতে পারবেন না।

    প্রকল্পের হিসাব সমিতির কোষাধ্যক্ষ রোকসানা বেগম মিলি সংরক্ষণ করবেন এবং প্রতি ছয় মাস পর সদস্যদের সামনে আয়-ব্যয়ের হিসাব উপস্থাপন করা হবে। প্রত্যেক সদস্যকে একটি সঞ্চয় পাসবই দেওয়া হবে, যেখানে প্রতিটি জমার তথ্য লিখে কোষাধ্যক্ষ স্বাক্ষর করবেন। পরপর তিন মাস কিস্তি জমা না দিলে সদস্যকে লিখিতভাবে সতর্ক করা হবে। সমিতির তহবিল থেকে সদস্যদের জরুরি প্রয়োজনে স্বল্পমেয়াদি ঋণ দেওয়ার বিষয়টি পরবর্তী সভায় আলোচনা করা হবে। প্রকল্পে নাম লেখাতে আগ্রহী সদস্যদের সমিতির সভানেত্রীর সঙ্গে যোগাযোগ করার অনুরোধ করা হলো।

