    মেহেদিপাতা পৌরসভার সর্বসাধারণের অবগতির জন্য জানানো যাচ্ছে যে, মেহেদিপাতা পৌর কাঁচাবাজারে নবনির্মিত দ্বিতল শেডে সবজি, মাছ ও মুরগি বিক্রেতাদের জন্য দোকান বরাদ্দ দেওয়া হবে। পুরোনো বাজারের ভাসমান ও ফুটপাতের বিক্রেতারা বরাদ্দের ক্ষেত্রে অগ্রাধিকার পাবেন।

    নতুন শেডে মোট ১২০টি দোকান তৈরি করা হয়েছে। এর মধ্যে ২৭টি দোকান নারী বিক্রেতাদের জন্য সংরক্ষিত রাখা হয়েছে। প্রতিটি দোকানের মাসিক ভাড়া ৯৫০ টাকা, যা প্রতি মাসের প্রথম সপ্তাহে পৌরসভার রাজস্ব শাখায় জমা দিতে হবে। দোকান বরাদ্দ পাওয়ার পর জামানত হিসেবে তিন মাসের ভাড়া অগ্রিম জমা দিতে হবে।

    আবেদনপত্রের সঙ্গে জাতীয় পরিচয়পত্রের ফটোকপি, দুই কপি ছবি এবং ওয়ার্ড কাউন্সিলরের প্রত্যয়নপত্র জমা দিতে হবে। একজন আবেদনকারী শুধু একটি দোকানের জন্য আবেদন করতে পারবেন এবং বরাদ্দকৃত দোকান অন্য কারও কাছে ভাড়া দেওয়া বা হস্তান্তর করা যাবে না। আবেদনের সংখ্যা দোকানের চেয়ে বেশি হলে প্রকাশ্য লটারির মাধ্যমে বরাদ্দ দেওয়া হবে। নতুন শেডে পানি সরবরাহ, পয়ঃনিষ্কাশন ও বর্জ্য ফেলার নির্দিষ্ট স্থান রয়েছে। বাজারের পরিচ্ছন্নতা রক্ষায় সকল বিক্রেতাকে সহযোগিতা করার অনুরোধ করা হলো।

