    চাঁদকুমারী খেয়াঘাটের ইজারাদারের পক্ষ থেকে সর্বসাধারণের অবগতির জন্য জানানো যাচ্ছে যে, উপজেলা পরিষদের অনুমোদনক্রমে আগামী মাসের প্রথম দিন থেকে খেয়া পারাপারের নতুন ভাড়া কার্যকর হবে। জ্বালানি তেলের দাম ও মাঝিদের মজুরি বৃদ্ধির কারণে ভাড়া পুনর্নির্ধারণ করা হয়েছে।

    নতুন তালিকা অনুযায়ী প্রাপ্তবয়স্ক যাত্রীপ্রতি ভাড়া ১২ টাকা এবং দশ বছরের কম বয়সী শিশুদের জন্য ভাড়া লাগবে না। বাইসাইকেলসহ যাত্রীর ভাড়া ২০ টাকা। মোটরসাইকেলসহ চালকের পারাপার ভাড়া ৪৫ টাকা। গরু, মহিষ বা ছাগলসহ পারাপারের জন্য পশুপ্রতি আলাদা ভাড়া প্রযোজ্য হবে। নির্ধারিত হারের বেশি ভাড়া আদায় করা হলে উপজেলা পরিষদে অভিযোগ জানানো যাবে।

    খেয়া নৌকা প্রতিদিন ভোর ৫টা থেকে রাত ১০টা পর্যন্ত চলাচল করবে। রাত ১০টার পর জরুরি রোগী পারাপারের প্রয়োজন হলে ঘাটে অবস্থানরত মাঝির সঙ্গে যোগাযোগ করা যাবে। প্রতিটি নৌকায় লাইফ জ্যাকেট রাখা বাধ্যতামূলক এবং ধারণক্ষমতার অতিরিক্ত যাত্রী তোলা যাবে না। ঝড়ো আবহাওয়ায় খেয়া চলাচল সাময়িকভাবে বন্ধ থাকবে। স্কুল-কলেজের শিক্ষার্থীরা পরিচয়পত্র দেখিয়ে মাসিক চুক্তিতে কম ভাড়ায় পারাপার হতে পারবে। ভাড়ার তালিকা ঘাটের দুই পাশে টাঙিয়ে রাখা হয়েছে।

