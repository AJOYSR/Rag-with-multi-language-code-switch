    ফড়িংডাঙা ট্রাক ও কাভার্ড ভ্যান মালিক সমিতির সকল সদস্যের অবগতির জন্য জানানো যাচ্ছে যে, বিগত কার্যনির্বাহী কমিটির মেয়াদ শেষ হওয়ায় এবং নির্ধারিত সময়ে নির্বাচন আয়োজন সম্ভব না হওয়ায় সমিতির সাধারণ সভায় একটি অন্তর্বর্তীকালীন আহ্বায়ক কমিটি গঠন করা হয়েছে।

    ১১ সদস্যবিশিষ্ট এই আহ্বায়ক কমিটির আহ্বায়ক মনোনীত হয়েছেন প্রবীণ ট্রাক মালিক আবদুল খালেক মুন্সী। কমিটির সদস্যসচিবের দায়িত্ব পালন করবেন সমিতির সাবেক কোষাধ্যক্ষ। আহ্বায়ক কমিটি আগামী ছয় মাসের মধ্যে সদস্য তালিকা হালনাগাদ করে একটি সুষ্ঠু নির্বাচন আয়োজন করবে।

    এই সময়ের মধ্যে সমিতির দৈনন্দিন কার্যক্রম, ট্রাক টার্মিনালের সিরিয়াল ব্যবস্থাপনা এবং চালকদের কল্যাণ তহবিল আহ্বায়ক কমিটি পরিচালনা করবে। সদস্যদের মাসিক চাঁদা আগের হারেই সমিতির অফিসে জমা দিতে হবে। সদস্যপদ নবায়নের জন্য প্রত্যেক মালিককে গাড়ির রেজিস্ট্রেশন সনদ ও ফিটনেস সনদের ফটোকপি জমা দিতে হবে। টার্মিনাল এলাকায় অবৈধ চাঁদা আদায়ের বিষয়ে কোনো অভিযোগ থাকলে সরাসরি আহ্বায়ক কমিটিকে জানানোর অনুরোধ করা হলো। পণ্য পরিবহনের ভাড়া নিয়ে ব্যবসায়ীদের সঙ্গে চলমান আলোচনা আহ্বায়ক কমিটির তত্ত্বাবধানে অব্যাহত থাকবে। সমিতির ঐক্য ও শৃঙ্খলা বজায় রাখতে সকল সদস্যের সহযোগিতা কামনা করা হলো।

