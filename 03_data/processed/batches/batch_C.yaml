    ধুন্দুলবাড়ি কুরিয়ার সার্ভিসের সম্মানিত গ্রাহকদের জানাতে পেরে আমরা আনন্দিত যে, গ্রাহকদের ক্রমবর্ধমান চাহিদার কারণে আমাদের সেবার আওতা উল্লেখযোগ্যভাবে বাড়ানো হয়েছে। গত এক বছরে বিভিন্ন উপজেলা শহরে নতুন শাখা খোলা হয়েছে এবং পার্সেল পরিবহনের জন্য নিজস্ব কাভার্ড ভ্যান যুক্ত করা হয়েছে।

    বর্তমানে আমাদের সেবা দেশের মোট ৩৮টি জেলায় পাওয়া যাচ্ছে। এ বছরের মধ্যে আরও কয়েকটি জেলায় শাখা খোলার পরিকল্পনা রয়েছে। প্রধান শাখা থেকে শহরের ভেতরে একই দিনে পার্সেল পৌঁছে দেওয়ার নতুন সেবা চালু করা হয়েছে, যার চার্জ ১৫০ টাকা। দুপুর ১২টার আগে বুক করা পার্সেলই কেবল একই দিনে পৌঁছানো হবে।

    গ্রাহকরা পার্সেল বুকিংয়ের পর মোবাইলে খুদে বার্তার মাধ্যমে ট্র্যাকিং নম্বর পাবেন এবং পার্সেল পৌঁছানোর পর প্রাপকের স্বাক্ষর সংগ্রহ করা হবে। নিয়মিত ব্যবসায়ী গ্রাহকদের জন্য মাসিক চুক্তিভিত্তিক বিশেষ সুবিধা রয়েছে। গুরুত্বপূর্ণ দলিল ও মূল্যবান সামগ্রী পাঠাতে চাইলে বুকিংয়ের সময় তা ঘোষণা করতে হবে এবং অতিরিক্ত বীমা চার্জ প্রযোজ্য হবে। আমাদের সকল শাখা শুক্রবার বন্ধ থাকে। সেবার মান উন্নয়নে আপনাদের মতামত সাদরে গ্রহণ করা হবে।

