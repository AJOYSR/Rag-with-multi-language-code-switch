    বর্ষা মৌসুমে গবাদিপশুর তড়কা ও বাদলা রোগের প্রাদুর্ভাব রোধে গোধূলিহাট গবাদিপশু পালনকারী সমিতি উপজেলা প্রাণিসম্পদ দপ্তরের সহযোগিতায় একটি বিশেষ টিকাদান ক্যাম্পের আয়োজন করেছে। ক্যাম্প অনুষ্ঠিত হবে ২৭ সেপ্টেম্বর ২০২৭ তারিখে, গোধূলিহাট পশুর হাটের খোলা চত্বরে, সকাল ৮টা থেকে দুপুর ২টা পর্যন্ত।

    ক্যাম্পে গরু, মহিষ, ছাগল ও ভেড়াকে টিকা দেওয়া হবে। প্রত্যেক খামারি সর্বোচ্চ ১৪টি গবাদিপশুকে এই ক্যাম্পে টিকা দেওয়াতে পারবেন। সমিতির সদস্যদের জন্য টিকা সম্পূর্ণ বিনামূল্যে; অ-সদস্য খামারিদের প্রতি পশুর জন্য নামমাত্র মূল্য দিতে হবে। টিকা দেওয়ার পাশাপাশি অভিজ্ঞ প্রাণিচিকিৎসকেরা পশুর কৃমিনাশক ওষুধ সম্পর্কে পরামর্শ দেবেন।

    খামারিদের অনুরোধ করা হচ্ছে, অসুস্থ, গর্ভাবস্থার শেষ পর্যায়ে থাকা এবং তিন মাসের কম বয়সী বাছুরকে ক্যাম্পে না আনতে। পশু আনার সময় দড়ি দিয়ে শক্ত করে বেঁধে আনতে হবে এবং ভিড় এড়াতে নির্ধারিত সারিতে অপেক্ষা করতে হবে। প্রতিটি টিকাপ্রাপ্ত পশুর কানে চিহ্ন দেওয়া হবে এবং খামারিকে একটি টিকা কার্ড দেওয়া হবে, যা পরবর্তী টিকার সময় সঙ্গে আনতে হবে।

    টিকাদানের পর দুই-তিন দিন পশুকে ভারী কাজে না লাগানো এবং পর্যাপ্ত পানি ও খাবার দেওয়ার পরামর্শ দেওয়া হচ্ছে। বিস্তারিত জানতে সমিতির কার্যালয়ে যোগাযোগ করুন।

