    শহরে সবুজের পরিমাণ বাড়াতে এবং নিরাপদ সবজি উৎপাদনে নাগরিকদের উৎসাহিত করতে লতাকস্তুরী নাগরিক পরিবেশ ফোরাম এ বছর দ্বিতীয়বারের মতো লতাকস্তুরী ছাদবাগান প্রতিযোগিতার আয়োজন করেছে। পৌর এলাকার যেকোনো বাসাবাড়ি, অফিস বা শিক্ষাপ্রতিষ্ঠানের ছাদবাগান এই প্রতিযোগিতায় অংশ নিতে পারবে।

    প্রতিযোগিতায় নিবন্ধনের শেষ তারিখ ৩০ এপ্রিল ২০২৭। নিবন্ধনের সময় বাগানের কয়েকটি ছবি, ঠিকানা ও বাগানের আনুমানিক আয়তন জমা দিতে হবে। নিবন্ধন সম্পূর্ণ বিনামূল্যে। মে ও জুন মাসে বিচারকমণ্ডলী সরেজমিনে বাগানগুলো পরিদর্শন করবেন।

    গাছের বৈচিত্র্য, জৈব পদ্ধতির ব্যবহার, পানি সাশ্রয়, বর্জ্য থেকে কম্পোস্ট তৈরি এবং বাগানের সামগ্রিক পরিচর্যা বিবেচনা করে নম্বর দেওয়া হবে। রাসায়নিক কীটনাশক ব্যবহারের প্রমাণ পাওয়া গেলে সংশ্লিষ্ট বাগান প্রতিযোগিতা থেকে বাদ পড়বে।

    পুরস্কার: প্রথম পুরস্কার নগদ ১২,০০০ টাকা ও সম্মাননা ক্রেস্ট। দ্বিতীয় পুরস্কার নগদ ৮,০০০ টাকা এবং তৃতীয় পুরস্কার নগদ ৫,০০০ টাকা। এছাড়া শিক্ষাপ্রতিষ্ঠানের সেরা ছাদবাগানের জন্য একটি বিশেষ পুরস্কার এবং অংশগ্রহণকারী সবাইকে সনদপত্র ও একটি করে ফলের চারা দেওয়া হবে। পুরস্কার বিতরণী অনুষ্ঠানের তারিখ পরে জানানো হবে। ফোরামের স্বেচ্ছাসেবকরা নতুন ছাদবাগানিদের জন্য বিনামূল্যে পরামর্শ দেবেন।

