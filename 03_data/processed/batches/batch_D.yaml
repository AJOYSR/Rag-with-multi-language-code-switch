    মেলা প্রাঙ্গণে মোট ৮৪টি স্টল বসানো হবে, যার মধ্যে কিছু স্টল নারী উদ্যোক্তাদের জন্য সংরক্ষিত থাকবে। ছোট আকারের প্রতিটি স্টলের ভাড়া পুরো মেলার জন্য ২,৭৫০ টাকা। বড় আকারের খাবারের স্টলের ভাড়া ৪,৬০০ টাকা, যা বিদ্যুৎ বিলসহ নির্ধারিত। আবেদন ফরম পরিষদের অফিস থেকে ৫০ টাকার বিনিময়ে সংগ্রহ করা যাবে। স্টল ভাড়া মোবাইল ব্যাংকিং বা নগদে পরিশোধ করা যাবে, তবে বরাদ্দপত্র পাওয়ার আগে পুরো ভাড়া জমা দিতে হবে। একজন আবেদনকারী একাধিক স্টলের জন্য আবেদন করতে পারবেন না।

    মেলা চলাকালীন প্রতিদিন বিকেল থেকে রাত পর্যন্ত সাংস্কৃতিক অনুষ্ঠান, লোকগান ও পুতুলনাচ পরিবেশিত হবে। মেলা প্রাঙ্গণে ধূমপান সম্পূর্ণ নিষিদ্ধ। নিরাপত্তার জন্য পরিষদের স্বেচ্ছাসেবক দল সার্বক্ষণিক দায়িত্ব পালন করবে। স্টল বরাদ্দ লটারির মাধ্যমে নির্ধারণ করা হবে এবং ফলাফল পরিষদের নোটিশ বোর্ডে টাঙিয়ে দেওয়া হবে। বিস্তারিত জানতে পরিষদের অফিসে সকাল ১০টা থেকে বিকেল ৫টার মধ্যে যোগাযোগ করুন।

