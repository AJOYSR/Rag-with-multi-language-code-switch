    কলমিলতা জীবিকা উন্নয়ন প্রকল্পের আওতায় কর্ম এলাকার বেকার তরুণ-তরুণী ও গৃহিণীদের জন্য হাঁস-মুরগি পালন বিষয়ক একটি প্রশিক্ষণ কোর্সের আয়োজন করা হয়েছে। প্রশিক্ষণের মেয়াদ ২১ দিন। প্রশিক্ষণ শুরু হবে ৪ এপ্রিল ২০২৭ তারিখে এবং প্রতিদিন সকাল ১০টা থেকে বিকেল ৩টা পর্যন্ত প্রকল্পের প্রশিক্ষণ কেন্দ্রে ক্লাস চলবে।

    প্রশিক্ষণে খামারের ঘর তৈরি, বাচ্চা লালন-পালন, সুষম খাদ্য তৈরি, টিকা প্রদান, সাধারণ রোগ চেনা ও প্রতিরোধ, ডিম ও মাংস বাজারজাতকরণ এবং খামারের আয়-ব্যয়ের হিসাব রাখা শেখানো হবে। প্রশিক্ষণ চলাকালীন প্রত্যেক অংশগ্রহণকারী দৈনিক যাতায়াত ভাতা পাবেন। তাত্ত্বিক ক্লাসের পাশাপাশি নিকটবর্তী দুটি সফল খামারে মাঠ পরিদর্শনের ব্যবস্থা থাকবে।

    আবেদনকারীর বয়স ১৮ থেকে ৪৫ বছরের মধ্যে হতে হবে এবং ন্যূনতম পঞ্চম শ্রেণি পাস হতে হবে। যাঁদের বাড়িতে ছোট পরিসরে হাঁস-মুরগি পালনের জায়গা আছে, তাঁদের অগ্রাধিকার দেওয়া হবে। প্রতি ব্যাচে সীমিত সংখ্যক প্রশিক্ষণার্থী নেওয়া হবে। প্রশিক্ষণ শেষে সফল প্রশিক্ষণার্থীদের সনদপত্র দেওয়া হবে এবং আগ্রহীদের খামার শুরু করতে প্রকল্পের সহজ শর্তের ঋণ কর্মসূচির সঙ্গে যুক্ত করা হবে। আবেদনপত্র প্রকল্পের ইউনিয়ন অফিস থেকে সংগ্রহ করে জাতীয় পরিচয়পত্রের ফটোকপি ও এক কপি ছবিসহ জমা দিতে হবে। আবেদন জমার শেষ তারিখ ২৫ মার্চ ২০২৭।

