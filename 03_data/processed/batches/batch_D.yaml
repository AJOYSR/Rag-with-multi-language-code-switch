    স্বেচ্ছায় রক্তদান কর্মসূচি

    মানবতার সেবায় এগিয়ে আসার আহ্বান জানিয়ে ঘাসফড়িং যুব সংঘ প্রতি বছরের মতো এবারও স্বেচ্ছায় রক্তদান কর্মসূচির আয়োজন করেছে। রক্তদান কর্মসূচি অনুষ্ঠিত হবে ১১ জুন ২০২৭ তারিখে সংঘের নিজস্ব কার্যালয়ে। কর্মসূচিতে উপজেলা স্বাস্থ্য কমপ্লেক্সের অভিজ্ঞ চিকিৎসক ও টেকনোলজিস্টরা উপস্থিত থাকবেন এবং জীবাণুমুক্ত সরঞ্জাম ব্যবহার করে রক্ত সংগ্রহ করবেন।

    রক্তদাতার বয়স ১৮ থেকে ৬০ বছরের মধ্যে হতে হবে এবং ওজন কমপক্ষে ৫০ কেজি হতে হবে। গত চার মাসের মধ্যে যাঁরা রক্ত দিয়েছেন, তাঁরা এবার রক্ত দিতে পারবেন না। জ্বর, সর্দি-কাশি বা কোনো সংক্রামক রোগে আক্রান্ত ব্যক্তিরা রক্তদান থেকে বিরত থাকবেন। রক্ত দেওয়ার আগে প্রত্যেক দাতার রক্তচাপ ও হিমোগ্লোবিন পরীক্ষা করা হবে।

    আগ্রহী রক্তদাতাদের ৮ জুন ২০২৭ তারিখের মধ্যে সংঘের স্বেচ্ছাসেবকদের কাছে নাম ও রক্তের গ্রুপ নিবন্ধন করতে অনুরোধ করা হলো। রক্তদানের আগের রাতে পর্যাপ্ত ঘুম এবং সকালে হালকা খাবার খেয়ে আসার পরামর্শ দেওয়া হচ্ছে। প্রত্যেক রক্তদাতাকে রক্তদানের পর ফলের রস ও হালকা নাশতা দেওয়া হবে এবং একটি রক্তদাতা সনদ ও রক্তের গ্রুপ উল্লেখ করা কার্ড প্রদান করা হবে। সংগৃহীত রক্ত উপজেলা হাসপাতালের রক্ত সঞ্চালন বিভাগে মুমূর্ষু রোগীদের জন্য সংরক্ষণ করা হবে।

