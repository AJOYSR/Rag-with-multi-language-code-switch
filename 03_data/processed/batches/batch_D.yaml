    শীতের ঐতিহ্য ধরে রাখতে হিমঝুরি সাংস্কৃতিক পরিষদের আয়োজনে তিন দিনব্যাপী হিমঝুরি পিঠা উৎসব অনুষ্ঠিত হবে ১৪ থেকে ১৬ জানুয়ারি ২০২৭ পর্যন্ত, পৌর ঈদগাহ মাঠের পাশের খোলা প্রাঙ্গণে। প্রতিদিন দুপুর ২টা থেকে রাত ৯টা পর্যন্ত উৎসব চলবে।

    উৎসবে এলাকার গৃহিণী ও ক্ষুদ্র উদ্যোক্তাদের ৪০টির বেশি স্টলে ভাপা, চিতই, পাটিসাপটা, দুধপুলি, নকশি পিঠা, পাকান ও তেলের পিঠাসহ নানা ধরনের পিঠা পাওয়া যাবে। এছাড়া খেজুরের গুড় ও গুড়ের তৈরি মিষ্টান্নের আলাদা স্টল থাকবে। উৎসবের শেষ দিনে সেরা পিঠা প্রস্তুতকারীদের মধ্যে পুরস্কার বিতরণ করা হবে।

    উৎসব প্রাঙ্গণে প্রবেশ টিকিটের মূল্য জনপ্রতি ৩০ টাকা। প্রতিদিন সন্ধ্যায় লোকগান, পালাগান ও বাউল গানের আসর বসবে। উৎসবের দ্বিতীয় দিন সকালে শিশুদের জন্য চিত্রাঙ্কন প্রতিযোগিতার আয়োজন করা হবে। দর্শনার্থীদের সুবিধার জন্য প্রাঙ্গণে বসার জায়গা, বিশুদ্ধ খাবার পানি ও অস্থায়ী শৌচাগারের ব্যবস্থা থাকবে।

    স্টল বরাদ্দ সম্পন্ন হয়েছে; নতুন কোনো স্টলের আবেদন গ্রহণ করা হবে না। পরিবেশ রক্ষার জন্য উৎসব প্রাঙ্গণে পলিথিনের ব্যাগ ব্যবহার নিরুৎসাহিত করা হচ্ছে এবং বিক্রেতাদের কাগজের ঠোঙা ব্যবহারের অনুরোধ করা হয়েছে। নিরাপত্তার জন্য স্বেচ্ছাসেবক ও আনসার সদস্যরা দায়িত্ব পালন করবেন। পরিবার-পরিজন নিয়ে উৎসবে আসার আমন্ত্রণ রইল।

