    হরিণমারা প্রবীণ কল্যাণ সমিতির সম্মানিত সদস্যদের জানানো যাচ্ছে যে, প্রতি বছরের মতো এবারও সমিতির বার্ষিক বনভোজনের আয়োজন করা হয়েছে। বনভোজন অনুষ্ঠিত হবে ৫ ফেব্রুয়ারি ২০২৭ তারিখে, শহর থেকে প্রায় এক ঘণ্টার দূরত্বে অবস্থিত একটি বাগানবাড়িতে। সকাল ৮টায় সমিতির কার্যালয়ের সামনে থেকে বাস ছেড়ে যাবে এবং সন্ধ্যার আগে ফিরে আসবে।

    বনভোজনে অংশ নিতে প্রত্যেক সদস্যের জন্য চাঁদা ৯৫০ টাকা। সদস্যদের সঙ্গে আসা অতিথিদের জন্য জনপ্রতি চাঁদা ১,১০০ টাকা। দশ বছরের কম বয়সী নাতি-নাতনিদের জন্য কোনো চাঁদা লাগবে না। চাঁদার মধ্যে যাতায়াত, সকালের নাশতা, দুপুরের খাবার ও বিকেলের চা অন্তর্ভুক্ত।

    প্রবীণ সদস্যদের সুবিধার কথা বিবেচনা করে বাগানবাড়িতে ছায়াযুক্ত বসার জায়গা, হুইলচেয়ার চলাচলের উপযোগী পথ এবং প্রাথমিক চিকিৎসার ব্যবস্থা রাখা হবে। একজন চিকিৎসক সারাদিন দলের সঙ্গে থাকবেন। যাঁদের ডায়াবেটিস বা উচ্চ রক্তচাপ আছে, তাঁদের জন্য আলাদা খাবারের ব্যবস্থা থাকবে; নিবন্ধনের সময় তা জানাতে হবে। নিজ নিজ নিয়মিত ওষুধ সঙ্গে আনার অনুরোধ করা হলো।

    দিনব্যাপী আয়োজনে স্মৃতিচারণ, কবিতা আবৃত্তি, গানের আসর এবং প্রবীণদের জন্য হালকা মজার খেলা থাকবে, শেষে র‍্যাফেল ড্র অনুষ্ঠিত হবে। আগ্রহী সদস্যদের ২৫ জানুয়ারি ২০২৭ তারিখের মধ্যে সমিতির কোষাধ্যক্ষের কাছে চাঁদা জমা দিয়ে নাম নিবন্ধন করতে হবে। আসন সীমিত।

