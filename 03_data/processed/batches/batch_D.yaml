    অশ্বত্থতলা সার্বজনীন পূজা উদযাপন কমিটির পক্ষ থেকে এলাকাবাসীকে জানানো যাচ্ছে যে, এবারের শারদীয় উৎসবের পাঁচ দিন মণ্ডপ ও আশেপাশের এলাকায় শৃঙ্খলা বজায় রাখতে একটি স্বেচ্ছাসেবক দল গঠন করা হয়েছে। এবার মোট ৬০ জন স্বেচ্ছাসেবক পালাক্রমে দায়িত্ব পালন করবেন। স্বেচ্ছাসেবক দলের সমন্বয়কের দায়িত্ব পালন করবেন প্রণবেশ হালদার। স্বেচ্ছাসেবকরা হলুদ রঙের জ্যাকেট ও পরিচয়পত্র পরে থাকবেন।

    দর্শনার্থীদের সুবিধার জন্য মণ্ডপে প্রবেশ ও বের হওয়ার আলাদা পথ রাখা হবে। নারী, শিশু ও প্রবীণদের জন্য আলাদা সারির ব্যবস্থা থাকবে। মণ্ডপ এলাকায় সিসিটিভি ক্যামেরা বসানো হবে এবং একটি তথ্যকেন্দ্র খোলা থাকবে, যেখানে হারানো জিনিস বা হারিয়ে যাওয়া শিশুর বিষয়ে সহায়তা পাওয়া যাবে। প্রতিদিন রাত ১০টার পর মণ্ডপ এলাকায় মাইক ব্যবহার বন্ধ থাকবে।

    মণ্ডপের ভেতরে জুতা পরে প্রবেশ করা যাবে না; জুতা রাখার জন্য প্রবেশপথে আলাদা স্থান থাকবে। মণ্ডপ প্রাঙ্গণে কোনো ধরনের আতশবাজি বা পটকা ফোটানো সম্পূর্ণ নিষিদ্ধ। দর্শনার্থীদের মূল্যবান জিনিসপত্র সাবধানে রাখার অনুরোধ করা হলো। স্বেচ্ছাসেবক হিসেবে যোগ দিতে আগ্রহী তরুণ-তরুণীরা কমিটির কার্যালয়ে নাম জমা দিতে পারবেন; তাঁদের জন্য উৎসবের আগে একটি প্রস্তুতি সভা অনুষ্ঠিত হবে। সকলের সহযোগিতায় একটি শান্তিপূর্ণ ও সুশৃঙ্খল উৎসব আয়োজন করাই কমিটির লক্ষ্য।

