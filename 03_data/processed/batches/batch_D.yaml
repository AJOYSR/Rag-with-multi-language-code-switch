    প্রশিক্ষণ পরিচালনা করবেন সংস্থার জ্যেষ্ঠ প্রশিক্ষক মাহমুদা ফেরদৌসী। কোর্সে সেলাই মেশিন চালানো, মাপ নেওয়া, কাপড় কাটা, ব্লাউজ, সালোয়ার-কামিজ ও শিশুদের পোশাক তৈরি এবং ছোট ব্যবসা পরিচালনার প্রাথমিক ধারণা দেওয়া হবে। প্রতিটি ব্যাচে সর্বোচ্চ ৩০ জন প্রশিক্ষণার্থী ভর্তি করা হবে।

    ভর্তির যোগ্যতা: বয়স ১৮ থেকে ৪০ বছরের মধ্যে, ন্যূনতম অষ্টম শ্রেণি পাস এবং সংস্থার কর্ম এলাকার স্থায়ী বাসিন্দা হতে হবে। বিধবা, স্বামী পরিত্যক্তা ও প্রতিবন্ধী নারীদের অগ্রাধিকার দেওয়া হবে। কোর্সটি সম্পূর্ণ বিনামূল্যে, তবে প্রশিক্ষণ উপকরণের জন্য ভর্তির সময় ২০০ টাকা জমা দিতে হবে, যা কোর্স শেষে ফেরত দেওয়া হবে।

    সফলভাবে কোর্স সম্পন্নকারীদের সনদপত্র দেওয়া হবে এবং সেরা প্রশিক্ষণার্থীদের সহজ কিস্তিতে সেলাই মেশিন কেনার সুযোগ দেওয়া হবে। আগ্রহী প্রার্থীদের জাতীয় পরিচয়পত্রের ফটোকপি ও দুই কপি ছবিসহ সংস্থার ইউনিয়ন অফিসে যোগাযোগ করতে অনুরোধ করা হলো।

