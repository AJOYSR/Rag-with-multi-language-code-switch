    কারিগর নিয়োগ বিজ্ঞপ্তি

    বাঁশ, বেত, হোগলা ও পাটজাত পণ্যের মাধ্যমে দেশীয় হস্তশিল্প তৈরিকারী প্রতিষ্ঠান কেয়াপাতা হস্তশিল্প কারখানা রপ্তানি আদেশ বৃদ্ধির কারণে দক্ষ কারিগর নিয়োগ দেবে। এ পর্যায়ে মোট ১৪ জন কারিগর নিয়োগ দেওয়া হবে। বাঁশ ও বেতের ঝুড়ি, পাটের ব্যাগ, পাপোশ এবং ঘর সাজানোর সামগ্রী তৈরিতে অভিজ্ঞ নারী ও পুরুষ উভয়েই আবেদন করতে পারবেন।

    প্রার্থীদের প্রথমে কারখানায় একটি ব্যবহারিক দক্ষতা পরীক্ষায় অংশ নিতে হবে, যেখানে নির্ধারিত সময়ের মধ্যে একটি নমুনা পণ্য তৈরি করতে হবে। ব্যবহারিক পরীক্ষায় উত্তীর্ণ প্রার্থীদের মৌখিক সাক্ষাৎকার নেওয়া হবে ১৩ এপ্রিল ২০২৭ তারিখে। সাক্ষাৎকারের সময় প্রার্থীদের পূর্বে তৈরি করা নিজের কাজের নমুনা সঙ্গে আনতে উৎসাহিত করা হচ্ছে।

    কারিগরদের কাজের মান ও পরিমাণ অনুযায়ী মাসিক মজুরি নির্ধারণ করা হবে, সঙ্গে উৎপাদন বোনাস দেওয়া হবে। কারখানায় নিরাপদ কর্মপরিবেশ, শিশু দিবাযত্ন কক্ষ এবং দুপুরে বিরতির ব্যবস্থা রয়েছে। নির্বাচিত কারিগরদের নতুন নকশা ও রপ্তানিমানের ফিনিশিং বিষয়ে প্রশিক্ষণ দেওয়া হবে।

    আগ্রহী প্রার্থীদের ৩১ মার্চ ২০২৭ তারিখের মধ্যে কারখানার অফিসে নাম, ঠিকানা ও অভিজ্ঞতার বিবরণসহ আবেদন জমা দিতে হবে। লেখাপড়া কম জানা প্রার্থীরা অফিসে এসে মৌখিকভাবে তথ্য দিয়ে আবেদন করতে পারবেন। ব্যবহারিক পরীক্ষার সময়সূচি আবেদনকারীদের মোবাইলে জানিয়ে দেওয়া হবে।

