    মধুমালতী নিবাসের চতুর্থ তলায় একটি পরিবারবান্ধব ফ্ল্যাট ভাড়া দেওয়া হবে। ফ্ল্যাটটিতে তিনটি শয়নকক্ষ, দুটি বাথরুম, একটি ড্রয়িং-ডাইনিং, রান্নাঘর এবং দক্ষিণমুখী একটি বারান্দা রয়েছে। ফ্ল্যাটটি ১ মে ২০২৭ থেকে ওঠার উপযোগী থাকবে।

    ফ্ল্যাটের মাসিক ভাড়া ১৮,০০০ টাকা। পানি ও বিদ্যুৎ বিল ভাড়ার বাইরে ভাড়াটিয়াকে আলাদাভাবে পরিশোধ করতে হবে। এছাড়া সিঁড়ি পরিষ্কার, দারোয়ান ও ময়লা সংগ্রহ বাবদ মাসিক ১,২০০ টাকা সার্ভিস চার্জ দিতে হবে। ওঠার আগে দুই মাসের ভাড়া অগ্রিম হিসেবে জমা দিতে হবে।

    ফ্ল্যাটে লাইনের গ্যাস সংযোগ নেই, রান্নার জন্য সিলিন্ডার ব্যবহার করতে হবে। ভবনে লিফট নেই, তবে সিঁড়ি প্রশস্ত ও আলোকিত। ছাদে কাপড় শুকানোর ব্যবস্থা আছে। নিচতলায় একটি মোটরসাইকেল রাখার জায়গা পাওয়া যাবে, তবে প্রাইভেট কার রাখার কোনো ব্যবস্থা নেই। নিকটেই প্রাথমিক বিদ্যালয়, কাঁচাবাজার ও মসজিদ রয়েছে।

    শুধুমাত্র ছোট পরিবারকে ফ্ল্যাট ভাড়া দেওয়া হবে; ব্যাচেলর বা মেস হিসেবে ভাড়া দেওয়া হবে না। ভাড়াটিয়াকে চুক্তিপত্রে স্বাক্ষরের সময় জাতীয় পরিচয়পত্রের ফটোকপি এবং পরিবারের সদস্যদের তালিকা জমা দিতে হবে। পোষা প্রাণী রাখার বিষয়ে বাড়ির মালিকের সঙ্গে আগে আলোচনা করতে হবে। ফ্ল্যাট দেখতে চাইলে প্রতিদিন বিকেল ৪টা থেকে সন্ধ্যা ৭টার মধ্যে নিচতলার কেয়ারটেকারের সঙ্গে যোগাযোগ করুন।
