    বকুলডাঙা নাট্যচর্চা কেন্দ্রের প্রতিষ্ঠার পনেরো বছর পূর্তি উপলক্ষে পাঁচ দিনব্যাপী নাট্যোৎসবের আয়োজন করা হয়েছে। নাট্যোৎসবের উদ্বোধন হবে ৬ অক্টোবর ২০২৭ তারিখ সন্ধ্যায়, কেন্দ্রের নিজস্ব মিলনায়তনে। উৎসবে জেলার বিভিন্ন নাট্যদলের মোট আটটি নাটক মঞ্চস্থ হবে।

    প্রতিদিন সন্ধ্যা ৬টা ৩০ মিনিটে প্রথম নাটক এবং রাত ৮টা ১৫ মিনিটে দ্বিতীয় নাটক শুরু হবে। প্রতিটি প্রদর্শনীর টিকিটের মূল্য ১৫০ টাকা। শিক্ষার্থীরা পরিচয়পত্র দেখিয়ে ৮০ টাকায় টিকিট কিনতে পারবেন। পুরো উৎসবের জন্য সাশ্রয়ী মূল্যের মৌসুমি পাসও পাওয়া যাবে। টিকিট মিলনায়তনের কাউন্টারে প্রদর্শনীর দুই ঘণ্টা আগে থেকে বিক্রি শুরু হবে।

    উৎসবের সমাপনী দিনে নাট্যচর্চায় বিশেষ অবদানের জন্য দুজন প্রবীণ নাট্যকর্মীকে সম্মাননা দেওয়া হবে। এছাড়া উৎসব চলাকালীন প্রতিদিন দুপুরে তরুণদের জন্য অভিনয় ও মঞ্চসজ্জা বিষয়ক কর্মশালা অনুষ্ঠিত হবে; কর্মশালায় অংশ নিতে আগে থেকে নাম নিবন্ধন করতে হবে। নাটক শুরু হওয়ার পর মিলনায়তনে প্রবেশ করা যাবে না। মিলনায়তনের ভেতরে ছবি তোলা ও ভিডিও ধারণ নিষিদ্ধ। শিশুদের নিয়ে আসা দর্শকদের অনুরোধ করা হচ্ছে যেন প্রদর্শনী চলাকালীন অন্য দর্শকদের অসুবিধা না হয়। নাট্যপ্রেমী সকলকে উৎসবে আমন্ত্রণ জানানো হলো।

