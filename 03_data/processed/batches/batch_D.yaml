    প্রশিক্ষণ দেবেন মৎস্য বিশেষজ্ঞ শাহনেওয়াজ কিবরিয়া। প্রশিক্ষণে খাঁচা তৈরির উপকরণ ও খরচ, উপযুক্ত স্থান নির্বাচন, মনোসেক্স তেলাপিয়া ও পাঙাশের পোনা মজুদ, ভাসমান খাবার প্রয়োগ, পানির গুণাগুণ পরীক্ষা এবং রোগ ব্যবস্থাপনা বিষয়ে আলোচনা করা হবে। এছাড়া মাছ বাজারজাতকরণ ও সমবায়ভিত্তিক বিক্রয়ের সুবিধা নিয়ে একটি মুক্ত আলোচনা পর্ব থাকবে।

    প্রশিক্ষণে অংশ নিতে নিবন্ধন ফি ২০০ টাকা, যা দিয়ে প্রশিক্ষণ সহায়িকা, খাতা-কলম ও দুপুরের খাবারের খরচ মেটানো হবে। শুধুমাত্র সমিতির নিয়মিত সদস্যরা অংশ নিতে পারবেন; প্রত্যেক সদস্য পরিবারের পক্ষ থেকে একজন করে নিবন্ধন করা যাবে। প্রশিক্ষণ শেষে অংশগ্রহণকারীদের সনদপত্র দেওয়া হবে এবং আগ্রহী সদস্যদের খাঁচা স্থাপনে সমিতির পক্ষ থেকে কারিগরি পরামর্শ দেওয়া হবে। নিবন্ধনের জন্য সমিতির কোষাধ্যক্ষের সঙ্গে কার্যালয়ে যোগাযোগ করুন। আসন সংখ্যা সীমিত হওয়ায় দ্রুত নিবন্ধন করার অনুরোধ করা হলো।

