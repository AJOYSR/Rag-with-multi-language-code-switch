    বোয়ালজুড়ি বিল মৎস্যজীবী সমিতির সদস্যদের অবগতির জন্য জানানো যাচ্ছে যে, চলতি মৌসুমে সমিতির ইজারাকৃত বিল থেকে সম্মিলিতভাবে মাছ আহরণ করা হবে। মাছ আহরণ শেষে আগামী ১৯ নভেম্বর ২০২৭ তারিখে সকাল ৭টা থেকে বিলের উত্তর ঘাটে মাছের প্রকাশ্য নিলাম অনুষ্ঠিত হবে।

    নিলামে শোল, গজার, রুই, কাতলা, বোয়াল ও বিভিন্ন দেশি ছোট মাছ ওজন অনুযায়ী লট আকারে তোলা হবে। প্রতিটি লটের সর্বনিম্ন দর নিলামের আগে ঘাটে টাঙিয়ে দেওয়া হবে। নিলামে শুধুমাত্র সমিতির নিবন্ধিত সদস্যরাই অংশ নিতে পারবেন। সর্বোচ্চ দরদাতাকে সঙ্গে সঙ্গে নগদে মূল্য পরিশোধ করে লট বুঝে নিতে হবে।

    নিলাম থেকে প্রাপ্ত অর্থের একটি অংশ বিলের ইজারার কিস্তি পরিশোধে, একটি অংশ পরবর্তী মৌসুমে পোনা মজুদে এবং বাকি অংশ সদস্যদের মধ্যে সমানভাবে বণ্টন করা হবে। বণ্টনের হিসাব সমিতির বার্ষিক সভায় উপস্থাপন করা হবে।

    মাছ আহরণের কাজে অংশ নেওয়া সদস্যদের নিজ নিজ জাল ও নৌকা নিয়ে ভোর ৫টার মধ্যে ঘাটে উপস্থিত থাকতে হবে। নিষিদ্ধ কারেন্ট জাল ব্যবহার করলে সংশ্লিষ্ট সদস্যের সদস্যপদ স্থগিত করা হবে। ডিমওয়ালা মা মাছ ধরা পড়লে তা বিলে ছেড়ে দিতে হবে। নিলামস্থলে শৃঙ্খলা রক্ষায় সমিতির কার্যনির্বাহী সদস্যরা উপস্থিত থাকবেন।

