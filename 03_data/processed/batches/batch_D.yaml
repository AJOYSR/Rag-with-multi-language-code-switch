    এবারের প্রতিযোগিতায় মোট ১৬টি দল অংশ নেবে। দলগুলোকে চারটি গ্রুপে ভাগ করে লিগ পদ্ধতিতে প্রাথমিক পর্বের খেলা হবে এবং প্রতি গ্রুপের শীর্ষ দুই দল কোয়ার্টার ফাইনালে উঠবে। ফাইনাল খেলা অনুষ্ঠিত হবে ২১ মার্চ ২০২৭ তারিখ বিকেলে। প্রতিটি দলে সাতজন খেলোয়াড় মাঠে খেলবেন এবং পাঁচজন অতিরিক্ত খেলোয়াড় রাখা যাবে।

    খেলোয়াড়দের অবশ্যই চরকাঁকড়া ইউনিয়নের স্থায়ী বাসিন্দা হতে হবে এবং বয়স ১৮ বছরের বেশি হতে হবে। চ্যাম্পিয়ন দল পাবে একটি ষাঁড় ও ট্রফি, রানার্সআপ দল পাবে একটি খাসি ও ট্রফি। প্রতিযোগিতার সেরা খেলোয়াড়কে একটি বাইসাইকেল উপহার দেওয়া হবে।

    খেলার দিন দর্শকদের মাঠের চারপাশে বাঁশ দিয়ে ঘেরা সীমানার বাইরে থাকতে হবে। মাঠে কোনো ধরনের বিশৃঙ্খলা সৃষ্টি করলে সংশ্লিষ্ট দলকে প্রতিযোগিতা থেকে বাদ দেওয়া হবে। খেলাগুলো পরিচালনা করবেন অভিজ্ঞ বিচারকমণ্ডলী এবং তাঁদের সিদ্ধান্তই চূড়ান্ত। প্রতিদিনের খেলার সূচি ক্লাবের নোটিশ বোর্ডে ও বাজারের মোড়ে মাইকিং করে জানানো হবে।

