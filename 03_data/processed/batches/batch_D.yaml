    রাত ১১টার পর মূল ফটক বন্ধ থাকবে; এরপর প্রবেশের জন্য নিরাপত্তাকর্মীকে পরিচয় দিতে হবে। বাইরের অতিথি ও গৃহকর্মীদের নাম অভ্যর্থনা খাতায় লিপিবদ্ধ করতে হবে। সমিতির পূর্বানুমতি ছাড়া ছাদে কোনো ধরনের সামাজিক বা পারিবারিক অনুষ্ঠান আয়োজন করা যাবে না। সিঁড়ি ও করিডোরে জুতা, সাইকেল বা অন্য কোনো মালামাল রাখা যাবে না। ময়লা নির্দিষ্ট পাত্রে ফেলতে হবে এবং প্রতিদিন সকাল ৮টার মধ্যে দরজার বাইরে রাখতে হবে।

    এছাড়া পুরোনো জেনারেটরটি ঘন ঘন বিকল হওয়ায় নতুন জেনারেটর কেনার সিদ্ধান্ত নেওয়া হয়েছে। এ বাবদ প্রত্যেক ফ্ল্যাট মালিককে এককালীন ১২,৫০০ টাকা প্রদান করতে হবে, যা দুই কিস্তিতে পরিশোধ করা যাবে। প্রথম কিস্তি জমার শেষ তারিখ ১৫ এপ্রিল ২০২৭। লিফট রক্ষণাবেক্ষণের জন্য প্রতি মাসের প্রথম রবিবার সকাল ১০টা থেকে দুপুর ১২টা পর্যন্ত লিফট বন্ধ থাকবে। যেকোনো অভিযোগ বা পরামর্শ সমিতির অফিসে লিখিতভাবে জমা দেওয়ার অনুরোধ করা হলো।

