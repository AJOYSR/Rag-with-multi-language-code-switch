    পাঠাভ্যাস গড়ে তোলা ও সামাজিক কাজে তরুণদের যুক্ত করার লক্ষ্যে গাংচিল পাঠাগার ও সমাজকল্যাণ সংঘ নতুন সদস্য সংগ্রহ অভিযান শুরু করেছে। পাঠাগারে বর্তমানে মোট বইয়ের সংখ্যা ৪,২০০, যার মধ্যে গল্প-উপন্যাস, কবিতা, ইতিহাস, বিজ্ঞান, শিশুসাহিত্য ও বিভিন্ন প্রতিযোগিতামূলক পরীক্ষার প্রস্তুতির বই উল্লেখযোগ্য। এছাড়া প্রতিদিন তিনটি জাতীয় ও একটি স্থানীয় দৈনিক পত্রিকা রাখা হয়।

    সদস্যপদের জন্য নির্ধারিত ফরম পূরণ করে দুই কপি ছবি ও জাতীয় পরিচয়পত্র বা জন্মনিবন্ধনের ফটোকপি জমা দিতে হবে। প্রাপ্তবয়স্ক সদস্যদের বার্ষিক সদস্য ফি ৩৬০ টাকা। স্কুল ও কলেজের শিক্ষার্থীদের জন্য বার্ষিক ফি ১২০ টাকা। সদস্যরা একসঙ্গে সর্বোচ্চ দুটি বই চৌদ্দ দিনের জন্য বাড়িতে নিতে পারবেন। নির্ধারিত সময়ের মধ্যে বই ফেরত না দিলে প্রতিদিনের জন্য সামান্য জরিমানা দিতে হবে।

    পাঠাগার শনিবার থেকে বৃহস্পতিবার বিকেল ৩টা থেকে রাত ৮টা পর্যন্ত খোলা থাকে। সংঘের উদ্যোগে প্রতি মাসে একটি পাঠচক্র, বছরে একবার বইমেলা এবং শীতকালে দরিদ্রদের মধ্যে শীতবস্ত্র বিতরণ কর্মসূচি পরিচালিত হয়। আগ্রহী সদস্যরা স্বেচ্ছাসেবক হিসেবে এসব কর্মসূচিতে অংশ নিতে পারবেন। পাঠাগারের ভেতরে উচ্চস্বরে কথা বলা ও মোবাইল ফোনে কথা বলা নিষেধ। বই দান করতে আগ্রহী শুভানুধ্যায়ীদের পাঠাগারের দায়িত্বপ্রাপ্ত গ্রন্থাগারিকের সঙ্গে যোগাযোগ করার অনুরোধ করা হলো।

