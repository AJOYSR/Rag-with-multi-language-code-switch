    নদীর পাড় ও পানি প্লাস্টিক বর্জ্যমুক্ত রাখার লক্ষ্যে নলখাগড়া নদী রক্ষা ক্লাব আগামী ২০ নভেম্বর ২০২৭ তারিখে দিনব্যাপী নদী পরিচ্ছন্নতা অভিযানের আয়োজন করেছে। অভিযান শুরু হবে সকাল ৭টায় খেয়াঘাট থেকে এবং পুরোনো লোহার সেতু পর্যন্ত প্রায় তিন কিলোমিটার এলাকা পরিষ্কার করা হবে।

    এই অভিযানে মোট ৮৫ জন স্বেচ্ছাসেবক অংশ নেবেন। স্বেচ্ছাসেবকদের কয়েকটি দলে ভাগ করে নদীর দুই পাড়ে পাঠানো হবে। একটি দল নৌকায় করে পানিতে ভাসমান বোতল, পলিথিন ও অন্যান্য বর্জ্য সংগ্রহ করবে। সংগৃহীত বর্জ্য আলাদা বস্তায় ভরে পৌরসভার নির্ধারিত স্থানে পৌঁছে দেওয়া হবে, এবং পুনর্ব্যবহারযোগ্য প্লাস্টিক স্থানীয় ভাঙারি ব্যবসায়ীদের কাছে বিক্রি করে সেই অর্থ ক্লাবের পরিবেশ তহবিলে জমা রাখা হবে।

    স্বেচ্ছাসেবকদের জন্য হাতমোজা, মাস্ক ও টুপি ক্লাবের পক্ষ থেকে সরবরাহ করা হবে। প্রত্যেককে নিজের পানির বোতল সঙ্গে আনতে বলা হচ্ছে। সাঁতার না জানলে কাউকে নৌকার দলে রাখা হবে না। দুপুরে খেয়াঘাট সংলগ্ন মাঠে সবার জন্য খাবারের ব্যবস্থা থাকবে। অভিযান শেষে বিকেলে নদী দূষণ রোধে করণীয় বিষয়ে একটি সংক্ষিপ্ত আলোচনা সভা অনুষ্ঠিত হবে, যেখানে এলাকার জেলে ও নৌকার মাঝিরা তাঁদের অভিজ্ঞতা তুলে ধরবেন। আগ্রহীরা ক্লাবের কার্যালয়ে নাম নিবন্ধন করতে পারবেন।

