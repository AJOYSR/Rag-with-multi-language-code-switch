    পুরান শহরের ঐতিহ্যবাহী ঘুড়ি ওড়ানোর সংস্কৃতিকে ধরে রাখতে আকাশমণি সাংস্কৃতিক জোটের আয়োজনে অনুষ্ঠিত হবে আকাশমণি ঘুড়ি উৎসব। উৎসব অনুষ্ঠিত হবে ১৬ জানুয়ারি ২০২৭ তারিখে, নদীতীরের বড় খেলার মাঠে, দুপুর ১২টা থেকে সূর্যাস্ত পর্যন্ত। সন্ধ্যায় মাঠে ফানুস ওড়ানোর পরিবর্তে পরিবেশবান্ধব আলোকসজ্জা ও লোকসংগীতের আয়োজন থাকবে।

    উৎসবে তিনটি বিভাগে প্রতিযোগিতা হবে: সবচেয়ে বড় ঘুড়ি, সবচেয়ে সুন্দর নকশার ঘুড়ি এবং ঘুড়ির কাটাকাটি বা প্যাঁচ খেলা। প্রতিযোগিতায় অংশ নিতে প্রতিটি বিভাগে নিবন্ধন ফি ১০০ টাকা। নিবন্ধন করা যাবে জোটের কার্যালয়ে অথবা উৎসবের দিন সকাল ১০টা পর্যন্ত মাঠে স্থাপিত নিবন্ধন বুথে।

    প্যাঁচ খেলায় কাচের গুঁড়া মেশানো মাঞ্জা সুতা ও নাইলনের সুতা ব্যবহার সম্পূর্ণ নিষিদ্ধ, কারণ এটি পাখি ও পথচারীদের জন্য বিপজ্জনক। শিশুদের ঘুড়ি ওড়ানোর জন্য মাঠের একটি অংশ আলাদা করে রাখা হবে এবং সেখানে অভিভাবকদের উপস্থিত থাকতে হবে। মাঠে বিভিন্ন স্টলে রঙিন ঘুড়ি, নাটাই ও সুতা কিনতে পাওয়া যাবে। এছাড়া ঐতিহ্যবাহী খাবারের স্টলও থাকবে।

    প্রতিটি বিভাগের বিজয়ীদের ক্রেস্ট ও সনদপত্র দেওয়া হবে। বিদ্যুতের তারের কাছাকাছি ঘুড়ি না ওড়ানো এবং ছাদের কিনারায় না দাঁড়ানোর জন্য সবাইকে বিশেষভাবে সতর্ক করা হচ্ছে।

