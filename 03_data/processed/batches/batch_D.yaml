    মাহফিলে অংশগ্রহণকারীদের সুবিধার্থে নিচের বিষয়গুলো লক্ষ রাখার অনুরোধ করা হলো। মসজিদের মূল ভবনের পাশাপাশি পূর্ব দিকের খোলা মাঠে প্যান্ডেল তৈরি করা হবে এবং সেখানে বসার জন্য চাটাই বিছানো থাকবে। নারীদের জন্য উত্তর পাশে আলাদা পর্দাঘেরা বসার স্থান থাকবে। মাহফিল চলাকালীন মসজিদ প্রাঙ্গণে কোনো ধরনের গাড়ি পার্ক করা যাবে না। অজুর জন্য অতিরিক্ত পানির ট্যাংক ও কল বসানো হবে। শিশুদের সঙ্গে আনলে অভিভাবকদের নিজ দায়িত্বে তাদের দেখাশোনা করতে হবে।

    মাহফিলের ব্যয় নির্বাহের জন্য এলাকাবাসীর কাছ থেকে স্বেচ্ছায় অনুদান গ্রহণ করা হচ্ছে। অনুদান কমিটির কোষাধ্যক্ষের কাছে রসিদের মাধ্যমে জমা দেওয়া যাবে। মাহফিল শেষে উপস্থিত সকলের মধ্যে তবারক বিতরণ করা হবে। শৃঙ্খলা রক্ষার জন্য কমিটির স্বেচ্ছাসেবকরা লাল ব্যাজ পরে দায়িত্ব পালন করবেন; যেকোনো প্রয়োজনে তাঁদের সহযোগিতা নেওয়ার অনুরোধ রইল। উচ্চ শব্দের আতশবাজি বা পটকা ফোটানো সম্পূর্ণ নিষেধ।

