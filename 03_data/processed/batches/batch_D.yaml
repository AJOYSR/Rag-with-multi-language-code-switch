    ফসলে রাসায়নিক কীটনাশকের ব্যবহার কমিয়ে নিরাপদ খাদ্য উৎপাদনে কৃষকদের উৎসাহিত করতে শালিখডাঙা কৃষক মাঠ স্কুল একটি দিনব্যাপী হাতে-কলমে কর্মশালার আয়োজন করেছে। কর্মশালা অনুষ্ঠিত হবে ১৭ আগস্ট ২০২৭ তারিখে, মাঠ স্কুলের প্রদর্শনী খামারে, সকাল ৯টা থেকে বিকেল ৪টা পর্যন্ত।

    কর্মশালায় নিম পাতা, তামাক পাতা, রসুন ও মরিচ দিয়ে ঘরোয়া পদ্ধতিতে জৈব বালাইনাশক তৈরি, ফেরোমন ফাঁদ ব্যবহার, আলোক ফাঁদ স্থাপন এবং উপকারী পোকা চেনার কৌশল শেখানো হবে। এছাড়া কেঁচো সার তৈরির একটি প্রদর্শনী থাকবে। কর্মশালায় সর্বোচ্চ ৪৫ জন কৃষক অংশ নিতে পারবেন। নারী কৃষক ও তরুণ উদ্যোক্তাদের অংশগ্রহণে বিশেষভাবে উৎসাহিত করা হচ্ছে।

    অংশগ্রহণের জন্য কোনো ফি দিতে হবে না। অংশগ্রহণকারীদের দুপুরের খাবার ও হাতে-কলমে শেখার উপকরণ মাঠ স্কুলের পক্ষ থেকে দেওয়া হবে। কর্মশালা শেষে প্রত্যেককে একটি করে ফেরোমন ফাঁদ ও জৈব বালাইনাশক তৈরির সহজ নির্দেশিকা পুস্তিকা দেওয়া হবে। আগ্রহী কৃষকদের ১০ আগস্ট ২০২৭ তারিখের মধ্যে মাঠ স্কুলের সহায়কের কাছে নাম নিবন্ধন করতে হবে। নিবন্ধন আগে এলে আগে পাবেন ভিত্তিতে গ্রহণ করা হবে। কর্মশালার দিন মাঠে কাজ করার উপযোগী পোশাক পরে আসার অনুরোধ করা হলো। বৃষ্টি হলে কর্মশালার তাত্ত্বিক অংশ মাঠ স্কুলের ঘরে অনুষ্ঠিত হবে।

