    প্রতিটি দলের প্রবেশ ফি ৩,২০০ টাকা। প্রবেশ ফি দিয়ে বল, আম্পায়ার ও মাঠ প্রস্তুতির খরচ মেটানো হবে। চ্যাম্পিয়ন দল পাবে ট্রফি ও নগদ ২০,০০০ টাকা এবং রানার্সআপ দল পাবে ট্রফি ও নগদ ১০,০০০ টাকা। প্রতিটি খেলার সেরা খেলোয়াড়কে একটি করে স্মারক দেওয়া হবে।

    প্রতিটি দল সর্বোচ্চ ১৪ জন খেলোয়াড়ের নাম জমা দিতে পারবে এবং খেলোয়াড়দের অবশ্যই সংশ্লিষ্ট পাড়ার স্থায়ী বাসিন্দা হতে হবে। বাইরের কোনো খেলোয়াড় খেলানো প্রমাণিত হলে ওই দলকে টুর্নামেন্ট থেকে বাদ দেওয়া হবে। খেলোয়াড়দের নিজ নিজ দলের রঙের জার্সি পরে মাঠে নামতে হবে। খেলা চলাকালীন মাঠে অশোভন আচরণ করলে খেলোয়াড়কে পরবর্তী খেলায় নিষিদ্ধ করা হবে। দল নিবন্ধনের শেষ তারিখ ১৮ ডিসেম্বর ২০২৭। নিবন্ধনের সময় দলের অধিনায়ককে খেলোয়াড়দের তালিকা ও ছবি জমা দিতে হবে। খেলার সূচি লটারির মাধ্যমে নির্ধারণ করে ক্লাবের নোটিশ বোর্ডে প্রকাশ করা হবে।

