    সম্প্রতি পার্শ্ববর্তী এলাকায় গ্যাস লিকেজ থেকে অগ্নিকাণ্ডের ঘটনার পরিপ্রেক্ষিতে পারুলবীথি আবাসিক এলাকা বাসিন্দা সমিতি এলাকার সকল বাড়ির গ্যাস লাইন ও চুলার নিরাপত্তা পরিদর্শনের উদ্যোগ নিয়েছে। পরিদর্শন করবে সমিতি নিয়োজিত একটি অভিজ্ঞ কারিগরি দল। পরিদর্শন অনুষ্ঠিত হবে ৯ অক্টোবর ২০২৭ তারিখে, সকাল ৯টা থেকে সন্ধ্যা পর্যন্ত।

    পরিদর্শনের সময় কারিগরি দল প্রতিটি বাড়ির রাইজার, পাইপের সংযোগস্থল, রেগুলেটর ও চুলার অবস্থা পরীক্ষা করবে। কোনো লিকেজ বা ত্রুটি পাওয়া গেলে তাৎক্ষণিকভাবে বাড়ির মালিককে লিখিতভাবে জানানো হবে। ছোটখাটো ত্রুটিপূর্ণ চুলা মেরামতে প্রতি চুলা ৪৫০ টাকা খরচ পড়বে, যা বাড়ির মালিক বা ভাড়াটিয়াকে পরিশোধ করতে হবে। বড় ধরনের ত্রুটির ক্ষেত্রে গ্যাস বিতরণ কর্তৃপক্ষের অনুমোদিত ঠিকাদারের মাধ্যমে মেরামত করতে হবে।

    পরিদর্শনের দিন প্রত্যেক বাড়িতে অন্তত একজন প্রাপ্তবয়স্ক সদস্যকে উপস্থিত থাকার অনুরোধ করা হলো। পরিদর্শন চলাকালীন কিছু সময়ের জন্য সংশ্লিষ্ট বাড়ির গ্যাস সরবরাহ বন্ধ রাখা হতে পারে। পরিদর্শন দলের সদস্যরা সমিতির পরিচয়পত্র বহন করবেন; পরিচয়পত্র ছাড়া কাউকে বাড়িতে প্রবেশ করতে দেবেন না। এছাড়া রান্নাঘরে বাতাস চলাচলের ব্যবস্থা রাখা ও চুলা জ্বালানো অবস্থায় রান্নাঘর ছেড়ে না যাওয়ার পরামর্শ দেওয়া হচ্ছে।

