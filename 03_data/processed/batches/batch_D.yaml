    সমন্বিত সবজি, ফল ও দুগ্ধ উৎপাদনকারী প্রতিষ্ঠান বাবুইবাসা কৃষি খামার তাদের প্রায় ৩০ একরের খামার তদারকির জন্য একজন খামার সুপারভাইজার নিয়োগ দেবে। নির্বাচিত প্রার্থীকে দৈনিক শ্রমিক ব্যবস্থাপনা, সেচ ও সার প্রয়োগের সময়সূচি নির্ধারণ, দুগ্ধ খামারের দৈনিক উৎপাদনের হিসাব রাখা এবং উৎপাদিত পণ্য বাজারে পাঠানোর তদারকি করতে হবে।

    প্রার্থীর কৃষি ডিপ্লোমা বা কৃষি বিষয়ে স্নাতক ডিগ্রি থাকতে হবে। মোটরসাইকেল চালাতে জানা আবশ্যক এবং খামারে অবস্থান করে কাজ করার মানসিকতা থাকতে হবে। খামারের ভেতরেই থাকার জন্য একটি আলাদা কক্ষ ও তিন বেলা খাবারের ব্যবস্থা থাকবে।

    মাসিক বেতন ২২,০০০ টাকা, সঙ্গে উৎপাদন লক্ষ্য পূরণ হলে ত্রৈমাসিক প্রণোদনা দেওয়া হবে। প্রথম ছয় মাস সন্তোষজনক কাজের পর চাকরি স্থায়ী করা হবে এবং বছরে দুটি উৎসব ভাতা দেওয়া হবে। মাসে চার দিন ছুটি পাওয়া যাবে, যা খামারের কাজের চাপ বুঝে নির্ধারণ করা হবে।

    আগ্রহী প্রার্থীদের জীবনবৃত্তান্ত, সনদের ফটোকপি ও দুই কপি ছবিসহ আবেদনপত্র পাঠাতে হবে। আবেদনপত্র পাঠাতে হবে খামারের ব্যবস্থাপক সাইফুল ইসলাম তালুকদারের কাছে। আবেদনপত্রের খামের ওপর পদের নাম স্পষ্ট করে লিখতে হবে। আবেদনের শেষ তারিখ ১৫ মে ২০২৭। শুধুমাত্র বাছাইকৃত প্রার্থীদের সাক্ষাৎকারের জন্য ডাকা হবে এবং সাক্ষাৎকারের দিন খামার ঘুরিয়ে দেখানো হবে।

