    বর্ষা মৌসুম উপলক্ষে পলাশবাড়িয়া সবুজ বন্ধু সংঘ এলাকাজুড়ে বৃক্ষরোপণ কর্মসূচির আয়োজন করেছে। কর্মসূচি অনুষ্ঠিত হবে ৫ জুলাই ২০২৭ তারিখে, সকাল ৮টা থেকে দুপুর ১টা পর্যন্ত। প্রথম পর্বে গ্রামের প্রধান সড়কের দুই পাশে এবং দ্বিতীয় পর্বে প্রাথমিক বিদ্যালয় ও কবরস্থানের সীমানায় চারা রোপণ করা হবে।

    এবারের কর্মসূচিতে আম, জাম, কাঁঠাল, নিম ও অর্জুনসহ বিভিন্ন প্রজাতির চারা রোপণ করা হবে। কর্মসূচিতে অংশগ্রহণকারী প্রত্যেক পরিবারকে বাড়ির আঙিনায় লাগানোর জন্য বিনামূল্যে দুটি করে ফলদ গাছের চারা দেওয়া হবে। রোপণের পর চারাগুলোর চারপাশে বাঁশের খাঁচা দেওয়া হবে, যাতে গবাদিপশু ক্ষতি করতে না পারে। সংঘের সদস্যরা পরবর্তী ছয় মাস নিয়মিত পানি দেওয়া ও পরিচর্যার দায়িত্ব পালন করবেন।

    আগ্রহী পরিবার ও স্বেচ্ছাসেবকদের ২৫ জুন ২০২৭ তারিখের মধ্যে সংঘের কার্যালয়ে নাম নিবন্ধন করতে হবে। স্বেচ্ছাসেবকদের নিজ নিজ কোদাল বা খুন্তি সঙ্গে আনার অনুরোধ করা হলো। অংশগ্রহণকারীদের জন্য দুপুরে হালকা নাশতার ব্যবস্থা থাকবে। বৃষ্টি হলেও কর্মসূচি নির্ধারিত সময়েই চলবে, তবে প্রবল দুর্যোগ দেখা দিলে নতুন সময়সূচি জানিয়ে দেওয়া হবে। পরিবেশ রক্ষার এই উদ্যোগে এলাকার সকলের অংশগ্রহণ কামনা করা হচ্ছে।

