    ডিজেল খরচ কমিয়ে বোরো মৌসুমে সাশ্রয়ী সেচ নিশ্চিত করতে সরিষাফুল সেচ পাম্প ব্যবহারকারী সমিতি তার সদস্যদের জন্য সৌরচালিত সেচ পাম্প স্থাপনে ভর্তুকি কর্মসূচি চালু করেছে। এ বছর সমিতি মোট ৩৬টি সৌরচালিত পাম্প স্থাপনে সহায়তা দেবে। প্রতিটি পাম্পের মোট খরচের ৬০ শতাংশ সমিতির উন্নয়ন তহবিল থেকে বহন করা হবে এবং বাকি অর্থ কৃষক বা কৃষক দলকে কিস্তিতে পরিশোধ করতে হবে।

    আবেদনের যোগ্যতা: আবেদনকারীকে অন্তত দুই বছর ধরে সমিতির সদস্য হতে হবে এবং পাম্পের আওতায় কমপক্ষে পাঁচ একর আবাদি জমি থাকতে হবে। কয়েকজন কৃষক মিলে দলগতভাবেও আবেদন করা যাবে। যাঁদের জমিতে ইতিমধ্যে বিদ্যুৎচালিত পাম্প রয়েছে, তাঁরা এই কর্মসূচির জন্য বিবেচিত হবেন না।

    আবেদন ফরম সমিতির কার্যালয় থেকে বিনামূল্যে সংগ্রহ করা যাবে। পূরণকৃত ফরমের সঙ্গে জমির দলিল বা খতিয়ানের ফটোকপি, জাতীয় পরিচয়পত্র এবং সমিতির সদস্য কার্ডের ফটোকপি জমা দিতে হবে। আবেদন জমা দেওয়ার শেষ তারিখ ২৬ জানুয়ারি ২০২৭। প্রাপ্ত আবেদন যাচাই-বাছাইয়ের পর একটি কমিটি সরেজমিনে জমি পরিদর্শন করবে। চূড়ান্ত তালিকা সমিতির নোটিশ বোর্ডে প্রকাশ করা হবে। নির্বাচিত কৃষকদের পাম্প পরিচালনা ও রক্ষণাবেক্ষণ বিষয়ে এক দিনের প্রশিক্ষণ দেওয়া হবে।

