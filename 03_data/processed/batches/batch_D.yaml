    নির্মাণসামগ্রী ও হার্ডওয়্যার পণ্যের পাইকারি সরবরাহকারী প্রতিষ্ঠান ঝিনুকমালা ট্রেডার্স তাদের গুদামের জন্য একজন স্টোর কিপার নিয়োগ দেবে। নির্বাচিত প্রার্থীকে গুদামে পণ্য গ্রহণ ও সরবরাহের হিসাব রাখা, মজুদ পণ্যের নিয়মিত তালিকা তৈরি এবং মাস শেষে মজুদ প্রতিবেদন জমা দেওয়ার দায়িত্ব পালন করতে হবে।

    শিক্ষাগত যোগ্যতা: ন্যূনতম স্নাতক পাস; বাণিজ্য বিভাগের প্রার্থীদের অগ্রাধিকার দেওয়া হবে। এই পদে আবেদনের জন্য সংশ্লিষ্ট কাজে কমপক্ষে দুই বছরের অভিজ্ঞতা আবশ্যক। কম্পিউটারে হিসাবের সফটওয়্যার ও স্প্রেডশিট ব্যবহারে দক্ষতা থাকতে হবে। প্রার্থীর বয়স ২৫ থেকে ৩৫ বছরের মধ্যে হতে হবে এবং গুদামের কাছাকাছি এলাকায় বসবাসকারীদের অগ্রাধিকার দেওয়া হবে।

    মাসিক বেতন ১৫,০০০ থেকে ১৮,০০০ টাকা, যোগ্যতা অনুযায়ী নির্ধারণ করা হবে। এছাড়া দুপুরের খাবার, বছরে দুটি উৎসব ভাতা ও মোবাইল বিল দেওয়া হবে। কর্মঘণ্টা সকাল ৮টা থেকে সন্ধ্যা ৬টা, সপ্তাহে একদিন ছুটি। নিয়োগের প্রথম তিন মাস শিক্ষানবিশকাল হিসেবে গণ্য হবে।

    আগ্রহী প্রার্থীদের জীবনবৃত্তান্ত, সদ্য তোলা ছবি ও সকল সনদের ফটোকপি প্রতিষ্ঠানের প্রধান কার্যালয়ে সরাসরি জমা দিতে হবে। আবেদন জমার শেষ তারিখ ৭ ফেব্রুয়ারি ২০২৭। বাছাইকৃত প্রার্থীদের লিখিত ও মৌখিক পরীক্ষার তারিখ পরে জানিয়ে দেওয়া হবে।

