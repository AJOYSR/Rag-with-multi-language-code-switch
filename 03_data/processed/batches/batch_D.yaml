    শাপলাচর ক্রীড়া সংঘের আয়োজনে শাপলাচর যুব ফুটবল টুর্নামেন্ট ২০২৭ আগামী মাসে ইউনিয়ন পরিষদ মাঠে শুরু হতে যাচ্ছে। ইউনিয়নের বিভিন্ন গ্রাম ও পাড়ার অনূর্ধ্ব-২১ খেলোয়াড়দের নিয়ে গঠিত দল এই টুর্নামেন্টে অংশ নিতে পারবে। প্রতিটি দলে সর্বোচ্চ ১৮ জন খেলোয়াড় নিবন্ধন করা যাবে। দল নিবন্ধন ফি ১,২০০ টাকা, যা নিবন্ধনের সময় নগদে জমা দিতে হবে। নিবন্ধনের শেষ তারিখ ২৮ ফেব্রুয়ারি ২০২৭।

    খেলাগুলো নকআউট পদ্ধতিতে অনুষ্ঠিত হবে এবং প্রতিটি ম্যাচ ৭০ মিনিটের হবে। টুর্নামেন্টের প্রধান রেফারির দায়িত্ব পালন করবেন জেলা রেফারি সমিতির সদস্য ইমতিয়াজ শাহরিয়ার। প্রতিটি ম্যাচে দুজন সহকারী রেফারি থাকবেন। খেলোয়াড়দের জাতীয় পরিচয়পত্র অথবা জন্মনিবন্ধন সনদের ফটোকপি নিবন্ধনের সময় জমা দিতে হবে।

    চ্যাম্পিয়ন দল ট্রফি ও নগদ অর্থ পুরস্কার পাবে, রানার্সআপ দলও ট্রফি পাবে। এছাড়া টুর্নামেন্টের সেরা খেলোয়াড় ও সর্বোচ্চ গোলদাতাকে বিশেষ পুরস্কার দেওয়া হবে। মাঠে দর্শকদের শৃঙ্খলা বজায় রাখার জন্য স্বেচ্ছাসেবকরা দায়িত্বে থাকবেন। কোনো দল নির্ধারিত সময়ের পর ১৫ মিনিটের মধ্যে মাঠে উপস্থিত না হলে প্রতিপক্ষকে জয়ী ঘোষণা করা হবে। নিবন্ধন ফরম ক্রীড়া সংঘের কার্যালয়ে প্রতিদিন বিকেলে পাওয়া যাচ্ছে।

