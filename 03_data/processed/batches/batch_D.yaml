    সভার আলোচ্যসূচি: (ক) বিগত বছরের আয়-ব্যয়ের হিসাব অনুমোদন; (খ) মাসিক রক্ষণাবেক্ষণ চাঁদা পুনর্বিবেচনা; (গ) পুরোনো লিফট পরিবর্তনের প্রস্তাব; (ঘ) নিরাপত্তাকর্মীর সংখ্যা বৃদ্ধি; (ঙ) নতুন কার্যনির্বাহী কমিটি নির্বাচন; এবং (চ) বিবিধ।

    উল্লেখ্য, বর্তমানে ফ্ল্যাটপ্রতি মাসিক রক্ষণাবেক্ষণ চাঁদা ৩,৫০০ টাকা। বিদ্যুৎ ও পানির খরচ বৃদ্ধির কারণে কমিটি এই চাঁদা বাড়ানোর প্রস্তাব করেছে। বর্তমান কার্যনির্বাহী কমিটির মেয়াদ ৩১ মার্চ ২০২৭ তারিখে শেষ হবে। যেসব সদস্যের চাঁদা বকেয়া আছে, তাঁদের ১০ মার্চ ২০২৭ তারিখের মধ্যে বকেয়া পরিশোধ করার অনুরোধ করা হলো, অন্যথায় তাঁরা নির্বাচনে ভোট দিতে পারবেন না। নির্বাচনে প্রার্থী হতে ইচ্ছুক সদস্যদের সমিতির অফিসে লিখিতভাবে নাম জমা দিতে হবে। সভায় সকল সদস্যের উপস্থিতি একান্তভাবে কাম্য।

