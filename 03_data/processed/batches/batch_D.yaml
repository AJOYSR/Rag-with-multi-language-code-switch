    কদমবেলা মন্দিরের প্রতিষ্ঠার পঞ্চাশ বছর পূর্তি উপলক্ষে কদমবেলা মন্দির পরিচালনা কমিটি তিন দিনব্যাপী প্রতিষ্ঠাবার্ষিকী উৎসবের আয়োজন করেছে। উৎসব শুরু হবে ২৩ ফেব্রুয়ারি ২০২৭ তারিখে এবং চলবে টানা তিন দিন। উৎসবের প্রতিদিন সকালে পূজা-অর্চনা এবং সন্ধ্যায় কীর্তন ও ভক্তিমূলক গানের অনুষ্ঠান থাকবে।

    উৎসব উপলক্ষে মন্দির প্রাঙ্গণ আলোকসজ্জায় সাজানো হবে। উৎসবের দ্বিতীয় দিন মন্দির প্রাঙ্গণে বিনামূল্যে স্বাস্থ্য পরীক্ষা ক্যাম্পের আয়োজন করা হবে। প্রতিদিন দুপুরে আগত ভক্ত ও দর্শনার্থীদের মধ্যে প্রসাদ বিতরণ করা হবে। প্রসাদ বিতরণের সময় শৃঙ্খলা রক্ষায় নারী ও পুরুষদের জন্য আলাদা সারি থাকবে।

    দর্শনার্থীদের সুবিধার্থে মন্দিরের পশ্চিম পাশের খালি জায়গায় অস্থায়ী জুতা রাখার স্থান ও পানীয় জলের ব্যবস্থা থাকবে। উৎসব চলাকালীন মন্দিরের মূল কক্ষে ছবি তোলা নিরুৎসাহিত করা হচ্ছে। শিশুদের সঙ্গে আনলে অভিভাবকদের সতর্ক থাকার অনুরোধ করা হলো। শৃঙ্খলা রক্ষায় কমিটির স্বেচ্ছাসেবকরা কমলা রঙের ব্যাজ পরে দায়িত্ব পালন করবেন।

    উৎসবের ব্যয় নির্বাহে ভক্তদের স্বেচ্ছায় দান গ্রহণ করা হচ্ছে; দান কমিটির কোষাধ্যক্ষের কাছে রসিদের মাধ্যমে জমা দেওয়া যাবে। এলাকার সকল ধর্মের মানুষকে উৎসবের সাংস্কৃতিক অনুষ্ঠানে আমন্ত্রণ জানানো হচ্ছে। উচ্চ শব্দের পটকা ও আতশবাজি ব্যবহার সম্পূর্ণ নিষিদ্ধ।

