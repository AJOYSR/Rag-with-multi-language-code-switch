    পরিবেশ সচেতনতা বাড়াতে বনটিয়া পরিবেশ ক্লাব আগামী ২ জুলাই ২০২৭ তারিখে উপজেলা পরিষদ চত্বরে দিনব্যাপী বৃক্ষমেলা ও চারা বিনিময় উৎসবের আয়োজন করেছে। মেলায় স্থানীয় নার্সারি ও শৌখিন বাগানিদের স্টলে প্রায় ১২০ প্রজাতির ফলদ, বনজ, ঔষধি ও ফুলের গাছের চারা প্রদর্শন ও বিক্রি করা হবে।

    মেলার বিশেষ আকর্ষণ চারা বিনিময় কর্নার, যেখানে দর্শনার্থীরা নিজের বাড়ির টবের একটি চারা এনে অন্য একটি চারার সঙ্গে বিনিময় করতে পারবেন। এছাড়া ছাদবাগান, কম্পোস্ট সার তৈরি ও বীজ সংরক্ষণ বিষয়ে বিশেষজ্ঞদের সংক্ষিপ্ত আলোচনা থাকবে। শিক্ষার্থীদের জন্য পরিবেশ বিষয়ক কুইজ প্রতিযোগিতা অনুষ্ঠিত হবে এবং বিজয়ীদের পুরস্কার হিসেবে চারা দেওয়া হবে।

    মেলায় স্টল দিতে আগ্রহী নার্সারি মালিকদের ২০ জুন ২০২৭ তারিখের মধ্যে নিবন্ধন করতে হবে। নিবন্ধনের জন্য যোগাযোগ করতে হবে ক্লাবের সাধারণ সম্পাদক রুমানা পারভীনের সঙ্গে। স্টল বরাদ্দ আগে নিবন্ধনকারীদের অগ্রাধিকার ভিত্তিতে করা হবে। প্রতিটি স্টলে একটি টেবিল ও দুটি চেয়ার ক্লাবের পক্ষ থেকে দেওয়া হবে।

    মেলা প্রাঙ্গণে প্লাস্টিকের ব্যাগ ও একবার ব্যবহারযোগ্য প্লাস্টিক পণ্য সম্পূর্ণ নিষিদ্ধ থাকবে। দর্শনার্থীদের কাপড় বা পাটের ব্যাগ সঙ্গে আনার অনুরোধ করা হলো। মেলা সকাল ৯টা থেকে সন্ধ্যা ৬টা পর্যন্ত সবার জন্য উন্মুক্ত থাকবে।

