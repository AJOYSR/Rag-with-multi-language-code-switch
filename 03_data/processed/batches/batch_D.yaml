    বেকার তরুণ-তরুণীদের কর্মসংস্থানের উপযোগী করে গড়ে তুলতে শিমুলতুলা দক্ষতা উন্নয়ন কেন্দ্র তিন মাস মেয়াদি কম্পিউটার অফিস অ্যাপ্লিকেশন কোর্সের নতুন ব্যাচে ভর্তির আবেদন আহ্বান করছে। ক্লাস শুরু হবে ২ আগস্ট ২০২৭ তারিখে। সপ্তাহে পাঁচ দিন, প্রতিদিন দুই ঘণ্টা করে সকাল ও বিকেল দুই শিফটে ক্লাস নেওয়া হবে।

    কোর্সে কম্পিউটারের মৌলিক ধারণা, বাংলা ও ইংরেজি টাইপিং, ওয়ার্ড প্রসেসিং, স্প্রেডশিট, প্রেজেন্টেশন তৈরি, ইন্টারনেট ব্যবহার, ই-মেইল এবং অনলাইনে সরকারি সেবার আবেদন করার পদ্ধতি শেখানো হবে। নতুন এই ব্যাচে মোট ৩৮টি আসন রয়েছে। প্রত্যেক প্রশিক্ষণার্থীর জন্য আলাদা কম্পিউটারের ব্যবস্থা থাকবে।

    ভর্তির যোগ্যতা ন্যূনতম এসএসসি বা সমমান পাস এবং বয়স ১৬ থেকে ৩৫ বছর। কোর্স ফি ২,৪০০ টাকা, যা দুই কিস্তিতে পরিশোধ করা যাবে। দরিদ্র ও মেধাবী প্রার্থীদের জন্য সীমিত সংখ্যক বৃত্তির ব্যবস্থা রয়েছে; বৃত্তির জন্য আবেদনপত্রের সঙ্গে ইউনিয়ন পরিষদ চেয়ারম্যানের প্রত্যয়নপত্র জমা দিতে হবে। নিয়মিত উপস্থিতি ও চূড়ান্ত মূল্যায়নে উত্তীর্ণ প্রশিক্ষণার্থীদের সনদপত্র দেওয়া হবে।

    কোর্স শেষে সেরা প্রশিক্ষণার্থীদের স্থানীয় প্রতিষ্ঠানে শিক্ষানবিশ হিসেবে কাজের সুযোগ করে দেওয়ার চেষ্টা করা হবে। ভর্তি ফরম কেন্দ্রের অফিস থেকে সংগ্রহ করে দুই কপি ছবি ও সনদের ফটোকপিসহ জমা দিতে হবে। আসন পূর্ণ হয়ে গেলে ভর্তি কার্যক্রম বন্ধ করে দেওয়া হবে।

