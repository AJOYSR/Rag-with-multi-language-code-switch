    কাঁঠালচাঁপা সবুজায়ন উদ্যোগ
    সড়কের দুই পাশে বৃক্ষরোপণ প্রকল্প

    তীব্র গরম ও সড়কের ধুলাবালি কমাতে স্থানীয় তরুণদের সংগঠন কাঁঠালচাঁপা সবুজায়ন উদ্যোগ ইউনিয়নের প্রধান সংযোগ সড়কের দুই পাশে বৃক্ষরোপণ প্রকল্প হাতে নিয়েছে। প্রকল্পের কাজ শুরু হবে ১২ জুলাই ২০২৭ তারিখে এবং বর্ষা মৌসুম শেষ হওয়ার আগেই রোপণের কাজ সম্পন্ন করা হবে।

    প্রকল্পের আওতায় সড়কের প্রায় সাত কিলোমিটার অংশে মোট ১৩৫০টি চারা রোপণ করা হবে। ছায়াদানকারী গাছ হিসেবে মেহগনি, কৃষ্ণচূড়া, জারুল, সোনালু ও বকুলসহ বিভিন্ন প্রজাতির চারা বাছাই করা হয়েছে। চারা রোপণের জন্য ইউনিয়ন পরিষদ ও সড়কের পাশের জমির মালিকদের সম্মতি নেওয়া হয়েছে।

    প্রতিটি চারার চারপাশে বাঁশের খাঁচা ও নামফলক লাগানো হবে। রোপণের পর প্রথম দুই বছর চারাগুলোর পরিচর্যার দায়িত্ব পালন করবে সংগঠনের স্বেচ্ছাসেবক দল। প্রতিটি পাড়া থেকে একজন করে পরিচর্যাকারী নির্ধারণ করা হবে, যিনি নিয়মিত পানি দেওয়া, আগাছা পরিষ্কার এবং মরে যাওয়া চারার জায়গায় নতুন চারা লাগানোর বিষয়টি দেখবেন।

    প্রকল্পের ব্যয় স্থানীয় ব্যবসায়ী, প্রবাসী ও এলাকাবাসীর স্বেচ্ছা অনুদানে নির্বাহ করা হচ্ছে। যেকোনো ব্যক্তি নিজের বা প্রিয়জনের নামে একটি চারার পরিচর্যার খরচ বহন করতে পারবেন। স্বেচ্ছাসেবক হিসেবে যুক্ত হতে আগ্রহীরা সংগঠনের কার্যালয়ে যোগাযোগ করুন। গাছের ক্ষতি না করার জন্য এলাকাবাসী ও গবাদিপশুর মালিকদের সচেতন থাকার অনুরোধ করা হলো।

