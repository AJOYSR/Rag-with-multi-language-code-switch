    ঝাউতলা তরুণ সংঘের উদ্যোগে প্রতি বছরের মতো এবারও ঝাউতলা শীতকালীন ব্যাডমিন্টন প্রতিযোগিতা আয়োজন করা হয়েছে। প্রতিযোগিতা সংঘের নিজস্ব আলোকিত কোর্টে প্রতিদিন সন্ধ্যা ৬টা থেকে রাত ১০টা পর্যন্ত অনুষ্ঠিত হবে। প্রতিযোগিতা শুরু হবে ৮ জানুয়ারি ২০২৭ তারিখে এবং ফাইনাল খেলা অনুষ্ঠিত হবে ২৯ জানুয়ারি ২০২৭ তারিখে।

    এবার পুরুষ দ্বৈত, নারী দ্বৈত ও অনূর্ধ্ব-১৬ একক এই তিনটি বিভাগে খেলা হবে। দ্বৈত বিভাগে প্রতিটি দলের প্রবেশ ফি ৬০০ টাকা এবং অনূর্ধ্ব-১৬ একক বিভাগে প্রবেশ ফি ২৫০ টাকা। প্রতিটি বিভাগের চ্যাম্পিয়ন ও রানার্সআপকে ট্রফি ও সনদপত্র দেওয়া হবে। খেলায় শুধু সংঘ সরবরাহকৃত পালকের শাটলকক ব্যবহার করা যাবে।

    খেলোয়াড়দের নির্ধারিত সময়ের অন্তত ২০ মিনিট আগে কোর্টে উপস্থিত হতে হবে। কোর্টে প্রবেশের সময় অবশ্যই খেলার উপযোগী জুতা পরতে হবে। আম্পায়ারের সিদ্ধান্তই চূড়ান্ত বলে গণ্য হবে। দর্শকদের জন্য প্রবেশ সম্পূর্ণ বিনামূল্যে। দর্শকদের কোর্টের চারপাশে নির্ধারিত সীমানার বাইরে বসতে হবে এবং খেলা চলাকালীন উচ্চস্বরে কথা বলা বা বাঁশি বাজানো থেকে বিরত থাকতে হবে। নিবন্ধন ফরম সংঘের কার্যালয়ে পাওয়া যাচ্ছে; নিবন্ধনের সময় খেলোয়াড়ের ছবি ও বয়সের প্রমাণপত্র জমা দিতে হবে।

