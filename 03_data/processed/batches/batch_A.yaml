    বিশ্ববিদ্যালয় ও মেডিকেল কলেজে প্রথম বর্ষে অধ্যয়নরত অসচ্ছল শিক্ষার্থীদের জন্য ঘৃতকুমারী শিক্ষা ফাউন্ডেশন উচ্চশিক্ষা বৃত্তি ২০২৭-এর আবেদন আহ্বান করছে। নির্বাচিত শিক্ষার্থীরা স্নাতক কোর্স শেষ না হওয়া পর্যন্ত মাসিক বৃত্তি পাবে, তবে প্রতি বছর ফলাফল পর্যালোচনা করে বৃত্তি নবায়ন করা হবে।

    আবেদনপত্র জমার শেষ তারিখ ৩০ জুন ২০২৭। আবেদনের সঙ্গে মাধ্যমিক ও উচ্চ মাধ্যমিক পরীক্ষার নম্বরপত্র, বর্তমান প্রতিষ্ঠানের ভর্তির রসিদ, অভিভাবকের আয়ের প্রমাণপত্র এবং একটি সংক্ষিপ্ত ব্যক্তিগত বিবৃতি জমা দিতে হবে। বিবৃতিতে শিক্ষার্থী তার পারিবারিক অবস্থা ও ভবিষ্যৎ পরিকল্পনা সম্পর্কে লিখবে।

    আবেদনপত্র যাচাই-বাছাইয়ের পর প্রাথমিকভাবে নির্বাচিতদের তালিকা ফাউন্ডেশনের নোটিশ বোর্ডে প্রকাশ করা হবে। বাছাইকৃত আবেদনকারীদের সাক্ষাৎকার নেওয়া হবে ২৮ জুলাই ২০২৭ তারিখে ফাউন্ডেশনের কার্যালয়ে। সাক্ষাৎকারের সময় সকল মূল কাগজপত্র সঙ্গে আনতে হবে এবং একজন অভিভাবককে উপস্থিত থাকতে হবে।

    অন্য কোনো প্রতিষ্ঠান থেকে নিয়মিত বৃত্তি পাচ্ছে এমন শিক্ষার্থীরা আবেদন করতে পারবে না। বৃত্তি পাওয়ার পর শিক্ষার্থীদের প্রতি বছর অন্তত একবার ফাউন্ডেশনের স্বেচ্ছাসেবী কার্যক্রমে অংশ নিতে হবে। ভুল তথ্য দিলে বৃত্তি যেকোনো সময় বাতিল করা হবে এবং প্রদত্ত অর্থ ফেরত দিতে হবে। বিস্তারিত জানতে ফাউন্ডেশনের কার্যালয়ে কর্মদিবসে যোগাযোগ করুন।

