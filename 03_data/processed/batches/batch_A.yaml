    বকফুল আবাসিক মডেল স্কুলে ২০২৭ শিক্ষাবর্ষে চতুর্থ থেকে নবম শ্রেণিতে আবাসিক ও অনাবাসিক উভয় শাখায় ভর্তি চলছে। বিদ্যালয়ের আবাসিক ভবনে বর্তমানে ২৬৫ জন শিক্ষার্থীর থাকার ব্যবস্থা রয়েছে। ছাত্র ও ছাত্রীদের জন্য আলাদা ভবন এবং প্রতিটি ভবনে সার্বক্ষণিক আবাসিক শিক্ষক ও নারী তত্ত্বাবধায়ক রয়েছেন।

    আবাসিক শিক্ষার্থীদের মাসিক খরচ ৭,২০০ টাকা, যার মধ্যে থাকা, খাওয়া, সন্ধ্যাকালীন তত্ত্বাবধানে পড়াশোনা এবং ধোপার খরচ অন্তর্ভুক্ত। টিউশন ফি আলাদাভাবে দিতে হবে। আবাসিক শিক্ষার্থীদের প্রতিদিন সকালে শরীরচর্চা এবং সন্ধ্যায় নির্ধারিত সময়ে পড়ার টেবিলে বসা বাধ্যতামূলক।

    অভিভাবকরা প্রতি মাসের প্রথম ও তৃতীয় শুক্রবার সকাল ১০টা থেকে দুপুর ১টা পর্যন্ত সন্তানের সঙ্গে দেখা করতে পারবেন। বিশেষ প্রয়োজনে প্রধান শিক্ষকের অনুমতি নিয়ে অন্য দিনেও সাক্ষাৎ করা যাবে। শিক্ষার্থীরা মোবাইল ফোন ব্যবহার করতে পারবে না, তবে অভিভাবকদের সঙ্গে কথা বলার জন্য অফিসের ফোন নির্ধারিত সময়ে ব্যবহার করা যাবে।

    আবাসিক শাখায় ভর্তির সময় শিক্ষার্থীর স্বাস্থ্য সনদ, টিকা কার্ডের কপি এবং অভিভাবকের জাতীয় পরিচয়পত্রের কপি জমা দিতে হবে। বিছানাপত্র ও ব্যক্তিগত ব্যবহারের জিনিসপত্র শিক্ষার্থীকে নিজে আনতে হবে। ভর্তি পরীক্ষার তারিখ ও সময় অফিস থেকে জেনে নেওয়ার অনুরোধ করা হলো।

