    চন্দনপিড়ি কলেজের দ্বাদশ শ্রেণির নির্বাচনী পরীক্ষায় উত্তীর্ণ শিক্ষার্থীদের জানানো যাচ্ছে যে, ২০২৮ সালের উচ্চ মাধ্যমিক পরীক্ষার ফরম পূরণ কার্যক্রম শুরু হয়েছে। ফরম পূরণের শেষ তারিখ ১২ ডিসেম্বর ২০২৭। নির্ধারিত তারিখের পর বিলম্ব ফিসহ কেবল বোর্ডের অনুমোদিত সময়ের মধ্যে ফরম পূরণ করা যাবে।

    মানবিক ও ব্যবসায় শিক্ষা বিভাগের শিক্ষার্থীদের ফরম পূরণ ফি ২,৯৬০ টাকা। বিজ্ঞান বিভাগের শিক্ষার্থীদের ফরম পূরণ ফি ব্যবহারিক পরীক্ষার খরচসহ ৩,১৮০ টাকা। মানোন্নয়ন ও অনিয়মিত পরীক্ষার্থীদের ফি বিষয়সংখ্যার ভিত্তিতে আলাদাভাবে নির্ধারিত হবে। ফি কলেজের হিসাব শাখায় অথবা মোবাইল ব্যাংকিংয়ের মাধ্যমে জমা দেওয়া যাবে।

    ফরম পূরণের আগে শিক্ষার্থীদের সকল বকেয়া বেতন ও অন্যান্য পাওনা পরিশোধ করতে হবে। ফরমে নাম, পিতা-মাতার নাম, জন্মতারিখ ও বিষয় কোড সঠিকভাবে লেখা হয়েছে কি না, তা শিক্ষার্থীকে নিজে যাচাই করে স্বাক্ষর করতে হবে। পরে কোনো ভুলের দায় কলেজ কর্তৃপক্ষ নেবে না।

    ফরম পূরণের সময় শিক্ষার্থীদের সদ্য তোলা দুই কপি রঙিন ছবি, মাধ্যমিক পরীক্ষার নম্বরপত্রের ফটোকপি এবং রেজিস্ট্রেশন কার্ডের ফটোকপি জমা দিতে হবে। বিভাগভিত্তিক ফরম পূরণের দিন ও কক্ষ নম্বর নোটিশ বোর্ডে দেওয়া আছে। নির্ধারিত দিনে উপস্থিত না হলে পরবর্তী সময়ে ফরম পূরণে জটিলতা হতে পারে।

