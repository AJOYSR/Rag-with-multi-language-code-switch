    জলটুঙি গণপাঠাগারের সকল সদস্য ও শুভানুধ্যায়ীকে আনন্দের সঙ্গে জানানো যাচ্ছে যে, পাঠাগারের সংগ্রহ আরও সমৃদ্ধ হয়েছে। একজন প্রবাসী শুভানুধ্যায়ী পাঠাগারকে ৮৭৫টি বই দান করেছেন। দান করা বইয়ের মধ্যে রয়েছে উপন্যাস, ইতিহাস, বিজ্ঞান, মুক্তিযুদ্ধ বিষয়ক গ্রন্থ এবং শিশু-কিশোরদের জন্য সচিত্র বই।

    নতুন বইগুলো শ্রেণিবিন্যাস ও তালিকাভুক্ত করার কাজ চলছে এবং আগামী মাসের মধ্যে সেগুলো পাঠকদের জন্য উন্মুক্ত করা হবে। শিশু-কিশোরদের বইগুলোর জন্য পাঠাগারের নিচতলায় একটি আলাদা শিশু কর্নার তৈরি করা হচ্ছে।

    এ উপলক্ষে পাঠাগার একটি সদস্য সংগ্রহ অভিযান শুরু করেছে। সাধারণ সদস্যদের বার্ষিক চাঁদা ৩৬০ টাকা। শিক্ষার্থীদের জন্য পরিচয়পত্র দেখানো সাপেক্ষে চাঁদায় ছাড় দেওয়া হবে। সদস্যরা একবারে দুটি বই সর্বোচ্চ চৌদ্দ দিনের জন্য বাড়িতে নিতে পারবেন। নির্ধারিত সময়ের মধ্যে বই ফেরত না দিলে প্রতিদিনের জন্য জরিমানা দিতে হবে।

    পাঠাগার প্রতিদিন বিকেল ৩টা থেকে রাত ৮টা পর্যন্ত খোলা থাকে, শুধু বুধবার সাপ্তাহিক বন্ধ। পাঠাগারে পত্রিকা পড়ার কক্ষ সবার জন্য উন্মুক্ত, এর জন্য সদস্য হওয়ার প্রয়োজন নেই। যাঁরা পাঠাগারে বই দান করতে চান, তাঁরা পাঠাগার সম্পাদকের সঙ্গে যোগাযোগ করতে পারেন। পাঠাগারকে এলাকার জ্ঞানচর্চার কেন্দ্র হিসেবে গড়ে তুলতে সকলের সহযোগিতা কামনা করছি।

