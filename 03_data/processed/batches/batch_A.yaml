    নতুন সেশনে ভর্তি চলছে — জানুয়ারি ২০২৭

    শিশুদের সৃজনশীলতা বিকাশের লক্ষ্যে কুমড়োফুল শিশু চিত্রাঙ্কন বিদ্যালয়ে জানুয়ারি ২০২৭ সেশনে চার থেকে চৌদ্দ বছর বয়সী শিশুদের ভর্তি চলছে। বয়স অনুযায়ী শিশুদের তিনটি দলে ভাগ করে ক্লাস নেওয়া হবে: কুঁড়ি, পাপড়ি ও ফুল। প্রতিটি দলে সপ্তাহে দুই দিন, শুক্র ও শনিবার সকালে ক্লাস হবে।

    ক্লাসে পেনসিল স্কেচ, জলরং, প্যাস্টেল, কোলাজ এবং মাটির কাজ শেখানো হবে। বড় দলের শিশুদের জন্য বছরে দুবার প্রকৃতি দেখে আঁকার বিশেষ আয়োজন থাকবে। প্রতিটি ক্লাসের শেষে শিশুদের আঁকা ছবি নিয়ে আলোচনা করা হয়, যাতে তারা নিজের কাজ নিয়ে কথা বলতে শেখে।

    ভর্তি ফি ৫০০ টাকা। প্রতিটি শিশুর মাসিক বেতন ১,৩৫০ টাকা, যা প্রতি মাসের প্রথম সপ্তাহে পরিশোধ করতে হবে। আঁকার খাতা ও প্রাথমিক রং বিদ্যালয় থেকে সরবরাহ করা হবে, তবে উন্নত মানের রং ও তুলি অভিভাবকদের কিনে দিতে হবে। একই পরিবারের দুই শিশু ভর্তি হলে দ্বিতীয় শিশুর ভর্তি ফি লাগবে না।

    আগামী ১৪ জুলাই ২০২৭ তারিখে শিক্ষার্থীদের আঁকা ছবি নিয়ে বিদ্যালয়ের বার্ষিক চিত্র প্রদর্শনী অনুষ্ঠিত হবে, যেখানে সেরা ছবিগুলোকে পুরস্কৃত করা হবে। ভর্তির সময় শিশুর জন্মনিবন্ধন সনদের কপি ও দুই কপি ছবি জমা দিতে হবে। অভিভাবকদের ক্লাস চলাকালীন অপেক্ষার জন্য আলাদা কক্ষ রয়েছে।

