    বিলকুমারী কৃষি বিশ্ববিদ্যালয়ের ২০২৭-২৮ শিক্ষাবর্ষে কৃষি, ভেটেরিনারি, মৎস্য ও কৃষি প্রকৌশল অনুষদের স্নাতক প্রথম বর্ষে ভর্তির জন্য আবেদন আহ্বান করা হচ্ছে। চারটি অনুষদে মোট ৪৮০টি আসনে শিক্ষার্থী ভর্তি করা হবে। উচ্চ মাধ্যমিক পরীক্ষায় বিজ্ঞান বিভাগ থেকে উত্তীর্ণ শিক্ষার্থীরা নির্ধারিত যোগ্যতা পূরণ সাপেক্ষে আবেদন করতে পারবে।

    ভর্তি পরীক্ষা হবে বহুনির্বাচনী পদ্ধতিতে, যেখানে পদার্থবিজ্ঞান, রসায়ন, জীববিজ্ঞান ও গণিত থেকে প্রশ্ন থাকবে। ভুল উত্তরের জন্য নম্বর কাটা হবে। পরীক্ষার কেন্দ্র বিশ্ববিদ্যালয় ক্যাম্পাসের বিভিন্ন ভবনে নির্ধারিত হবে এবং প্রবেশপত্রে কক্ষ নম্বর উল্লেখ থাকবে।

    এ বছর ভর্তি পরীক্ষা কমিটির আহ্বায়কের দায়িত্ব পালন করবেন উদ্ভিদ রোগতত্ত্ব বিভাগের অধ্যাপক ড. সুলতানা পারভীন ঝুমুর। ভর্তি পরীক্ষা সংক্রান্ত যেকোনো অভিযোগ লিখিতভাবে কমিটির কাছে জমা দেওয়া যাবে। পরীক্ষার ফলাফল বিশ্ববিদ্যালয়ের নোটিশ বোর্ডে এবং প্রার্থীর মোবাইলে ক্ষুদে বার্তার মাধ্যমে জানানো হবে।

    আবেদন ফি ১,১০০ টাকা, যা মোবাইল ব্যাংকিংয়ের মাধ্যমে পরিশোধ করতে হবে। পরীক্ষার দিন প্রবেশপত্র ও জাতীয় পরিচয়পত্র বা জন্মনিবন্ধন সনদের মূল কপি সঙ্গে আনতে হবে। পরীক্ষা শুরুর আধা ঘণ্টা পর কোনো প্রার্থীকে কেন্দ্রে প্রবেশ করতে দেওয়া হবে না। ক্যালকুলেটর ও মোবাইল ফোন ব্যবহার সম্পূর্ণ নিষিদ্ধ।

