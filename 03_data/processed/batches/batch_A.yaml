    চৈতালিপুর বালিকা উচ্চ বিদ্যালয়ের পরিচালনা কমিটির সিদ্ধান্ত অনুযায়ী বিদ্যালয়ে খণ্ডকালীন ভিত্তিতে শিক্ষক নিয়োগের জন্য যোগ্য প্রার্থীদের কাছ থেকে দরখাস্ত আহ্বান করা হচ্ছে। বিদ্যালয়ে সহকারী শিক্ষক পদে মোট ১১টি শূন্য পদে নিয়োগ দেওয়া হবে। পদগুলো বিভিন্ন বিষয়ে, এবং বিষয়ভিত্তিক বিস্তারিত তালিকা বিদ্যালয়ের অফিসে দেখা যাবে।

    প্রার্থীকে সংশ্লিষ্ট বিষয়ে স্নাতক বা সমমানের ডিগ্রিধারী হতে হবে। শিক্ষাজীবনের কোনো পরীক্ষায় তৃতীয় বিভাগ বা সমমানের ফল গ্রহণযোগ্য হবে না। বিএড ডিগ্রিধারী ও শিক্ষকতায় অভিজ্ঞ প্রার্থীদের অগ্রাধিকার দেওয়া হবে। আবেদনের তারিখে প্রার্থীর বয়স ৩৫ বছরের বেশি হওয়া যাবে না। নারী প্রার্থীরা বিশেষভাবে আবেদন করতে উৎসাহিত হচ্ছেন।

    আবেদনপত্র সাদা কাগজে প্রধান শিক্ষক বরাবর লিখতে হবে। আবেদনের সঙ্গে সকল শিক্ষাগত সনদের সত্যায়িত কপি, জাতীয় পরিচয়পত্রের কপি, অভিজ্ঞতার সনদ (যদি থাকে) এবং দুই কপি সদ্য তোলা ছবি দিতে হবে। আবেদন ফি বাবদ ৫০০ টাকার ব্যাংক ড্রাফট সংযুক্ত করতে হবে, যা অফেরতযোগ্য।

    আবেদনপত্র ২২ এপ্রিল ২০২৭ তারিখের মধ্যে বিদ্যালয়ের অফিসে সরাসরি বা ডাকযোগে পৌঁছাতে হবে। লিখিত ও মৌখিক পরীক্ষার তারিখ যোগ্য প্রার্থীদের মোবাইলে ক্ষুদে বার্তার মাধ্যমে জানানো হবে। পরীক্ষায় অংশগ্রহণের জন্য কোনো ভাতা দেওয়া হবে না। নিয়োগের ব্যাপারে পরিচালনা কমিটির সিদ্ধান্তই চূড়ান্ত।

