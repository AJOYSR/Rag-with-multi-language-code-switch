    ডিপ্লোমা ইন ইঞ্জিনিয়ারিং প্রথম পর্বে ভর্তি সংক্রান্ত বিজ্ঞপ্তি

    বনফুলহাটি পলিটেকনিক ইনস্টিটিউটে ২০২৭-২৮ শিক্ষাবর্ষে চার বছর মেয়াদি ডিপ্লোমা ইন ইঞ্জিনিয়ারিং কোর্সের প্রথম পর্বে ভর্তির জন্য নির্বাচিত শিক্ষার্থীদের জানানো যাচ্ছে যে, চূড়ান্ত ভর্তির শেষ তারিখ ২১ সেপ্টেম্বর ২০২৭। ইনস্টিটিউটে সিভিল, ইলেকট্রিক্যাল, মেকানিক্যাল ও কম্পিউটার — এই চারটি টেকনোলজিতে ভর্তি নেওয়া হচ্ছে।

    ভর্তির সময় প্রত্যেক শিক্ষার্থীকে ভর্তি ফি বাবদ ৫,৩৫০ টাকা জমা দিতে হবে। এর মধ্যে ছয় মাসের বেতন, পরিচয়পত্র, গ্রন্থাগার ও ব্যবহারিক ক্লাসের খরচ অন্তর্ভুক্ত। ভর্তির সময় মাধ্যমিক পরীক্ষার মূল নম্বরপত্র, প্রশংসাপত্র এবং চার কপি ছবি জমা দিতে হবে। মূল কাগজপত্র যাচাইয়ের পর ফেরত দেওয়া হবে।

    প্রথম পর্বের ক্লাস শুরু হবে ৪ অক্টোবর ২০২৭ তারিখে। প্রথম সপ্তাহে নবীন শিক্ষার্থীদের জন্য পরিচিতি ক্লাস এবং ওয়ার্কশপ ও ল্যাবরেটরি ব্যবহারের নিরাপত্তা বিষয়ে প্রশিক্ষণ দেওয়া হবে। ওয়ার্কশপে প্রবেশের সময় নির্ধারিত পোশাক ও নিরাপত্তা জুতা পরা বাধ্যতামূলক।

    নির্ধারিত সময়ের মধ্যে ভর্তি না হলে শিক্ষার্থীর মনোনয়ন বাতিল হবে এবং অপেক্ষমাণ তালিকা থেকে শূন্য আসন পূরণ করা হবে। ইনস্টিটিউটে সীমিত আসনের ছাত্রাবাস আছে; আগ্রহী শিক্ষার্থীরা ভর্তির পর ছাত্রাবাস সুপারের কাছে আবেদন করতে পারবে। ভর্তি সংক্রান্ত যেকোনো তথ্যের জন্য একাডেমিক শাখায় যোগাযোগ করুন।

