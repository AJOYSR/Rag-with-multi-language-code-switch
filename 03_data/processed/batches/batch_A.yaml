    সুপারিবাগান টিচার্স ট্রেনিং কলেজে ২০২৭ শিক্ষাবর্ষে এক বছর মেয়াদি বিএড (প্রফেশনাল) কোর্সে ভর্তির জন্য আবেদন আহ্বান করা হচ্ছে। কোর্সটি দুই সেমিস্টারে বিভক্ত এবং শুক্র ও শনিবার সাপ্তাহিক ছুটির দিনে ক্লাস নেওয়া হয়, ফলে কর্মরত শিক্ষকরাও সহজে অংশ নিতে পারবেন।

    যেকোনো বিষয়ে স্নাতক ডিগ্রিধারী প্রার্থীরা আবেদন করতে পারবেন। কর্মরত শিক্ষকদের ক্ষেত্রে প্রতিষ্ঠানপ্রধানের অনাপত্তিপত্র জমা দিতে হবে। আবেদনপত্র কলেজের অফিস থেকে সংগ্রহ করে ১৮ আগস্ট ২০২৭ তারিখের মধ্যে জমা দিতে হবে। আবেদনপত্রের সঙ্গে সকল শিক্ষাগত সনদের সত্যায়িত কপি এবং তিন কপি ছবি দিতে হবে।

    প্রতি সেমিস্টারের কোর্স ফি ১২,৮০০ টাকা। ভর্তির সময় এককালীন রেজিস্ট্রেশন ফি আলাদাভাবে পরিশোধ করতে হবে। ফি কিস্তিতে দেওয়ার সুযোগ নেই। কোর্স চলাকালীন প্রত্যেক প্রশিক্ষণার্থীকে নিকটবর্তী একটি মাধ্যমিক বিদ্যালয়ে ছয় সপ্তাহের অনুশীলন পাঠদান সম্পন্ন করতে হবে।

    কলেজে সমৃদ্ধ গ্রন্থাগার, মাল্টিমিডিয়া শ্রেণিকক্ষ এবং শিক্ষা উপকরণ তৈরির জন্য আলাদা কর্মশালা রয়েছে। ক্লাসে ন্যূনতম পঁচাত্তর শতাংশ উপস্থিতি বাধ্যতামূলক, অন্যথায় চূড়ান্ত পরীক্ষায় অংশ নেওয়া যাবে না। কোর্স শেষে অধিভুক্ত বিশ্ববিদ্যালয়ের অধীনে চূড়ান্ত পরীক্ষা অনুষ্ঠিত হবে। বিস্তারিত তথ্যের জন্য কলেজের অফিসে শুক্র ও শনিবার সকাল ৯টা থেকে বিকেল ৪টার মধ্যে যোগাযোগ করুন।

