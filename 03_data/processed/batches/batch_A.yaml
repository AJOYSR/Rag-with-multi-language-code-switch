    নিমফুলিয়া প্রকৌশল বিশ্ববিদ্যালয়ের ছাত্রকল্যাণ দপ্তরের পক্ষ থেকে সকল শিক্ষার্থীর অবগতির জন্য জানানো যাচ্ছে যে, জানুয়ারি ২০২৭ থেকে দপ্তরে নতুন দায়িত্ব বণ্টন কার্যকর হয়েছে। বিশ্ববিদ্যালয়ের ছাত্রকল্যাণ উপদেষ্টা হিসেবে দায়িত্ব নিয়েছেন যন্ত্রকৌশল বিভাগের অধ্যাপক ড. মাসুদুর রহমান ভূঁইয়া। শিক্ষার্থীদের যেকোনো ব্যক্তিগত, আর্থিক বা আবাসন সংক্রান্ত সমস্যায় ছাত্রকল্যাণ দপ্তরে যোগাযোগ করতে উৎসাহিত করা হচ্ছে।

    এ বছর থেকে ছাত্রকল্যাণ দপ্তর একটি জরুরি আর্থিক সহায়তা তহবিল চালু করেছে। পরিবারের আকস্মিক দুর্যোগ, গুরুতর অসুস্থতা বা অভিভাবকের মৃত্যুর মতো পরিস্থিতিতে একজন শিক্ষার্থী এই তহবিল থেকে সর্বোচ্চ ১৫,০০০ টাকা পর্যন্ত এককালীন সহায়তা পেতে পারে। সহায়তার পরিমাণ সংশ্লিষ্ট কমিটি প্রয়োজন বিবেচনা করে নির্ধারণ করবে।

    সহায়তার জন্য আবেদন করতে বিভাগীয় প্রধানের সুপারিশসহ নির্ধারিত ফরম পূরণ করে দপ্তরে জমা দিতে হবে। আবেদনের সঙ্গে সমস্যার সপক্ষে প্রয়োজনীয় কাগজপত্র, যেমন চিকিৎসার ব্যবস্থাপত্র বা হাসপাতালের বিল, সংযুক্ত করতে হবে। আবেদনকারীর পরিচয় ও তথ্য সম্পূর্ণ গোপন রাখা হবে।

    এছাড়া দপ্তরে মানসিক স্বাস্থ্য পরামর্শ সেবা চালু রয়েছে, যেখানে প্রশিক্ষিত পরামর্শদাতারা সপ্তাহে তিন দিন শিক্ষার্থীদের সঙ্গে কথা বলেন। পরামর্শ সেবার জন্য আগে থেকে সময় নির্ধারণ করে নিতে হবে। দপ্তর রবিবার থেকে বৃহস্পতিবার সকাল ৯টা থেকে বিকেল ৪টা পর্যন্ত খোলা থাকে।

