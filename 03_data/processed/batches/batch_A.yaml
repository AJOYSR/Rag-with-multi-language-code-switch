    ডিপ্লোমা ইন নার্সিং সায়েন্স অ্যান্ড মিডওয়াইফারি কোর্সে ভর্তি বিজ্ঞপ্তি ২০২৭

    মাধবীকুঞ্জ নার্সিং ইনস্টিটিউটে ২০২৭ শিক্ষাবর্ষে তিন বছর মেয়াদি ডিপ্লোমা ইন নার্সিং সায়েন্স অ্যান্ড মিডওয়াইফারি কোর্সে ভর্তির জন্য আবেদন আহ্বান করা হচ্ছে। কোর্সে মোট ৬০টি আসন রয়েছে। উচ্চ মাধ্যমিক বা সমমানের পরীক্ষায় যেকোনো বিভাগ থেকে উত্তীর্ণ শিক্ষার্থীরা আবেদন করতে পারবে, তবে জীববিজ্ঞান বিষয়সহ উত্তীর্ণদের অগ্রাধিকার দেওয়া হবে।

    আবেদন ফি ৭০০ টাকা। আবেদন অনলাইনে ইনস্টিটিউটের ওয়েবসাইটের মাধ্যমে জমা দেওয়া যাবে। আবেদনকারীর বয়স ভর্তির বছরের ১ জানুয়ারি তারিখে ১৭ থেকে ৩০ বছরের মধ্যে হতে হবে। বিবাহিত ও অবিবাহিত উভয় প্রার্থীই আবেদন করতে পারবেন।

    প্রার্থী বাছাই করা হবে লিখিত পরীক্ষা, মৌখিক পরীক্ষা ও স্বাস্থ্য পরীক্ষার ভিত্তিতে। লিখিত পরীক্ষায় বাংলা, ইংরেজি, সাধারণ জ্ঞান এবং জীববিজ্ঞান থেকে প্রশ্ন থাকবে। মৌখিক পরীক্ষায় উত্তীর্ণ প্রার্থীদের স্বাস্থ্য পরীক্ষার জন্য ইনস্টিটিউটের সংশ্লিষ্ট হাসপাতালে উপস্থিত হতে হবে।

    কোর্স চলাকালীন শিক্ষার্থীদের হাতে-কলমে প্রশিক্ষণের জন্য নিয়মিত হাসপাতালের বিভিন্ন ওয়ার্ডে দায়িত্ব পালন করতে হবে। ইনস্টিটিউট ক্যাম্পাসে ছাত্রীদের জন্য সীমিত সংখ্যক আবাসিক আসন রয়েছে। কোর্স শেষে নার্সিং কাউন্সিলের লাইসেন্সিং পরীক্ষায় অংশ নিতে হবে। ভর্তি সংক্রান্ত অন্যান্য তথ্যের জন্য ইনস্টিটিউটের ভর্তি শাখায় যোগাযোগ করুন।

