    সংশ্লিষ্ট সকলের অবগতির জন্য জানানো যাচ্ছে যে, দাখিল পরীক্ষা ২০২৭-এর জন্য শ্যামলকুড়ি দাখিল মাদ্রাসাকে পরীক্ষাকেন্দ্র হিসেবে অনুমোদন দেওয়া হয়েছে। পরীক্ষা আগামী ১৫ ফেব্রুয়ারি ২০২৭ তারিখ থেকে শুরু হবে। এ বছর মাদ্রাসা কেন্দ্রে মোট ৩৮৬ জন পরীক্ষার্থী দাখিল পরীক্ষায় অংশ নেবে।

    পরীক্ষার্থীদের পরীক্ষা শুরুর অন্তত আধা ঘণ্টা আগে কেন্দ্রে উপস্থিত হতে হবে। প্রবেশপত্র ও রেজিস্ট্রেশন কার্ড ছাড়া কাউকে পরীক্ষার কক্ষে প্রবেশ করতে দেওয়া হবে না। পরীক্ষার্থীরা কেবল স্বচ্ছ কলমদানি, সাধারণ ক্যালকুলেটর ও জ্যামিতি বক্স সঙ্গে আনতে পারবে। মোবাইল ফোনসহ যেকোনো ইলেকট্রনিক যন্ত্র কেন্দ্রে আনা সম্পূর্ণ নিষিদ্ধ।

    পরীক্ষা চলাকালীন কেন্দ্রের চারপাশে অভিভাবক ও বহিরাগতদের ভিড় না করার অনুরোধ করা হচ্ছে। কেন্দ্রের দুইশো গজের মধ্যে সব ধরনের ফটোকপি দোকান বন্ধ থাকবে। আসনবিন্যাস পরীক্ষার আগের দিন বিকেলে মাদ্রাসার নোটিশ বোর্ডে টাঙিয়ে দেওয়া হবে, যাতে পরীক্ষার্থীরা আগে থেকে নিজের কক্ষ খুঁজে নিতে পারে।

    পরীক্ষাকেন্দ্রে অসদুপায় অবলম্বন করলে সংশ্লিষ্ট পরীক্ষার্থীকে বহিষ্কার করা হবে এবং বোর্ডের নিয়ম অনুযায়ী ব্যবস্থা নেওয়া হবে। অসুস্থ পরীক্ষার্থীদের জন্য কেন্দ্রে আলাদা কক্ষ ও প্রাথমিক চিকিৎসার ব্যবস্থা থাকবে। সকলের সহযোগিতায় শান্তিপূর্ণ পরিবেশে পরীক্ষা সম্পন্ন হবে বলে আশা করা হচ্ছে।

