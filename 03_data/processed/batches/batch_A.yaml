    বিশ্ববিদ্যালয় ভর্তি প্রস্তুতি: নতুন ব্যাচের ঘোষণা

    উচ্চ মাধ্যমিক পরীক্ষার পর বিশ্ববিদ্যালয় ভর্তি পরীক্ষার প্রস্তুতির জন্য দূর্বাঘাস একাডেমি নতুন ব্যাচে ভর্তি শুরু করেছে। নতুন ব্যাচের ক্লাস শুরু হবে ২ জুন ২০২৭ তারিখে। একাডেমিতে বিজ্ঞান, মানবিক ও ব্যবসায় শিক্ষা শাখার জন্য আলাদা আলাদা কোর্স পরিচালনা করা হয়।

    গত বছর এই একাডেমির ১৫৮ জন শিক্ষার্থী বিভিন্ন সরকারি বিশ্ববিদ্যালয়ে ভর্তির সুযোগ পেয়েছে। একাডেমির শিক্ষকমণ্ডলীতে রয়েছেন বিভিন্ন বিশ্ববিদ্যালয়ের শিক্ষার্থী ও অভিজ্ঞ শিক্ষক, যাঁরা নিয়মিত ক্লাসের পাশাপাশি ব্যক্তিগত পরামর্শও দিয়ে থাকেন।

    কোর্সে প্রতিদিন তিনটি ক্লাস হবে এবং প্রতি সপ্তাহের শেষে একটি সাপ্তাহিক পরীক্ষা নেওয়া হবে। পরীক্ষার ফলাফল অভিভাবকদের মোবাইলে ক্ষুদে বার্তার মাধ্যমে জানানো হবে। দূরের শিক্ষার্থীদের জন্য একাডেমির কাছে কয়েকটি মেসে থাকার ব্যবস্থা করে দেওয়া হয়, যদিও এর খরচ শিক্ষার্থীকে নিজে বহন করতে হবে।

    কোর্স ফি দুই কিস্তিতে পরিশোধ করা যাবে। উচ্চ মাধ্যমিক পরীক্ষায় ভালো ফল করা শিক্ষার্থীদের জন্য ফিতে ছাড় রয়েছে। ভর্তির সময় উচ্চ মাধ্যমিক পরীক্ষার প্রবেশপত্রের ফটোকপি এবং দুই কপি ছবি জমা দিতে হবে। আসন সীমিত হওয়ায় আগে ভর্তি হওয়া শিক্ষার্থীরা পছন্দের সময়ের ব্যাচ বেছে নেওয়ার সুযোগ পাবে। বিস্তারিত তথ্যের জন্য একাডেমির অফিসে সকাল ৯টা থেকে রাত ৮টার মধ্যে যোগাযোগ করুন।

