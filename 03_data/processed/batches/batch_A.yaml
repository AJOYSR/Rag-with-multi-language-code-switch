    কেন্দ্রীয় গ্রন্থাগারের নতুন পাঠকক্ষ চালু সংক্রান্ত বিজ্ঞপ্তি

    আমলকীতলা কলেজের সকল শিক্ষার্থী ও শিক্ষকের অবগতির জন্য জানানো যাচ্ছে যে, কলেজের কেন্দ্রীয় গ্রন্থাগারের সম্প্রসারিত অংশে একটি নতুন পাঠকক্ষ আগামী ৩ মার্চ ২০২৭ তারিখ থেকে চালু করা হবে। পাঠকক্ষটি গ্রন্থাগার ভবনের দোতলায় অবস্থিত এবং সম্পূর্ণ শীতাতপ নিয়ন্ত্রিত।

    নতুন পাঠকক্ষে একসঙ্গে ১৪৪ জন শিক্ষার্থী বসে পড়তে পারবে। পাঠকক্ষে ওয়াই-ফাই সুবিধা, ল্যাপটপ চার্জ দেওয়ার ব্যবস্থা এবং দৃষ্টিপ্রতিবন্ধী শিক্ষার্থীদের জন্য বিশেষ কর্নার থাকবে। পরীক্ষার মৌসুমে পাঠকক্ষ রাত ৯টা পর্যন্ত খোলা রাখা হবে।

    পাঠকক্ষ ব্যবহারের জন্য শিক্ষার্থীদের কলেজের বৈধ পরিচয়পত্র সঙ্গে রাখতে হবে এবং প্রবেশের সময় রেজিস্টারে নাম লিখতে হবে। পাঠকক্ষে খাবার গ্রহণ ও উচ্চস্বরে কথা বলা নিষিদ্ধ। মোবাইল ফোন নীরব রাখতে হবে। গ্রন্থাগারের রেফারেন্স বই পাঠকক্ষের বাইরে নেওয়া যাবে না।

    এছাড়া গ্রন্থাগারে সম্প্রতি প্রায় দুই হাজার নতুন বই যুক্ত হয়েছে, যার বেশির ভাগই পাঠ্যসূচিভিত্তিক সহায়ক গ্রন্থ। বই ধার নেওয়ার নিয়ম আগের মতোই থাকবে। শিক্ষার্থীরা গ্রন্থাগারের নতুন সংগ্রহ সম্পর্কে পরামর্শ দিতে চাইলে গ্রন্থাগারের অভিযোগ ও পরামর্শ বাক্সে লিখিত মতামত জমা দিতে পারবে। গ্রন্থাগারের সম্পদ রক্ষায় সকলের সহযোগিতা কামনা করা হচ্ছে।

