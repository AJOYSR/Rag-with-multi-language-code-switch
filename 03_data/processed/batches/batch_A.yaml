    ভাটিয়ালিগঞ্জ বিশ্ববিদ্যালয়ের ২০২৭-২৮ শিক্ষাবর্ষের স্নাতক প্রথম বর্ষ ভর্তি পরীক্ষা বিশ্ববিদ্যালয় ক্যাম্পাসে অনুষ্ঠিত হবে। এ বছর বিভিন্ন বিভাগে মোট ১,৮৬০ আসনের বিপরীতে ভর্তি পরীক্ষা নেওয়া হবে। প্রবেশপত্রে প্রতিটি পরীক্ষার্থীর কেন্দ্র, ভবন ও কক্ষ নম্বর উল্লেখ থাকবে।

    পরীক্ষার্থীদের পরীক্ষা শুরুর অন্তত এক ঘণ্টা আগে ক্যাম্পাসে পৌঁছাতে হবে। ভর্তি পরীক্ষার দিন শহরের রেলস্টেশন ও বাস টার্মিনাল থেকে পরীক্ষার্থীদের জন্য বিশ্ববিদ্যালয়ের বিনামূল্যে বাস সেবা চালু থাকবে। অভিভাবকদের অপেক্ষার জন্য ক্যাম্পাসের কেন্দ্রীয় মাঠে প্যান্ডেল টানানো হবে, তবে তাঁরা পরীক্ষার ভবনে প্রবেশ করতে পারবেন না।

    পরীক্ষার্থীরা শুধু প্রবেশপত্র, কালো কালির বলপয়েন্ট কলম এবং স্বচ্ছ পানির বোতল সঙ্গে আনতে পারবে। ঘড়ি, ক্যালকুলেটর, মোবাইল ফোন বা যেকোনো ইলেকট্রনিক যন্ত্র সঙ্গে রাখা সম্পূর্ণ নিষিদ্ধ। কোনো পরীক্ষার্থী নিষিদ্ধ বস্তুসহ ধরা পড়লে তার পরীক্ষা বাতিল করা হবে।

    ক্যাম্পাসে বিভিন্ন স্থানে তথ্যকেন্দ্র ও স্বেচ্ছাসেবক থাকবে, যারা পরীক্ষার্থীদের নির্দিষ্ট ভবন খুঁজে পেতে সহায়তা করবে। অসুস্থ পরীক্ষার্থীদের জন্য মেডিকেল সেন্টারে জরুরি চিকিৎসার ব্যবস্থা থাকবে। ফলাফল প্রকাশের পর মেধাক্রম অনুযায়ী বিভাগ বাছাইয়ের নির্দেশনা আলাদাভাবে জানানো হবে।

