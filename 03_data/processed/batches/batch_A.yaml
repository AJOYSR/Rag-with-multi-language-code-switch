    বেসরকারি শিক্ষক নিবন্ধন পরীক্ষার প্রার্থীদের জন্য নিশিন্দা চাকরি প্রস্তুতি কেন্দ্র একটি নিবিড় ক্র্যাশ কোর্স চালু করতে যাচ্ছে। কোর্সে মোট ৪৫টি ক্লাস হবে, যেখানে বাংলা, ইংরেজি, গণিত, সাধারণ জ্ঞান এবং বিষয়ভিত্তিক অংশের প্রস্তুতি দেওয়া হবে। স্কুল ও কলেজ পর্যায়ের প্রার্থীদের জন্য আলাদা ব্যাচ থাকবে।

    প্রতিটি অধ্যায় শেষে একটি ছোট পরীক্ষা এবং মাসে দুটি পূর্ণাঙ্গ মডেল টেস্ট নেওয়া হবে। বিগত বছরগুলোর প্রশ্নের বিশ্লেষণ ও সমাধান ক্লাস কোর্সের অন্যতম আকর্ষণ। ক্লাস নেবেন অভিজ্ঞ শিক্ষক এবং ইতিমধ্যে নিবন্ধন পরীক্ষায় উত্তীর্ণ প্রশিক্ষকরা।

    ক্র্যাশ কোর্সের ফি ৮,৯০০ টাকা, যার মধ্যে সব লেকচার শিট ও মডেল টেস্টের খরচ অন্তর্ভুক্ত। যাঁরা শুধু কেন্দ্রের পাঠকক্ষ ও প্রশ্নব্যাংক ব্যবহার করতে চান, তাঁদের জন্য মাসিক ১,০০০ টাকার আলাদা সদস্যপদ রয়েছে। কোর্স ফি এককালীন অথবা দুই কিস্তিতে পরিশোধ করা যাবে।

    ভর্তির সময় স্নাতক বা স্নাতকোত্তর সনদের ফটোকপি এবং এক কপি ছবি জমা দিতে হবে। ক্লাস হবে শুক্র ও শনিবার সকাল ৯টা থেকে দুপুর ১টা পর্যন্ত, যাতে কর্মরত প্রার্থীরাও অংশ নিতে পারেন। নিয়মিত উপস্থিত ও মডেল টেস্টে ভালো ফল করা প্রার্থীদের বিশেষ পরামর্শ সেশনে ডাকা হবে। আসন সীমিত হওয়ায় দ্রুত যোগাযোগ করার অনুরোধ করা হলো।

