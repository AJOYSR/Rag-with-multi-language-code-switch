    তালপাখা কম্পিউটার প্রশিক্ষণ কেন্দ্রে আগামী জানুয়ারি ২০২৭ থেকে "অফিস অ্যাপ্লিকেশন ও গ্রাফিক ডিজাইন" কোর্সের নতুন ব্যাচ শুরু হচ্ছে। কোর্সের মেয়াদ চার মাস। কোর্সে কম্পিউটারের প্রাথমিক ব্যবহার, ওয়ার্ড প্রসেসিং, স্প্রেডশিট, প্রেজেন্টেশন, ইন্টারনেট ব্যবহার এবং প্রাথমিক গ্রাফিক ডিজাইন শেখানো হবে।

    প্রতিটি ব্যাচে সর্বোচ্চ ২৫ জন প্রশিক্ষণার্থী ভর্তি করা হবে, যাতে প্রত্যেকে আলাদা কম্পিউটারে হাতে-কলমে অনুশীলনের সুযোগ পান। সকালের ব্যাচের ক্লাস সপ্তাহে চার দিন, প্রতিদিন দুই ঘণ্টা করে হবে। নারী প্রশিক্ষণার্থীদের জন্য আলাদা একটি বিকেলের ব্যাচ চালু থাকবে। ন্যূনতম শিক্ষাগত যোগ্যতা অষ্টম শ্রেণি পাস।

    কোর্স ফি মোট ৬,৫০০ টাকা, যা দুই কিস্তিতে পরিশোধ করা যাবে। প্রথম কিস্তি ভর্তির সময় এবং দ্বিতীয় কিস্তি কোর্স শুরুর দুই মাসের মধ্যে দিতে হবে। ফি মোবাইল ব্যাংকিং বা নগদে জমা দেওয়া যাবে। কোর্স শেষে লিখিত ও ব্যবহারিক মূল্যায়নের পর সফল প্রশিক্ষণার্থীদের সনদপত্র দেওয়া হবে। নিয়মিত উপস্থিতি ন্যূনতম আশি শতাংশ না হলে মূল্যায়নে অংশ নেওয়া যাবে না।

    ভর্তির জন্য শিক্ষাগত সনদের ফটোকপি, জাতীয় পরিচয়পত্র বা জন্মনিবন্ধনের কপি এবং এক কপি ছবি সঙ্গে আনতে হবে। আসন সীমিত, তাই আগে এলে আগে ভর্তির ভিত্তিতে আসন বরাদ্দ করা হবে।

