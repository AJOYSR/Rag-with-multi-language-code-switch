    কুমিরজোলা ডিগ্রি কলেজের দ্বাদশ শ্রেণির বিজ্ঞান, মানবিক ও ব্যবসায় শিক্ষা শাখার সকল শিক্ষার্থীর অবগতির জন্য জানানো যাচ্ছে যে, দ্বাদশ শ্রেণির নির্বাচনী পরীক্ষা আগামী ১৪ সেপ্টেম্বর ২০২৭ তারিখ থেকে শুরু হবে। পরীক্ষা প্রতিদিন সকাল ১০টায় শুরু হবে এবং কলেজের মূল ভবনের কক্ষগুলোতে অনুষ্ঠিত হবে।

    পরীক্ষায় অংশগ্রহণের জন্য প্রত্যেক শিক্ষার্থীকে পরীক্ষার ফি বাবদ ১,২৫০ টাকা কলেজের হিসাব শাখায় জমা দিতে হবে। ফি জমার রসিদ দেখিয়ে প্রবেশপত্র সংগ্রহ করতে হবে। যেসব শিক্ষার্থীর মাসিক বেতন বা অন্যান্য পাওনা বকেয়া আছে, তাদের বকেয়া পরিশোধ না করলে প্রবেশপত্র দেওয়া হবে না।

    নির্বাচনী পরীক্ষায় উত্তীর্ণ শিক্ষার্থীরাই কেবল উচ্চ মাধ্যমিক পরীক্ষার ফরম পূরণ করতে পারবে। কোনো বিষয়ে অকৃতকার্য হলে বিশেষ বিবেচনার জন্য অধ্যক্ষ বরাবর লিখিত আবেদন করতে হবে, তবে অনুমোদন সম্পূর্ণ কলেজ কর্তৃপক্ষের বিবেচনার ওপর নির্ভর করবে। পরীক্ষার হলে মোবাইল ফোন, স্মার্টওয়াচ বা যেকোনো ইলেকট্রনিক যন্ত্র আনা সম্পূর্ণ নিষিদ্ধ। শুধু সাধারণ ক্যালকুলেটর ব্যবহার করা যাবে।

    বিস্তারিত সময়সূচি কলেজের নোটিশ বোর্ডে টাঙিয়ে দেওয়া হয়েছে। কোনো শিক্ষার্থী অসুস্থতার কারণে পরীক্ষায় অনুপস্থিত থাকলে চিকিৎসকের সনদসহ শ্রেণিশিক্ষককে জানাতে হবে।

