    ময়নাদ্বীপ বিশ্ববিদ্যালয়ের বিভিন্ন বিভাগে ২০২৭ শিক্ষাবর্ষের নিয়মিত স্নাতকোত্তর প্রোগ্রামে ভর্তির জন্য আবেদন আহ্বান করা হচ্ছে। এ বছর সব বিভাগ মিলিয়ে মোট ৩২০টি আসনে শিক্ষার্থী ভর্তি করা হবে। চার বছর মেয়াদি স্নাতক (সম্মান) ডিগ্রিধারী প্রার্থীরা সংশ্লিষ্ট বা নিকটবর্তী বিষয়ে আবেদন করতে পারবেন।

    আবেদনকারীকে স্নাতক পর্যায়ে ন্যূনতম সিজিপিএ ২.৭৫ পেতে হবে। যাঁদের স্নাতক পরীক্ষার ফল এখনও প্রকাশিত হয়নি, তাঁরা বিভাগীয় প্রধানের প্রত্যয়নপত্রসহ শর্তসাপেক্ষে আবেদন করতে পারবেন। স্নাতকোত্তর ভর্তির আবেদন ফি ১,৬৫০ টাকা। আবেদনপত্রের সঙ্গে সকল শিক্ষাগত সনদ ও নম্বরপত্রের সত্যায়িত কপি জমা দিতে হবে।

    প্রার্থী বাছাই করা হবে লিখিত পরীক্ষা ও মৌখিক পরীক্ষার ভিত্তিতে। কিছু বিভাগে স্নাতক পর্যায়ের ফলাফলও বিবেচনায় নেওয়া হবে। বিভাগভিত্তিক পরীক্ষার সময়সূচি সংশ্লিষ্ট বিভাগের নোটিশ বোর্ডে প্রকাশ করা হবে।

    স্নাতকোত্তর প্রোগ্রাম এক বছর মেয়াদি এবং দুটি সেমিস্টারে বিভক্ত। থিসিস গ্রুপ ও নন-থিসিস গ্রুপ — দুই ধরনের সুযোগ রয়েছে, তবে থিসিস গ্রুপে আসন সীমিত। কর্মজীবী শিক্ষার্থীদের জন্য আলাদা সান্ধ্যকালীন প্রোগ্রাম রয়েছে, যার বিজ্ঞপ্তি আলাদাভাবে প্রকাশ করা হবে। বিস্তারিত তথ্যের জন্য সংশ্লিষ্ট বিভাগের অফিসে যোগাযোগ করুন।

