    সুন্দরীকাঠ কলেজ
    বইমেলা ২০২৭ উপলক্ষে বিজ্ঞপ্তি

    শিক্ষার্থীদের মধ্যে বই পড়ার আগ্রহ বাড়াতে সুন্দরীকাঠ কলেজের সাহিত্য সংসদের উদ্যোগে কলেজ প্রাঙ্গণে তিন দিনব্যাপী বইমেলার আয়োজন করা হয়েছে। মেলা চলবে ফেব্রুয়ারি ২০২৭-এর তৃতীয় সপ্তাহে, প্রতিদিন সকাল ১০টা থেকে সন্ধ্যা ৭টা পর্যন্ত। মেলায় স্থানীয় ও আঞ্চলিক প্রকাশনা প্রতিষ্ঠানের মোট ৩২টি স্টল থাকবে।

    বইমেলা উদ্বোধন করবেন কলেজের প্রাক্তন শিক্ষার্থী ও স্থানীয় লেখক নাজমুন নাহার শিউলি। উদ্বোধনী অনুষ্ঠানে সভাপতিত্ব করবেন কলেজের অধ্যক্ষ। মেলার প্রতিদিন বিকেলে কবিতা আবৃত্তি, নতুন বইয়ের মোড়ক উন্মোচন এবং লেখক-পাঠক আড্ডার আয়োজন থাকবে।

    মেলায় সব বই কমপক্ষে পঁচিশ শতাংশ ছাড়ে বিক্রি করা হবে। কলেজের শিক্ষার্থীরা পরিচয়পত্র দেখিয়ে অতিরিক্ত ছাড় পাবে। মেলা চলাকালীন শিক্ষার্থীদের জন্য একটি বই পর্যালোচনা প্রতিযোগিতার আয়োজন করা হবে, যেখানে মেলা থেকে কেনা যেকোনো একটি বই নিয়ে লিখিত পর্যালোচনা জমা দিতে হবে।

    মেলা প্রাঙ্গণ ধূমপানমুক্ত থাকবে এবং পরিষ্কার-পরিচ্ছন্নতা বজায় রাখতে সাহিত্য সংসদের স্বেচ্ছাসেবকরা দায়িত্ব পালন করবেন। মেলা সবার জন্য উন্মুক্ত, প্রবেশের জন্য কোনো টিকিট লাগবে না। প্রকাশনা প্রতিষ্ঠানগুলোর স্টল বরাদ্দ সংক্রান্ত তথ্যের জন্য সাহিত্য সংসদের সাধারণ সম্পাদকের সঙ্গে যোগাযোগ করুন।

