    তিনজনের কক্ষে প্রতিটি আসনের মাসিক ভাড়া ৩,২০০ টাকা। ভাড়ার মধ্যে বিদ্যুৎ, পানি ও গ্যাসের বিল অন্তর্ভুক্ত। হোস্টেলের নিজস্ব ডাইনিংয়ে তিন বেলা খাবারের ব্যবস্থা আছে, যার জন্য আলাদাভাবে মাসিক খাবার খরচ দিতে হবে। ভর্তির সময় ফেরতযোগ্য জামানত হিসেবে ৪,০০০ টাকা জমা দিতে হবে, যা হোস্টেল ছাড়ার সময় ফেরত দেওয়া হবে।

    হোস্টেলে ২৪ ঘণ্টা নারী নিরাপত্তাকর্মী, সিসি ক্যামেরা, ওয়াই-ফাই এবং পড়ার জন্য একটি আলাদা কক্ষ রয়েছে। প্রতিদিন রাত ৯টার মধ্যে হোস্টেলে ফিরতে হবে। অতিথিরা কেবল নিচতলার অভ্যর্থনা কক্ষে সাক্ষাৎ করতে পারবেন; কক্ষে কোনো পুরুষ অতিথি প্রবেশ করতে পারবেন না।

    ভর্তির জন্য শিক্ষাপ্রতিষ্ঠানের পরিচয়পত্রের ফটোকপি, অভিভাবকের জাতীয় পরিচয়পত্রের কপি এবং দুই কপি ছবি জমা দিতে হবে। আবেদনের শেষ তারিখ ২০ জানুয়ারি ২০২৭। আসন সীমিত হওয়ায় আগে আবেদনকারীরা অগ্রাধিকার পাবেন। বিস্তারিত জানতে হোস্টেল সুপারের সঙ্গে সরাসরি যোগাযোগ করুন।

