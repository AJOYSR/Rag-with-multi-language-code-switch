    বেতফলপুর আদর্শ উচ্চ বিদ্যালয়ে ২০২৭ শিক্ষাবর্ষে ষষ্ঠ শ্রেণিতে ভর্তির জন্য আগ্রহী শিক্ষার্থীদের কাছ থেকে আবেদন আহ্বান করা হচ্ছে। প্রভাতি ও দিবা দুই শাখায় মোট ১২০টি আসন খালি আছে। পঞ্চম শ্রেণি পাস বা সমমানের পরীক্ষায় উত্তীর্ণ শিক্ষার্থীরা আবেদন করতে পারবে।

    আবেদন ফরম বিদ্যালয়ের অফিস থেকে সংগ্রহ করা যাবে। ফরমের সঙ্গে জন্মনিবন্ধন সনদের ফটোকপি, পঞ্চম শ্রেণির প্রশংসাপত্র এবং দুই কপি পাসপোর্ট সাইজের ছবি জমা দিতে হবে। ভর্তি পরীক্ষা হবে বাংলা, ইংরেজি ও গণিত বিষয়ে, মোট ৫০ নম্বরের। লিখিত পরীক্ষার ফলাফলের ভিত্তিতে মেধাতালিকা প্রকাশ করা হবে।

    মেধাতালিকায় স্থান পাওয়া শিক্ষার্থীদের ভর্তির সময় ভর্তি ফি বাবদ ১,৮৫০ টাকা পরিশোধ করতে হবে। ভর্তি ফি-র মধ্যে সেশন চার্জ, লাইব্রেরি ও বিজ্ঞানাগারের খরচ অন্তর্ভুক্ত। মাসিক বেতন আলাদাভাবে প্রতি মাসের ১০ তারিখের মধ্যে জমা দিতে হবে। দরিদ্র ও মেধাবী শিক্ষার্থীদের জন্য আংশিক বেতন মওকুফের সুযোগ রয়েছে; এ জন্য প্রধান শিক্ষকের বরাবর আলাদা আবেদন করতে হবে।

    বিদ্যালয়ের নির্ধারিত ইউনিফর্ম ভর্তির পর এক মাসের মধ্যে তৈরি করতে হবে। অভিভাবকদের ভর্তির দিন শিক্ষার্থীর সঙ্গে উপস্থিত থাকার অনুরোধ করা হলো। বিস্তারিত তথ্যের জন্য বিদ্যালয়ের অফিসে রবিবার থেকে বৃহস্পতিবার সকাল ৯টা থেকে দুপুর ১টার মধ্যে যোগাযোগ করুন।

