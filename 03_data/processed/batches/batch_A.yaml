    অসচ্ছল পরিবারের মেধাবী শিক্ষার্থীদের পড়াশোনা চালিয়ে যেতে সহায়তার জন্য ঝিঙেফুল শিক্ষা বৃত্তি ট্রাস্ট ২০২৭ সালের মেধাবৃত্তির আবেদন আহ্বান করছে। এ বছর উচ্চ মাধ্যমিক পর্যায়ে অধ্যয়নরত শিক্ষার্থীরা এই বৃত্তির জন্য আবেদন করতে পারবে। এ বছর মোট ৬৫ জন শিক্ষার্থীকে বৃত্তি দেওয়া হবে।

    আবেদনের যোগ্যতা: মাধ্যমিক পরীক্ষায় ন্যূনতম জিপিএ ৪.৫০ পেতে হবে এবং পরিবারের বার্ষিক আয় নির্ধারিত সীমার মধ্যে থাকতে হবে। আবেদনপত্রের সঙ্গে মাধ্যমিক পরীক্ষার নম্বরপত্র, বর্তমান প্রতিষ্ঠানের প্রত্যয়নপত্র, ইউনিয়ন পরিষদ বা পৌরসভা থেকে আয়ের সনদ এবং দুই কপি ছবি জমা দিতে হবে।

    নির্বাচিত শিক্ষার্থীরা দুই বছর ধরে প্রতি মাসে ১,৮০০ টাকা করে বৃত্তি পাবে। এছাড়া বছরে একবার বই কেনার জন্য এককালীন অনুদান দেওয়া হবে। বৃত্তি চালু থাকার জন্য শিক্ষার্থীকে প্রতিটি পরীক্ষায় সন্তোষজনক ফল করতে হবে এবং কলেজে নিয়মিত উপস্থিত থাকতে হবে। কোনো শিক্ষার্থী পড়াশোনা ছেড়ে দিলে তার বৃত্তি বাতিল হবে।

    আবেদনপত্র ট্রাস্টের কার্যালয়ে সরাসরি জমা দিতে হবে। প্রাথমিক বাছাইয়ের পর আবেদনকারীদের মৌখিক সাক্ষাৎকারের জন্য ডাকা হবে এবং প্রয়োজনে পরিবারের আর্থিক অবস্থা যাচাই করা হবে। ভুল তথ্য দিলে আবেদন বাতিল বলে গণ্য হবে।

