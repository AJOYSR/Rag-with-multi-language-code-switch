    শিক্ষার্থীদের মধ্যে বিজ্ঞানচর্চা ও উদ্ভাবনী চিন্তা ছড়িয়ে দিতে গোলপাতা উপজেলার মাধ্যমিক বিদ্যালয়গুলোর যৌথ উদ্যোগে গোলপাতা স্কুল বিজ্ঞান মেলা ২০২৭-এর আয়োজন করা হয়েছে। মেলা অনুষ্ঠিত হবে ১১ মে ২০২৭ তারিখে উপজেলা পরিষদ চত্বরে। ষষ্ঠ থেকে দশম শ্রেণির শিক্ষার্থীরা দলগতভাবে প্রকল্প নিয়ে অংশ নিতে পারবে।

    প্রতিটি দলে সর্বোচ্চ তিনজন শিক্ষার্থী থাকতে পারবে এবং প্রতিটি বিদ্যালয় সর্বোচ্চ চারটি প্রকল্প জমা দিতে পারবে। প্রকল্পগুলো দুটি বিভাগে ভাগ করা হবে: জুনিয়র বিভাগ (ষষ্ঠ থেকে অষ্টম শ্রেণি) এবং সিনিয়র বিভাগ (নবম ও দশম শ্রেণি)। পরিবেশ, কৃষি, নবায়নযোগ্য জ্বালানি ও দৈনন্দিন সমস্যার সমাধানভিত্তিক প্রকল্পকে বিশেষভাবে উৎসাহিত করা হচ্ছে।

    প্রকল্প নিবন্ধনের শেষ তারিখ ২৫ এপ্রিল ২০২৭। নিবন্ধনের সময় প্রকল্পের নাম, সংক্ষিপ্ত বিবরণ এবং তত্ত্বাবধায়ক শিক্ষকের নাম জমা দিতে হবে। নিবন্ধনের জন্য কোনো ফি লাগবে না। প্রতিটি বিভাগে সেরা তিনটি প্রকল্পকে সনদ ও ক্রেস্ট দেওয়া হবে এবং সেরা প্রকল্পটি জেলা পর্যায়ের মেলায় উপজেলার প্রতিনিধিত্ব করবে।

    মেলার দিন সকাল ৮টার মধ্যে প্রকল্প স্টলে স্থাপন করতে হবে। বিচারকরা দুপুর ১২টা থেকে স্টল পরিদর্শন করবেন। দাহ্য পদার্থ বা বিপজ্জনক রাসায়নিক ব্যবহার করা যাবে না। নিবন্ধন ফরম প্রত্যেক বিদ্যালয়ের প্রধান শিক্ষকের কাছে পাওয়া যাবে।

