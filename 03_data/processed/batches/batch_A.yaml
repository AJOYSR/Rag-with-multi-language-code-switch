    স্পোকেন ইংলিশ কোর্সে ভর্তি চলছে

    শিক্ষার্থী, চাকরিপ্রার্থী ও কর্মজীবীদের ইংরেজিতে সাবলীলভাবে কথা বলার দক্ষতা বাড়াতে কাঞ্চনবেলা ভাষা শিক্ষা কেন্দ্রে তিন মাস মেয়াদি স্পোকেন ইংলিশ কোর্সের নতুন ব্যাচে ভর্তি চলছে। কোর্সে মোট ৩৬টি ক্লাস হবে এবং প্রতিটি ক্লাস দেড় ঘণ্টার। সকাল ও সন্ধ্যা দুই সময়ে ব্যাচ রয়েছে।

    কোর্সে দৈনন্দিন কথোপকথন, উচ্চারণ, শব্দভান্ডার বৃদ্ধি, চাকরির সাক্ষাৎকারের প্রস্তুতি এবং উপস্থাপনা দক্ষতার ওপর বিশেষ গুরুত্ব দেওয়া হবে। প্রতিটি ক্লাসে দলগত আলোচনা ও ভূমিকাভিনয়ের মাধ্যমে অনুশীলন করানো হবে। প্রতি মাসের শেষে একটি মৌখিক মূল্যায়ন নেওয়া হবে।

    কোর্সের প্রধান প্রশিক্ষক হিসেবে থাকবেন তানজিলা হক অদিতি, যিনি দীর্ঘদিন ধরে ভাষা প্রশিক্ষণের সঙ্গে যুক্ত। প্রতিটি ব্যাচে সর্বোচ্চ বিশজন শিক্ষার্থী নেওয়া হবে, যাতে প্রত্যেকে কথা বলার পর্যাপ্ত সুযোগ পায়। কোর্স শেষে সফল শিক্ষার্থীদের সনদপত্র দেওয়া হবে।

    কোর্স ফি মোট ৫,৫০০ টাকা। শিক্ষার্থীদের জন্য পরিচয়পত্র দেখানো সাপেক্ষে বিশেষ ছাড় রয়েছে। ভর্তির জন্য এক কপি ছবি ও জাতীয় পরিচয়পত্র বা শিক্ষার্থী পরিচয়পত্রের ফটোকপি লাগবে। একটি বিনামূল্যের পরিচিতিমূলক ক্লাসে অংশ নিয়ে কোর্স সম্পর্কে ধারণা নেওয়া যাবে। বিস্তারিত জানতে কেন্দ্রের অভ্যর্থনা ডেস্কে যোগাযোগ করুন।

