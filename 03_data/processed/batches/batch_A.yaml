    সোনাপাতিলা বিশ্ববিদ্যালয়ের স্নাতক ও স্নাতকোত্তর পর্যায়ের উত্তীর্ণ শিক্ষার্থীদের জানানো যাচ্ছে যে, আগামী জানুয়ারি ২০২৭ থেকে নম্বরপত্র ও মূল সনদপত্রের আবেদন কেবল পরীক্ষা নিয়ন্ত্রকের দপ্তরের নতুন সেবা কাউন্টারে গ্রহণ করা হবে। পুরোনো প্রশাসনিক ভবনের কাউন্টারে আর কোনো আবেদন নেওয়া হবে না।

    সাধারণ আবেদনে নম্বরপত্র ১৫ কার্যদিবসের মধ্যে সরবরাহ করা হবে। সাধারণ আবেদনে প্রতিটি নম্বরপত্রের ফি ৮৫০ টাকা। জরুরি প্রয়োজনে তিন কার্যদিবসের মধ্যে নম্বরপত্র পেতে চাইলে জরুরি ফি বাবদ ২,৪০০ টাকা জমা দিতে হবে। মূল সনদপত্রের জন্য আলাদা আবেদন করতে হবে এবং প্রবেশপত্র ও রেজিস্ট্রেশন কার্ডের কপি জমা দিতে হবে।

    সকল ফি বিশ্ববিদ্যালয়ের নির্ধারিত ব্যাংক হিসাবে জমা দিতে হবে। ব্যাংকের জমা রসিদের মূল কপি আবেদনপত্রের সঙ্গে সংযুক্ত করতে হবে। আবেদনপত্রে শিক্ষার্থীর নাম, রোল নম্বর, রেজিস্ট্রেশন নম্বর ও পরীক্ষার বছর স্পষ্টভাবে লিখতে হবে। ভুল তথ্যের কারণে বিলম্ব হলে দপ্তর দায়ী থাকবে না।

    নম্বরপত্র বা সনদপত্র হারিয়ে গেলে থানায় সাধারণ ডায়েরির কপি ও একটি জাতীয় দৈনিকে প্রকাশিত বিজ্ঞপ্তির কপিসহ ডুপ্লিকেট কপির জন্য আবেদন করতে হবে। সেবা কাউন্টার রবিবার থেকে বৃহস্পতিবার সকাল ৯টা থেকে বিকেল ৪টা পর্যন্ত খোলা থাকবে।

