    কেওড়াখালী বিজ্ঞান ও প্রযুক্তি বিশ্ববিদ্যালয়ের ২০২৭-২৮ শিক্ষাবর্ষে প্রথম বর্ষ স্নাতক (সম্মান) শ্রেণিতে ভর্তি পরীক্ষায় উত্তীর্ণ ও মেধাতালিকায় স্থান পাওয়া শিক্ষার্থীদের জানানো যাচ্ছে যে, চূড়ান্ত ভর্তি কার্যক্রম সংশ্লিষ্ট বিভাগীয় অফিসে সম্পন্ন হবে। ভর্তির সময় শিক্ষার্থীদের মাধ্যমিক ও উচ্চ মাধ্যমিক পরীক্ষার মূল নম্বরপত্র ও প্রশংসাপত্র দেখাতে হবে।

    প্রথম বর্ষে ভর্তির জন্য মোট ভর্তি ফি ৯,৭৫০ টাকা, যার মধ্যে উন্নয়ন ফি, পরিচয়পত্র, চিকিৎসা ও গ্রন্থাগার ফি অন্তর্ভুক্ত। ফি বিশ্ববিদ্যালয়ের নির্ধারিত ব্যাংক শাখায় জমা দিয়ে রসিদের একটি কপি বিভাগে জমা দিতে হবে। ভর্তির পর প্রত্যেক শিক্ষার্থীকে বিশ্ববিদ্যালয়ের মেডিকেল সেন্টারে স্বাস্থ্য পরীক্ষা করাতে হবে।

    প্রথম বর্ষের শিক্ষার্থীদের জন্য এ বছর কোনো আবাসিক হলে আসন বরাদ্দ দেওয়া হবে না। বিশ্ববিদ্যালয়ের পরিবহন দপ্তর শহরের বিভিন্ন রুটে শিক্ষার্থীদের জন্য বাস সেবা চালু রেখেছে। নবীন শিক্ষার্থীদের জন্য ওরিয়েন্টেশন অনুষ্ঠানের সময়সূচি বিভাগের নোটিশ বোর্ডে প্রকাশ করা হবে।

    ভর্তির সময় শিক্ষার্থীকে র‍্যাগিংবিরোধী অঙ্গীকারনামায় স্বাক্ষর করতে হবে। কোনো শিক্ষার্থী নির্ধারিত সময়ের মধ্যে ভর্তি না হলে তার আসন শূন্য ঘোষণা করে অপেক্ষমাণ তালিকা থেকে ভর্তি করা হবে। বিস্তারিত তথ্যের জন্য ছাত্রকল্যাণ উপদেষ্টার দপ্তরে যোগাযোগ করা যেতে পারে।

