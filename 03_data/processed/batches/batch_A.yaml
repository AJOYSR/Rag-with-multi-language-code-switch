    বিদায় ও বরণ অনুষ্ঠানের আমন্ত্রণ

    মান্দারতলী উচ্চ বিদ্যালয়ের দীর্ঘদিনের প্রধান শিক্ষক জনাব নজরুল ইসলাম ফকির সুদীর্ঘ চাকরিজীবন শেষে অবসরে যাচ্ছেন। তাঁর বিদায় এবং নতুন প্রধান শিক্ষককে বরণ উপলক্ষে আগামী ১০ জানুয়ারি ২০২৭ তারিখে বিদ্যালয় মিলনায়তনে একটি অনুষ্ঠানের আয়োজন করা হয়েছে। অনুষ্ঠান শুরু হবে সকাল ১১টায়।

    বিদায়ী প্রধান শিক্ষক দীর্ঘ সময় ধরে বিদ্যালয়ের শিক্ষার মান উন্নয়ন, নতুন বিজ্ঞানাগার স্থাপন এবং দরিদ্র শিক্ষার্থীদের জন্য বিনা বেতনে পড়ার সুযোগ সৃষ্টিতে গুরুত্বপূর্ণ ভূমিকা রেখেছেন। তাঁর অবদানের স্বীকৃতিস্বরূপ বিদ্যালয়ের পক্ষ থেকে তাঁকে সম্মাননা স্মারক প্রদান করা হবে।

    বিদ্যালয়ের নতুন প্রধান শিক্ষক হিসেবে যোগদান করেছেন দিলরুবা ইয়াসমিন পাপড়ি, যিনি এর আগে পাশের উপজেলার একটি বালিকা বিদ্যালয়ে সহকারী প্রধান শিক্ষক ছিলেন। অনুষ্ঠানে তাঁকে আনুষ্ঠানিকভাবে বরণ করে নেওয়া হবে এবং তিনি বিদ্যালয়ের ভবিষ্যৎ পরিকল্পনা নিয়ে বক্তব্য দেবেন।

    অনুষ্ঠানে প্রাক্তন শিক্ষার্থী, অভিভাবক, পরিচালনা কমিটির সদস্য এবং এলাকার শিক্ষানুরাগী ব্যক্তিবর্গকে উপস্থিত থাকার আন্তরিক আমন্ত্রণ জানানো হচ্ছে। অনুষ্ঠান শেষে দুপুরের খাবারের ব্যবস্থা থাকবে। প্রাক্তন শিক্ষার্থীরা কোনো স্মৃতিচারণ বা উপহার দিতে চাইলে আয়োজক কমিটির সঙ্গে আগে যোগাযোগ করতে পারবেন। সকলের উপস্থিতি অনুষ্ঠানকে সফল করবে।

