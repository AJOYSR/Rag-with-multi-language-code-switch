    কুঁচিয়ামোড়া বিশ্ববিদ্যালয়ের চতুর্থ সমাবর্তন অনুষ্ঠিত হবে ২৩ ডিসেম্বর ২০২৭ তারিখে বিশ্ববিদ্যালয়ের কেন্দ্রীয় খেলার মাঠে। বিশ্ববিদ্যালয়ের বিভিন্ন অনুষদ থেকে স্নাতক, স্নাতকোত্তর, এমফিল ও পিএইচডি ডিগ্রিপ্রাপ্ত শিক্ষার্থীরা এই সমাবর্তনে অংশ নিতে পারবেন।

    সমাবর্তনে অংশ নিতে ইচ্ছুক গ্র্যাজুয়েটদের নির্ধারিত ফরম পূরণ করে নিবন্ধন করতে হবে। নিবন্ধন ফি ৪,৫০০ টাকা, যার মধ্যে সমাবর্তনের গাউন, টুপি, উপহারসামগ্রী ও দুপুরের খাবারের খরচ অন্তর্ভুক্ত। একাধিক ডিগ্রির জন্য নিবন্ধন করতে চাইলে প্রতিটি অতিরিক্ত ডিগ্রির জন্য আলাদা ফি দিতে হবে। নিবন্ধনের শেষ তারিখ ৩০ সেপ্টেম্বর ২০২৭।

    নিবন্ধিত গ্র্যাজুয়েটরা নিজ নিজ বিভাগ থেকে প্রবেশপত্র ও গাউন সংগ্রহ করবেন। প্রত্যেক গ্র্যাজুয়েট সর্বোচ্চ একজন অতিথিকে সঙ্গে আনতে পারবেন, যার জন্য আলাদা অতিথি পাস দেওয়া হবে। নিরাপত্তার কারণে প্রবেশপত্র ছাড়া কাউকে অনুষ্ঠানস্থলে প্রবেশ করতে দেওয়া হবে না।

    অনুষ্ঠানে কৃতী শিক্ষার্থীদের স্বর্ণপদক প্রদান করা হবে। স্বর্ণপদকপ্রাপ্তদের তালিকা আলাদাভাবে প্রকাশ করা হবে। সমাবর্তনের মূল মহড়া অনুষ্ঠানের আগের দিন অনুষ্ঠিত হবে, যেখানে স্বর্ণপদকপ্রাপ্তদের উপস্থিত থাকা বাধ্যতামূলক। বিস্তারিত তথ্যের জন্য রেজিস্ট্রার দপ্তরের সমাবর্তন সেলে যোগাযোগ করুন।

