    এলাকার দরিদ্র ও মেধাবী শিক্ষার্থীদের উৎসাহ দিতে সোনাঝুরি মেধাবৃত্তি পরিষদ প্রতি বছরের মতো এবারও মেধাবৃত্তি প্রদানের উদ্যোগ নিয়েছে। প্রবাসী ও স্থানীয় শিক্ষানুরাগীদের অনুদানে গঠিত তহবিল থেকে এ বছর মোট ৪০টি বৃত্তি দেওয়া হবে। বৃত্তিগুলো পঞ্চম ও অষ্টম শ্রেণির বার্ষিক পরীক্ষার ফলাফলের ভিত্তিতে নির্বাচিত শিক্ষার্থীদের দেওয়া হবে।

    আবেদনকারীকে অবশ্যই ইউনিয়নের স্থায়ী বাসিন্দা হতে হবে এবং সংশ্লিষ্ট শ্রেণির বার্ষিক পরীক্ষায় প্রথম বিভাগ বা সমমানের ফল করতে হবে। আবেদনপত্রের সঙ্গে নম্বরপত্রের কপি, প্রধান শিক্ষকের সুপারিশপত্র এবং ইউনিয়ন পরিষদ চেয়ারম্যানের কাছ থেকে নেওয়া নাগরিকত্ব সনদ জমা দিতে হবে।

    বৃত্তিপ্রাপ্ত শিক্ষার্থীরা এককালীন অর্থ, স্কুলব্যাগ ও শিক্ষা উপকরণ পাবে। বৃত্তি বিতরণ উপলক্ষে ইউনিয়ন পরিষদ মিলনায়তনে একটি অনুষ্ঠানের আয়োজন করা হবে, যেখানে অভিভাবকদেরও আমন্ত্রণ জানানো হবে।

    বৃত্তি সংক্রান্ত যেকোনো তথ্য ও আবেদনপত্র জমার জন্য পরিষদের সমন্বয়কারী আরিফুল হাসান তালুকদারের সঙ্গে যোগাযোগ করতে হবে। আবেদনপত্র শুধু শুক্রবার বিকেলে পরিষদের অস্থায়ী কার্যালয়ে গ্রহণ করা হবে। অসম্পূর্ণ আবেদন বা ভুল তথ্যসংবলিত আবেদন সরাসরি বাতিল করা হবে। পরিষদের সিদ্ধান্তই চূড়ান্ত বলে বিবেচিত হবে।

