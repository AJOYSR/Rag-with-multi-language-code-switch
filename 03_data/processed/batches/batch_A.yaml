    আসন্ন এসএসসি পরীক্ষার প্রস্তুতি জোরদার করতে জলপদ্ম একাডেমিক কোচিং সেন্টার পরীক্ষার্থীদের জন্য বিশেষ মডেল টেস্ট প্রোগ্রামের আয়োজন করেছে। এই প্রোগ্রামে বোর্ড পরীক্ষার আদলে মোট ১২টি মডেল টেস্ট নেওয়া হবে। প্রথম মডেল টেস্ট অনুষ্ঠিত হবে ১৬ জানুয়ারি ২০২৭ তারিখে।

    প্রতিটি মডেল টেস্টে সৃজনশীল ও বহুনির্বাচনী দুই ধরনের প্রশ্ন থাকবে এবং বোর্ডের নির্ধারিত সময় অনুযায়ী পরীক্ষা নেওয়া হবে। খাতা মূল্যায়ন করবেন অভিজ্ঞ শিক্ষকরা। প্রতিটি পরীক্ষার পর ভুল প্রশ্নগুলোর ওপর আলাদা সমাধান ক্লাস নেওয়া হবে, যাতে শিক্ষার্থীরা নিজেদের দুর্বলতা বুঝতে পারে।

    সবগুলো মডেল টেস্টের সমন্বিত ফলাফল ৯ ফেব্রুয়ারি ২০২৭ তারিখে প্রকাশ করা হবে। ফলাফলের ভিত্তিতে সেরা দশজন শিক্ষার্থীকে সম্মাননা ও শিক্ষা উপকরণ দেওয়া হবে। প্রত্যেক শিক্ষার্থীর বিষয়ভিত্তিক অগ্রগতির একটি প্রতিবেদন অভিভাবকদের কাছে পাঠানো হবে।

    এই প্রোগ্রামে অংশ নিতে কোচিংয়ের নিয়মিত শিক্ষার্থীদের কোনো অতিরিক্ত ফি লাগবে না। বাইরের শিক্ষার্থীরাও নির্ধারিত ফি দিয়ে অংশ নিতে পারবে। নিবন্ধনের সময় শিক্ষার্থীর বিদ্যালয়ের পরিচয়পত্র এবং এক কপি ছবি জমা দিতে হবে। পরীক্ষা চলাকালীন মোবাইল ফোন সঙ্গে রাখা যাবে না। নিবন্ধন ও বিস্তারিত তথ্যের জন্য কোচিংয়ের অফিসে বিকেল ৩টা থেকে রাত ৮টার মধ্যে যোগাযোগ করুন।

