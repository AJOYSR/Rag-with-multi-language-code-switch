    তেলাকুচা ইলেকট্রিক্যাল প্রশিক্ষণ কেন্দ্র
    হাউস ওয়্যারিং ও ইলেকট্রিক্যাল মেইনটেন্যান্স প্রশিক্ষণ

    বেকার যুবক ও যুব নারীদের কর্মসংস্থানের সুযোগ সৃষ্টির লক্ষ্যে তেলাকুচা ইলেকট্রিক্যাল প্রশিক্ষণ কেন্দ্রে তিন মাস মেয়াদি হাউস ওয়্যারিং ও ইলেকট্রিক্যাল মেইনটেন্যান্স প্রশিক্ষণের নতুন ব্যাচ শুরু হতে যাচ্ছে। প্রতিটি ব্যাচে ৩০ জন প্রশিক্ষণার্থী নেওয়া হবে। প্রশিক্ষণ হবে সপ্তাহে পাঁচ দিন, সকাল ৯টা থেকে দুপুর ১টা পর্যন্ত।

    আবেদনকারীর বয়স ১৮ থেকে ৩৫ বছরের মধ্যে এবং ন্যূনতম শিক্ষাগত যোগ্যতা অষ্টম শ্রেণি পাস হতে হবে। আবেদনের সঙ্গে জাতীয় পরিচয়পত্র বা জন্মনিবন্ধন সনদের কপি, শিক্ষাগত সনদের কপি এবং দুই কপি ছবি জমা দিতে হবে। প্রাথমিক বাছাইয়ের পর মৌখিক পরীক্ষার মাধ্যমে প্রশিক্ষণার্থী নির্বাচন করা হবে।

    প্রশিক্ষণে বাসাবাড়ির বৈদ্যুতিক সংযোগ, সার্কিট ব্রেকার ও মিটার স্থাপন, বৈদ্যুতিক যন্ত্রপাতি মেরামত এবং কর্মক্ষেত্রে নিরাপত্তা বিষয়ে হাতে-কলমে শেখানো হবে। প্রশিক্ষণ চলাকালীন প্রত্যেক প্রশিক্ষণার্থীকে দৈনিক ভাতা দেওয়া হবে। প্রশিক্ষণের প্রয়োজনীয় যন্ত্রপাতি ও উপকরণ কেন্দ্র থেকেই সরবরাহ করা হবে।

    প্রশিক্ষণ শেষে চূড়ান্ত মূল্যায়নে উত্তীর্ণদের সনদপত্র দেওয়া হবে। আগ্রহী প্রশিক্ষণার্থীদের স্থানীয় নির্মাণ প্রতিষ্ঠান ও বৈদ্যুতিক সরঞ্জাম বিক্রয়কেন্দ্রে চাকরি পেতে সহায়তা করা হবে। একটানা পাঁচ দিনের বেশি অনুপস্থিত থাকলে প্রশিক্ষণার্থীর নাম বাদ দেওয়া হতে পারে। আবেদন ফরম কেন্দ্রের অফিসে পাওয়া যাচ্ছে।

