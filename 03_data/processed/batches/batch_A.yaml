    স্নাতক (পাস) পরীক্ষার মূল সনদপত্র বিতরণ সংক্রান্ত বিজ্ঞপ্তি

    হিজলবনি মহিলা কলেজ থেকে স্নাতক (পাস) পরীক্ষায় উত্তীর্ণ শিক্ষার্থীদের জানানো যাচ্ছে যে, বিশ্ববিদ্যালয় থেকে মূল সনদপত্র কলেজে এসে পৌঁছেছে। আগামী ৭ জুন ২০২৭ তারিখ থেকে কলেজের পরীক্ষা শাখায় সনদপত্র বিতরণ শুরু হবে। সনদপত্র বিতরণ চলবে প্রতি কর্মদিবসে সকাল ১০টা থেকে দুপুর ২টা পর্যন্ত।

    সনদপত্র সংগ্রহের সময় কলেজের পরিচয়পত্র, পরীক্ষার প্রবেশপত্র এবং রেজিস্ট্রেশন কার্ডের মূল কপি দেখাতে হবে। সনদপত্র উত্তোলন ফি বাবদ ৩০০ টাকা কলেজের হিসাব শাখায় জমা দিয়ে রসিদ সংগ্রহ করতে হবে। কলেজের কাছে কোনো বকেয়া থাকলে তা পরিশোধ না করা পর্যন্ত সনদপত্র দেওয়া হবে না।

    সনদপত্র কোনো প্রতিনিধির মাধ্যমে দেওয়া হবে না; শিক্ষার্থীকে নিজে উপস্থিত হয়ে সংগ্রহ করতে হবে। সনদপত্র হাতে পাওয়ার পর তাৎক্ষণিকভাবে নাম, পিতা-মাতার নাম ও ফলাফল মিলিয়ে দেখতে অনুরোধ করা হলো। কোনো ভুল পাওয়া গেলে সংশোধনের জন্য পরীক্ষা শাখায় লিখিত আবেদন করতে হবে।

    যেসব শিক্ষার্থী এখনও প্রশংসাপত্র সংগ্রহ করেননি, তাঁরা একই সঙ্গে প্রশংসাপত্রের জন্য আবেদন করতে পারবেন। পরীক্ষা শাখায় ভিড় এড়াতে রোল নম্বরের ক্রম অনুযায়ী বিতরণের দিন ভাগ করে নোটিশ বোর্ডে টাঙিয়ে দেওয়া হয়েছে। বিতরণের সময়সূচিতে কোনো পরিবর্তন হলে তা নোটিশ বোর্ডে জানানো হবে।

