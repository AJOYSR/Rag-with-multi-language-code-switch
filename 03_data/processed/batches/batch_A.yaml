    পিয়ালবন উচ্চ বিদ্যালয়ে ২০২৭ শিক্ষাবর্ষে নবম শ্রেণির বিজ্ঞান ও ব্যবসায় শিক্ষা শাখায় কিছু আসন শূন্য রয়েছে। অন্য বিদ্যালয় থেকে অষ্টম শ্রেণি উত্তীর্ণ আগ্রহী শিক্ষার্থীরা এসব শূন্য আসনে ভর্তির জন্য আবেদন করতে পারবে। আবেদনপত্র জমার শেষ তারিখ ১৬ জানুয়ারি ২০২৭।

    নবম শ্রেণিতে কোনো ভর্তি পরীক্ষা নেওয়া হবে না; অষ্টম শ্রেণির বার্ষিক পরীক্ষার ফলাফলের ভিত্তিতে শিক্ষার্থী বাছাই করা হবে। আবেদনের সঙ্গে আগের বিদ্যালয়ের ছাড়পত্র, অষ্টম শ্রেণির নম্বরপত্রের কপি, জন্মনিবন্ধন সনদ এবং দুই কপি ছবি জমা দিতে হবে।

    নির্বাচিত শিক্ষার্থীদের ভর্তির সময় ভর্তি ফি বাবদ ২,২০০ টাকা পরিশোধ করতে হবে। এর মধ্যে সেশন চার্জ, ক্রীড়া ও সাংস্কৃতিক কার্যক্রমের খরচ অন্তর্ভুক্ত। নবম শ্রেণিতে ভর্তির পর শিক্ষার্থীদের বোর্ডে রেজিস্ট্রেশন করতে হবে, যার জন্য আলাদা ফি প্রযোজ্য হবে।

    বিদ্যালয়ে সুসজ্জিত বিজ্ঞানাগার, কম্পিউটার ল্যাব এবং সমৃদ্ধ গ্রন্থাগার রয়েছে। শিক্ষার্থীদের নিয়মিত উপস্থিতি নিশ্চিত করতে অভিভাবকদের মোবাইলে অনুপস্থিতির বার্তা পাঠানো হয়। বিজ্ঞান শাখার শিক্ষার্থীদের জন্য বিদ্যালয়ে বিশেষ সহায়ক ক্লাসের ব্যবস্থা রয়েছে। বিস্তারিত তথ্যের জন্য বিদ্যালয়ের অফিসে কর্মদিবসে সকাল ৯টা থেকে দুপুর ২টার মধ্যে যোগাযোগ করুন।

